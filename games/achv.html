function claim(r){
 if(disposed||readError||bulkPending||pending[r.id]||!CSHPage.requireSave())return;

  var active=document.activeElement,activeRow=active&&active.closest&&active.closest('.row'),restore=active===document.body||activeRow&&activeRow.dataset.id===r.id;
  $("message").textContent=ok?(data&&data.already?"已领取过该奖励":"已领取「"+r.name+"」奖励"):(data&&data.reason||"领取未完成，请回主界面后重试");render();
  if(restore){var row=$("list").querySelector('[data-id="'+r.id+'"]'),focus=row&&(row.querySelector("button.claim:not(:disabled)")||row.querySelector(".achievement-details>summary"));if(focus)focus.focus({preventScroll:true});}
 }

}
$("claim-all").addEventListener("click",function(){

 function next(){
  if(!active())return;
  if(readError){finish(total.count>0,{reason:"成就记录尚未读回，请恢复后重试",remaining:lastRemaining>0?lastRemaining:0});return;}
  if(!CSHPage.requireSave()){finish(total.count>0,{reason:"存档已更新，请重新进入",remaining:lastRemaining>0?lastRemaining:0});return;}
  var received=false;
  function done(ok,data){
   if(!active()||received)return;received=true;data=data||{};
   ["count","gained","meritGained"].forEach(function(k){if(Number.isSafeInteger(data[k])&&data[k]>0)total[k]+=data[k];});
   if(ok&&Number.isSafeInteger(data.remaining)&&data.remaining>0&&!data.reason&&(lastRemaining<0||data.remaining<lastRemaining)){lastRemaining=data.remaining;$("message").textContent="已领取 "+total.count+" 枚，继续领取中…";render();bulkTimer=setTimeout(next,0);}
   else finish(ok||total.count>0,data);
  }
  try{T.call("shell-pool-ach-claim-all",{},done);}catch(e){done(false,null);}
 }next();
});
