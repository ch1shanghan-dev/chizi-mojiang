<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>池子成就</title>
<script src="../core/csh_pool_achv.js"></script><script src="../core/csh_page.js"></script>
<style>
:root{color-scheme:dark;--bg:#171919;--panel:#202323;--line:#3c4141;--ink:#edf0eb;--muted:#bbc2bb;--accent:#ddc88e;--pfs-sm:12px;--pfs-md:14px;--pfs-lg:18px}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;overflow:hidden;padding:8px 12px;background:var(--bg);color:var(--ink);font:var(--pfs-md)/1.45 system-ui,"Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:5px}button{cursor:pointer;min-height:44px;padding:6px 12px}button:disabled{cursor:default;color:var(--muted)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;min-height:44px;flex-shrink:0;padding-right:var(--csh-dock-safe,clamp(150px,20vw,200px))}h1{font-size:var(--pfs-lg);margin:0;white-space:nowrap}#summary{color:var(--muted);font-size:var(--pfs-sm);margin:5px 0 7px}.filters{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}.filters input{flex:1 1 160px;width:140px;min-width:100px;padding:7px 9px;min-height:44px}.filters select{padding:5px;min-height:44px;max-width:100%}.note{margin:6px 0;color:var(--muted);font-size:var(--pfs-sm)}#message{color:var(--accent);min-height:18px;font-size:var(--pfs-sm);flex-shrink:0}#list{min-height:0;overflow:auto;flex:1;overscroll-behavior:contain;padding-bottom:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) 176px;gap:6px 18px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:center}.name{font-weight:700;font-size:var(--pfs-md)}.meta{font-size:var(--pfs-sm);font-weight:400;color:var(--muted);margin-left:10px}.condition{margin-top:2px;overflow-wrap:anywhere}.progress{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:var(--pfs-sm);color:var(--muted)}progress{width:100px;height:7px;accent-color:var(--accent)}.reward{font-size:var(--pfs-sm);margin-bottom:4px}.claim{width:100%;min-height:44px}.claim.ready{border-color:var(--accent);color:var(--accent)}.claim.done{background:transparent;border-color:transparent}.hint{font-size:var(--pfs-sm);color:var(--muted);margin-top:2px}.empty{padding:30px 10px;color:var(--muted)}
@media(max-width:540px){body{padding:6px 9px}.row{grid-template-columns:minmax(0,1fr) 120px;gap:8px}.meta{display:block;margin:0}.reward{font-size:var(--pfs-sm)}.filters{gap:5px}.filters input{flex-basis:100%;width:100%}.filters select{flex:1;min-width:0}header{gap:8px}h1{font-size:var(--pfs-md)}}
@media(max-height:430px) and (min-width:541px){body{padding-top:3px}.row{padding:6px 2px}.note{margin:3px 0}.hint{display:none}#summary{margin:2px 0 4px}}
</style>
</head><body>
<header><h1>池子成就</h1></header>
<div id="summary"></div>
<div class="filters" aria-label="成就筛选">
<input id="search" type="search" placeholder="搜索名称或条件" aria-label="搜索名称或条件">
<select id="category" aria-label="分类"><option>全部分类</option><option>操作</option><option>连击</option><option>逆境</option><option>模式</option><option>武将</option></select>
<select id="status" aria-label="状态"><option>全部状态</option><option>待领取</option><option>未解锁</option><option>已领取</option></select>
<select id="sort" aria-label="排序"><option>待领优先</option><option>进度优先</option><option>原始顺序</option></select>
</div>
<div class="note">单机身份、斗地主、对决中记录；单局条件显示历史最佳，武将胜场跨局累计。</div>
<div id="message" role="status" aria-live="polite"></div>
<main id="list" aria-label="成就列表"></main>
<script>
(function(){
"use strict";
var PA=window.CSH_POOL_ACHV,T=window.CSHPage.transport({closeName:"achv-close",timeout:3500}),pending={},store;
var $=function(id){return document.getElementById(id);},mode={identity:"身份",doudizhu:"斗地主",versus:"对决"};
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
if(!PA){$("message").textContent="成就未就绪，请关闭后重开";return;}
function state(r){return pending[r.id]?"待领取":store.seen[r.id]?"已领取":store.got[r.id]?"待领取":"未解锁";}
function render(){
 PA.reconcile();store=PA.load();var total=PA.RULES.length,got=0,paid=0;
 PA.RULES.forEach(function(r){if(store.got[r.id])got++;if(store.got[r.id]&&store.seen[r.id]&&!pending[r.id])paid++;});
 $("summary").textContent="已解锁 "+got+" / "+total+" · 待领取 "+(got-paid)+" · 已领取 "+paid;
 if(PA.storageError())$("message").textContent=PA.storageError();
 var q=$("search").value.trim(),cat=$("category").value,st=$("status").value;
 var rows=PA.RULES.filter(function(r){return (cat==="全部分类"||r.cat===cat)&&(st==="全部状态"||state(r)===st)&&(!q||(r.name+" "+r.desc+" "+r.cat).indexOf(q)>=0);});
 var sort=$("sort").value;
 rows.sort(function(a,b){if(sort==="待领优先")return (state(a)==="待领取"?-1:state(a)==="未解锁"?0:1)-(state(b)==="待领取"?-1:state(b)==="未解锁"?0:1);if(sort==="进度优先"){var pa=PA.progress(a,store),pb=PA.progress(b,store);return pb.value/pb.target-pa.value/pa.target;}return 0;});
 var list=$("list");list.textContent="";
 if(!rows.length){list.appendChild(el("div","empty","没有匹配的成就，试试其他筛选条件。"));return;}
 rows.forEach(function(r){
  var row=el("article","row"),main=el("div"),aside=el("div"),nm=el("div","name",r.name),rw=PA.reward(r),pr=PA.progress(r,store);
  row.dataset.id=r.id;nm.appendChild(el("span","meta",r.cat+" · "+(r.modes.length?r.modes.map(function(m){return mode[m];}).join(" / "):"三种模式")));main.appendChild(nm);
  main.appendChild(el("div","condition",r.desc));
  var pg=el("div","progress"),bar=el("progress");bar.max=pr.target;bar.value=pr.value;bar.setAttribute("aria-label",r.name+"进度");pg.appendChild(bar);pg.appendChild(el("span","",pr.label+" "+pr.value+" / "+pr.target));main.appendChild(pg);
  if(r.hint)main.appendChild(el("div","hint",r.hint));
  aside.appendChild(el("div","reward",rw.pc+" 池子币 · "+rw.merit+" 基础功勋"));
  var stateNow=state(r),button=el("button","claim"+(stateNow==="待领取"?" ready":stateNow==="已领取"?" done":""),pending[r.id]?"领取中…":stateNow==="待领取"?"领取奖励":stateNow);
  button.type="button";button.disabled=stateNow!=="待领取"||!!pending[r.id];button.addEventListener("click",function(){claim(r);});aside.appendChild(button);row.appendChild(main);row.appendChild(aside);list.appendChild(row);
 });
}
function claim(r){
 if(pending[r.id])return;pending[r.id]=true;$("message").textContent="";render();
 T.call("shell-pool-ach-claim",{key:r.id},function(ok,data){delete pending[r.id];$("message").textContent=ok?(data&&data.already?"已领取过该奖励":"已领取「"+r.name+"」奖励"):(data&&data.reason||"领取未完成，请回主界面后重试");render();var row=$("list").querySelector('[data-id="'+r.id+'"] button');if(row&&!row.disabled)row.focus();});
}
["category","status","sort"].forEach(function(id){$(id).addEventListener("change",render);});$("search").addEventListener("input",render);
window.addEventListener("storage",function(e){if(!e.key||[PA.KEY,PA.PAY_KEY,"csh_wallet","csh_rank"].indexOf(e.key)>=0)render();});render();
})();
</script></body></html>
