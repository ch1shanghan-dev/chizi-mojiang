<!-- 2026-10-18：进页即预热 DNS/TLS，把「首包 0.8s」压到页面渲染之后、用户点开时已就绪。
     注意只预热 https 域名 —— 安卓 origin 是 https://localhost，明文 http 会被混合内容拦。 -->
<link rel="preconnect" href="https://chishanghan.duckdns.org" crossorigin>

<!-- 天下榜 v3（2026-10-15）：留名机制沿用 v2（一个出口网络只占一个位置；机器指纹参与身份识别），
     本轮三处体验返工：
       ① 榜单列表此前是"死"的——五十行只看得见八行。改全高 flex 布局，列表区自带滚动。
       ② 页面文案全部收进脚本顶部的文案表 T（一条真源），内部词一律换成世界观用语。
       ③ 题壁（旧称签名）此前是独立一行、只在更名时连带上送，容易被当成没保存——
          改为与名字一起落榜，并在界面上说明、留名后行内即见。
     花榜增强 v3.1（2026-10-15 · 作者口径"v2.2 三项"）：
       ① 每日首次免缠头：宿主（shell-cheer）按日键判定，第一次不扣池子币、只计 +1；
          判定与扣费都在宿主单一账本，页面只如实上报宿主给的量。
       ② 魁首题壁档案：榜行内显示「魁首 <名> · 壁上：xxx」金线签名条（服务端回 chief_name/chief_sig）；
          图鉴（codex.html）同款待另一侧接线（本页不碰 codex，避免文件冲突）。
       ③ 贡献称号：按"我对某只妖灵的累计缠头"分档随行显示（服务端回 me_amt/tier 档位键，
          来客可见的字只从文案表 T.tier 取）。
     ★ 通信走 Node 原生 http：游戏窗口是 file://（Chromium 安全上下文），
       fetch 明文 http 会被拦；本项目 app/main.js 开了
       nodeIntegration / nodeIntegrationInSubFrames / webSecurity:false
       ⇒ 渲染进程与 iframe 都能 require("http")，裸 socket 不受浏览器策略限制。
     ★ 失败一律**中性文案**：不弹错、不指责、不阻塞页面 —— 作者："不能让来玩的人感觉不适"。 -->
<script src="../core/csh_selftest.js" data-csh-selftest="auto"></script>
<script src="../core/csh_net.js"></script>
<script src="../core/csh_page.js"></script>
<style>
:root{
  --gold:#b08d3e; --gold-hi:#d8bd7a; --ink:#2f2a22; --ink-dim:#7a7264;
  --paper:#f5efe0; --paper-2:#efe8d7; --line:rgba(176,141,62,.30);
  --ff-body:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --fs-base:15px; --fs-cap:12.5px;

  /* 字号收编档（2026-10-20）：同值 token 替换裸字号，渲染不变；同档多值待实机测量后并档 */
  --pfs-micro: 9.5px;
  --pfs-micro2: 10px;
  --pfs-micro3: 10.5px;
  --pfs-cap: 11px;
  --pfs-cap2: 11.5px;
  --pfs-sm: 12px;
  --pfs-md: 13px;
  --pfs-xl: 16px;
  --pfs-xl2: 17px;
  --pfs-xl3: 19px;
  --pfs-2xl: 22px;
  --pfs-3xl: 26px;
}
*{box-sizing:border-box}
/* 全高 flex 列：#wrap 撑满 iframe 视口（iframe 是替换元素、由壳保证 100% 高，
   ⇒ 这里用 % 而不是 vw/vh，符合"页面禁 vh"红线），列表卡吸收剩余高度并内部滚动。 */
html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--ff-body);font-size:var(--fs-base)}
#wrap{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:18px 16px 20px}
#wrap>*{flex:0 0 auto}
h1{margin:0 0 2px;font-size:var(--pfs-3xl);letter-spacing:.10em;color:var(--ink)}
h1 small{display:block;font-size:var(--fs-cap);font-weight:400;letter-spacing:.16em;color:var(--gold);margin-top:5px}
.hr{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:14px 0 16px}
/* ============================================================
   花魁三席（2026-10-16 · 作者："花魁不用把 50 个美女全列出来，
   只需要列前三名的详细情况，比如打赏最高的几个人就行了"）
   ------------------------------------------------------------
   因此**废掉独立的主推位**（它与第一席是同一只妖灵，一屏里出现两次是重复），
   把"大立绘 + 文案"直接做进第一席卡；三席各自给出**打赏最高的几位**。
   50 位全表仍在（花榜页签的「照片墙 / 名录」两个版式）—— 不是为了"列出来看"，
   而是因为**打赏必须能覆盖到每一位**：只留三席的话，其余 47 位就再也没人能应援了。
   ============================================================ */
/* 三席网格：**auto-fit**（不是 auto-fill）—— auto-fill 会保留空轨，三席到头来
   可能被摊成"两席一行 + 独苗一行"（760 宽实测就是），殿堂感全没了；
   auto-fit 让空轨塌缩、三席均分整行。min 200px：760 宽能三席一行，412 宽自动竖排。 */
.chiefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:1px 1px 3px}
.chief{display:flex;flex-direction:column;gap:7px;background:#fffdf7;border:1px solid var(--line);
  border-radius:12px;padding:10px 11px;min-width:0}
/* 第一席：金边 + 极淡金底 —— "殿堂"与后两席一眼分开，但不是靠更大的字号堆出来的 */
.chief.c1{border-color:rgba(176,141,62,.62);
  background:linear-gradient(160deg,rgba(216,189,122,.18),rgba(255,253,247,0) 62%),#fffdf7;
  box-shadow:0 1px 0 rgba(0,0,0,.02),0 6px 18px -14px rgba(176,141,62,.85)}
.chd{display:flex;gap:9px;min-width:0}
.chpic{flex:0 0 74px;height:92px;border-radius:9px;background-position:center 12%;
  background-size:cover;background-repeat:no-repeat;background-color:#efe7d6;
  border:1px solid rgba(176,141,62,.34)}
.chief.c1 .chpic{flex-basis:86px;height:107px;border-color:rgba(176,141,62,.55)}
.chmeta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.chrk{font-size:var(--pfs-micro3);letter-spacing:.18em;color:var(--gold)}
.chief.c1 .chrk{color:#9b2234;font-weight:600}
.chnm{font-size:var(--pfs-xl2);font-weight:600;color:var(--ink);letter-spacing:.05em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chief.c1 .chnm{font-size:var(--pfs-xl3)}
.chtot{font-size:var(--pfs-md);color:#8a6b1e;font-variant-numeric:tabular-nums;font-weight:600}
.chtot .u{font-size:var(--pfs-micro3);font-weight:400;color:#a0958a;margin-left:3px}
.chsub{font-size:var(--pfs-micro3);color:#a0958a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chsub .tier{color:#9b2234;font-weight:600}
/* 打赏榜（该席"详细情况"的正体） */
.chpat{border-top:1px dashed rgba(176,141,62,.28);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.chph{font-size:var(--pfs-micro3);color:#a0958a;letter-spacing:.06em;margin-bottom:1px}
.chpr{display:flex;align-items:baseline;gap:6px;font-size:var(--pfs-cap2);min-width:0}
.chpr .prk{flex:0 0 13px;text-align:center;font-size:var(--pfs-micro2);font-weight:700;color:#fff;border-radius:999px;
  background:rgba(176,141,62,.55);line-height:1.5}
.chpr.p1 .prk{background:linear-gradient(160deg,#d8bd7a,#b08d3e)}
.chpr b{flex:0 0 auto;font-weight:600;color:var(--ink);max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chpr i{flex:1 1 auto;min-width:0;font-style:normal;color:#a0958a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chpr em{flex:0 0 auto;font-style:normal;font-variant-numeric:tabular-nums;color:#8a6b1e;font-weight:600}
.chpr.me b{color:#9b2234}
.chpr.me b::after{content:"你";margin-left:5px;font-size:var(--pfs-micro);font-weight:400;color:#9b2234;
  border:1px solid rgba(155,34,52,.45);border-radius:999px;padding:0 4px;vertical-align:1px}
.chpr.more{color:#a0958a;font-size:var(--pfs-micro3)}
.chempty{font-size:var(--pfs-cap2);color:#b3a998;font-style:normal}
.chbtn{margin-top:auto;align-self:flex-start;padding:4px 13px;border-radius:8px;border:1px solid var(--gold);
  background:#fff;color:#8a6b1e;font-size:var(--pfs-sm);font-family:var(--ff-body);cursor:pointer}
.chbtn:hover{background:rgba(176,141,62,.10)}
.chieftip{font-size:var(--pfs-cap);color:#a0958a;margin:8px 1px 0;line-height:1.6}
.card{background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:0 0 12px;
  box-shadow:0 1px 0 rgba(0,0,0,.02)}
.me{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.me input{flex:1 1 130px;min-width:100px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-family:var(--ff-body);font-size:var(--fs-base)}
.me button{flex:0 0 auto;padding:8px 14px;border-radius:9px;border:1px solid var(--gold);background:transparent;
  color:#8a6b1e;font-family:var(--ff-body);font-size:var(--fs-base);cursor:pointer}
.me button:hover{background:rgba(176,141,62,.10)}
/* 名字框短一点：名号本就 5 字上限，不该与题壁框等长（作者 2026-10-15） */
#nm{flex:0 1 34%;min-width:92px}
.hint{font-size:var(--pfs-cap);color:#a0958a;margin-top:7px;letter-spacing:.02em}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tabs button{flex:1 1 auto;padding:9px 6px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper-2);color:var(--ink-dim);font-family:var(--ff-body);font-size:var(--fs-base);cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
/* ---------- 榜单列表：可滚动区（README 红线 #5 / cookbook §9）----------
   铁律：可滚动容器必须显式 max-height + overflow-y:auto。此处 max-height:100% 取自
   flex 列中列表卡的确定高度（卡片吸收剩余视口高度），触屏再叠 -webkit-overflow-scrolling:touch。
   ★ 桌面与手机**同一套规则**，不写手机专属分支。 */
.card.sheet{display:flex;flex-direction:column;margin:0 0 6px}
#wrap>.card.sheet{flex:1 1 auto;min-height:0}
#rows{flex:1 1 auto;min-height:0;max-height:100%;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:2px}
.row{display:flex;align-items:baseline;gap:8px;padding:7px 4px;border-bottom:1px dashed rgba(176,141,62,.20)}
.row:last-child{border-bottom:0}
.row.me{background:rgba(176,141,62,.09);border-radius:8px}
.rk{width:2.8em;text-align:right;color:var(--ink-dim);font-variant-numeric:tabular-nums;font-size:var(--fs-cap)}
.rk.top{color:#9b2234;font-weight:700}
.nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{flex:0 0 auto;font-size:var(--pfs-micro3);color:#8a6b1e;background:rgba(176,141,62,.12);
  border-radius:999px;padding:1px 7px;letter-spacing:.04em}
/* 贡献称号胶囊（v2.2）：与官阶 seg 同形不同色 —— 暗红，一眼区分"我的位分"和"她的挂牌" */
.seg.tier{color:#9b2234;background:rgba(155,34,52,.10)}
.tm{flex:0 0 auto;font-size:var(--pfs-micro3);color:#a0958a}
.vl{font-variant-numeric:tabular-nums;color:#8a6b1e;font-weight:600}
.stat{font-size:var(--fs-cap);color:var(--ink-dim);min-height:1.3em;margin:2px 0 0}
.stat.bad{color:#a33}
.empty{color:var(--ink-dim);font-size:var(--fs-cap);padding:14px 2px;text-align:center}
/* 我自己的那条（哪怕不在前 N 名也常驻可见 —— v2 补齐的体验缺口） */
.mebar{background:linear-gradient(160deg,rgba(176,141,62,.13),rgba(176,141,62,.04));
  border:1px solid rgba(176,141,62,.34);border-radius:10px;padding:9px 12px;margin:0 0 12px;
  font-size:var(--fs-cap);color:#6d5a2c;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.mebar b{font-size:var(--fs-base);color:#8a6b1e}
.mebar .myv{font-variant-numeric:tabular-nums;font-weight:600;color:#8a6b1e}
/* 没轮到"我"的时候（无名次数据）这条横带是空的 —— 空盒子不该占掉一整行高度 */
#mebar:empty{display:none}
/* 题壁（旧称签名，v2.1 引入 / v3 改与名字同批落榜） */
.sgr{display:block;font-size:var(--pfs-cap);color:#a0958a;font-weight:400;margin-top:1px;letter-spacing:.02em}
.sgr.ct{color:#b08d3e}
.cheerbtn{flex:0 0 auto;padding:3px 9px;border-radius:8px;border:1px solid var(--gold);background:#fff;
  color:#8a6b1e;font-size:var(--pfs-cap2);cursor:pointer}
.cheerbtn:hover{background:rgba(176,141,62,.10)}
.ctop{color:#9b2234;font-size:var(--pfs-cap)}
.ctotal{font-variant-numeric:tabular-nums;color:#8a6b1e;font-weight:600}
.foot{font-size:var(--fs-cap);color:var(--ink-dim);line-height:1.7;margin-top:14px}

/* ============================================================
   v3 视觉层（2026-10-15）—— 只加表现，不改结构、不改逻辑。
   学的成熟做法（榜单类产品的通行经验）：
     · **名次分级徽记**：前三名用金/银/铜的圆形徽记，一眼分出"殿堂"，而不是把数字变红；
     · **斑马纹 + 悬停**：长列表横向扫读不串行（本项目列表最多 50 行，收益明显）；
     · **"我"的那条要一眼可见**：金色左缘竖线 + 极淡金底 + 尾部「你」小签；
     · **数字层级**：主数字加粗等宽，单位（池子币/缠头）压小压淡，避免满屏同权重；
     · **过渡统一**：非交互元素不加过渡，交互元素给 120~160ms（手机端不追求花哨）。
   纪律：全部字号由 --fs-base/--fs-cap 派生；无 vw/vh；不用 !important；不动滚动实现。
   ============================================================ */
/* 卡片顶部一层极淡金晕，让"纸面"有层次（纯装饰） */
.card.sheet{background:linear-gradient(180deg,rgba(216,189,122,.10),rgba(255,253,247,0) 42px),#fffdf7}
/* 斑马纹：偶数行极淡，长列表扫读更稳 */
#rows>.row:nth-child(even){background:rgba(176,141,62,.035)}
/* 名次徽记：1~3 名给"殿堂"感（金/银/铜），4 名以后回到朴素的右对齐数字 */
.rk{border-radius:999px;padding:1px 0;transition:background 140ms ease,color 140ms ease}
#rows>.row:nth-child(1) .rk,#rows>.row:nth-child(2) .rk,#rows>.row:nth-child(3) .rk{
  width:1.9em;text-align:center;font-weight:700;color:#fff;font-size:var(--pfs-cap);line-height:1.55em;
  box-shadow:0 1px 2px rgba(0,0,0,.10)}
#rows>.row:nth-child(1) .rk{background:linear-gradient(160deg,#d8bd7a,#b08d3e)}
#rows>.row:nth-child(2) .rk{background:linear-gradient(160deg,#c9c9c4,#9a9a92)}
#rows>.row:nth-child(3) .rk{background:linear-gradient(160deg,#cf9a72,#a97048)}
/* 我自己的那条：金色左缘 + 更实的底 + 尾部「你」签（不新占列宽） */
.row.me{background:linear-gradient(90deg,rgba(216,189,122,.20),rgba(176,141,62,.07));
  box-shadow:inset 3px 0 0 var(--gold)}
.row.me .nm{font-weight:600}
.row.me .nm::after{content:"你";margin-left:6px;font-size:var(--pfs-micro2);font-weight:400;color:#8a6b1e;
  border:1px solid rgba(176,141,62,.55);border-radius:999px;padding:0 5px;vertical-align:1px}
/* 悬停（桌面）：只提示"这一行可读"，不做点击态承诺 */
.row{transition:background 120ms ease}
.row:hover{background:rgba(176,141,62,.07)}
/* 数字层级：主值加粗等宽、单位压小压淡 */
.vl,.ctotal{font-variant-numeric:tabular-nums;font-weight:700;color:#8a6b1e;letter-spacing:.01em}
.vl .u,.ctotal .u{font-size:var(--pfs-micro3);font-weight:400;color:#a0958a;margin-left:3px;letter-spacing:.04em}
/* 行内第二行（壁上/魁首）给它固定的行高与呼吸感，避免和名字挤在一起 */
.sgr{margin-top:2px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 状态行：成功偏金、失败偏赭，都是低饱和（不刺眼） */
.stat{transition:color 160ms ease}
.stat.bad{color:#a2564c}
/* 空态：给一条细金线做"留白也有设计"的收束 */
.empty{padding:20px 2px}
.empty::before{content:"";display:block;width:54px;height:1px;margin:0 auto 10px;
  background:linear-gradient(90deg,transparent,var(--line),transparent)}
/* 页签：选中态加一层极淡投影，手机上也看得出"当前在哪一栏" */
.tabs button{transition:background 140ms ease,color 140ms ease,border-color 140ms ease}
.tabs button.on{box-shadow:0 2px 6px -3px rgba(176,141,62,.75)}

/* ============================================================
   P6 观赏性第二批（2026-10-15）：行头像 / 花榜照片墙 / 懒加载
   ------------------------------------------------------------
   · **行头像**：花榜行用该妖灵头像（image/csh_face_<ascii>.webp，素材名已 ASCII 化）；
     币/功勋榜行**没有图可用** —— 玩家不上传头像，作者口径又是"不加交互"，
     ⇒ 改用**姓氏印章圆标**：名字首字 + 由名字哈希定出的稳定金色深浅（同名恒同色）。
     这是榜单类产品的通行降级做法，比摆一个空灰圈体面。
   · **照片墙**：花榜一张网格版式（立绘铺满 + 缠头数压图上），比纯列表可看。
   · **性能**：头像/立绘一律 IntersectionObserver **懒加载**（进视口才设 background-image）；
     照片墙**分批渲染**（首批 12 格，滚到底再追加）。理由：安卓端"图片加载半天"的真因是
     一次解码几十张 webp，而不是 50 行文本（50 行 DOM 做窗口化收益为负，故不做）；
     也不用大面积 drop-shadow（移动端昂贵）。
   · 双兼容：不加手机专属分支；紧凑档仍按 max-height 判定。
   ============================================================ */
.av{flex:0 0 auto;align-self:center;width:26px;height:26px;border-radius:50%;
  background-position:center 18%;background-size:cover;background-repeat:no-repeat;
  border:1px solid rgba(176,141,62,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
  background-color:#efe7d6}
/* 印章圆标：币/功勋榜的常态（花榜行改用真头像，不加这个 class） */
.av.seal{display:flex;align-items:center;justify-content:center;background-image:none;
  color:#fbf6ea;font-size:var(fs-cap);font-weight:600;line-height:1;
  text-shadow:0 1px 1px rgba(0,0,0,.20);border-color:rgba(255,255,255,.34)}
#rows>.row:nth-child(1) .av,#rows>.row:nth-child(2) .av,#rows>.row:nth-child(3) .av{
  border-color:rgba(176,141,62,.78);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.30),0 0 0 2px rgba(216,189,122,.20)}

      if (v) return String(v).slice(0, 12);
    }
  } catch (e) {}
  return "";
}

/* ---------- 榜单缓存（2026-10-18） ----------
   作者："天下榜联机因为网络原因很鸡肋"。根因不是服务端，是页面把「网络」当成了
   唯一数据源：每次进页都先清空榜单、停在"正在联网…"，8 秒超时后只剩一句"未连接"。
   修法与界面基座同一条思路 —— **先把上次成功的快照画出来，再后台刷新**：
     · 进页立即用缓存渲染（标注"几分钟前"），网络结果回来再覆盖；
     · 请求失败时保留缓存，只把状态行改成"未连接 · 显示 x 分钟前的榜单"；
     · 只有从来没有成功过（无缓存）才显示空榜 —— 不再"一断网就白屏"。
   缓存键 csh_rank_cache_v1 已登记 csh_migrate 的 EXCLUDED（不随行囊走）。 */
var RANK_CACHE_KEY = "csh_rank_cache_v1";
function cacheRead() {
  try {
    var o = JSON.parse(ls(RANK_CACHE_KEY) || "null");
    if (o && typeof o === "object" && Object.prototype.toString.call(o.rows) === "[object Array]") return o;
  } catch (e) {}
  return null;
}
function cacheWrite() {
  try {
    ls(RANK_CACHE_KEY, JSON.stringify({
      ts: Date.now(), kind: NET.kind, rows: NET.rows, me: NET.me, n: NET.total || 0,
    }));
  } catch (e) {}
}
function cacheAgo(ts) {
  var d = Date.now() - (Number(ts) || 0);
  if (!(d > 60000)) return T.cacheAgoJust;
  if (d < 3600000) return tt("cacheAgoMin", { n: Math.round(d / 60000) });
  if (d < 86400000) return tt("cacheAgoHour", { n: Math.round(d / 3600000) });
  return tt("cacheAgoDay", { n: Math.round(d / 86400000) });
}

/* ---------- 桥（与 Game Shell 通信） ----------
   ★ 2026-10-15 修：**这一页此前根本没有建桥** —— 全文只有 `Bridge.call(...)` 的引用，
     没有 `var Bridge = CSHPage.transport(...)`（对比 career.html / goldfish.html 都在页内建）。
     于是 `typeof Bridge !== "undefined"` 恒假 ⇒ 永远走本地兜底 ⇒ 上传上去的池子币恒为 0
     （作者截图里「势魏延 0 池子币」就是这个，不是没打游戏，是这一页读不到钱包）。
     ★ 不传 closeName：本页没有自关逻辑（关闭由壳的 ✕ 负责），而 "rank-close"
       也不在 shell 的旧协议白名单里（LEGACY_CLOSE 只到 codex），传了反而没用。 */
var Bridge = (typeof CSHPage !== "undefined" && CSHPage && CSHPage.transport)
  ? CSHPage.transport({ timeout: 2500 })
  : null;

function ls(k, v) {
  if (v !== undefined) return CSHPage.lsSet(k, v);
  return CSHPage.lsGet(k) || "";
}
function el(id) { return document.getElementById(id); }

/* Optional legacy API field remains empty; no hardware identifiers are collected. */
function machineFp() { return ""; }

function netInit() {
  NET.uid = ls("csh_net_uid");
  if (!NET.uid) {
    var uid = "csh-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
    if (ls("csh_net_uid", uid)) NET.uid = uid;
  }
  NET.fp = machineFp();
  NET.ver = pageVer();
  NET.name = ls("csh_net_name");
  NET.sig = ls("csh_net_sig");
  /* 缠头数额（2026-10-16 晚）：进页回填上次使用的数额（缺省 1000） */
  CH.amt = clampAmt(ls("csh_rank_cheer_amt") || 1000);
  if (el("chAmt")) el("chAmt").value = String(CH.amt);
  if (el("nm")) el("nm").value = NET.name;
  if (el("sg")) el("sg").value = NET.sig;
}
function netStat(msg, bad) {
  var e = el("stat");
  if (e) { e.textContent = msg; e.className = "stat" + (bad ? " bad" : ""); }
}

/* 静态文案落位：把表里的字写进 DOM。**独立于 boot**（离线冒烟也会跑到），
   确保即使网络流程不启动，页面上的字也全部来自文案表。 */
function applyStaticCopy() {

  var rw = el("rows"); if (rw) rw.innerHTML = '<div class="empty">' + T.rowsLoading + '</div>';
  netStat(T.reading);
}
applyStaticCopy();

/* 一次请求：path / method / body(对象) → cb(ok, jsonObj)
   ★ 2026-10-18：只保留 https 单基址 —— E38 实锤：安卓 origin 是 https://localhost，
     明文 http 直连会被混合内容拦掉。真正的"第二通道"必须也是 https（见 docs/ui-kernel.md）。 */
function netReq(path, method, body, cb) { CSHNet.request(path,method,body,cb,4500); }

/* 本机成绩：优先问宿主（shell-stats 快照），拿不到就用本地兜底。
   ★ 兜底此前读的是 `csh_wallet_pc` —— 这个键**全扩展无人写入**（真键是 `csh_wallet`，
     钱包对象里的 pc 字段；功勋在 `csh_rank`）。读一个没人写的键 = 恒 0 = 白兜底。 */
function netSnapshot(cb) {
  var v = { cby: 0, merit: 0, seg: "" };
  function local() {
    try {
      var w = JSON.parse(localStorage.getItem("csh_wallet") || "{}");
      v.cby = Math.max(0, Math.floor(Number(w && w.pc) || 0));
    } catch (e) {}
    try {
      var r = JSON.parse(localStorage.getItem("csh_rank") || "{}");
      v.merit = Math.max(0, Math.floor(Number(r && r.merit) || 0));
    } catch (e) {}
    cb(v);
  }
  try {
    if (typeof Bridge !== "undefined" && Bridge && Bridge.call) {
      Bridge.call("shell-stats", null, function (ok, s) {
        if (ok && s) {
          var c = (s.pc != null) ? s.pc : s.cby;
          var m = (s.merit != null) ? s.merit : (s.rank && s.rank.merit);
          v.cby = Math.max(0, Math.floor(Number(c) || 0));
          v.merit = Math.max(0, Math.floor(Number(m) || 0));
          /* 官阶名由钱包给出（唯一真源），页面只负责显示，不另抄一份表 */
          v.seg = String(s.segName || (s.rank && s.rank.segName) || "").slice(0, 12);
          cb(v); return;
        }
        local();
      });
      return;
    }
  } catch (e) {}
  local();
}

function netPush(manual) {
  if (!CSHPage.requireSave() || !NET.uid) return;
  netSnapshot(function (v) {
    if (!CSHPage.requireSave()) return;
    /* ★ 口径：上报「历史最高」而不是「当前余额」。
       余额会花掉、会变低，一旦出现「打出新高 → 没传上去 → 花掉一部分 → 再传」，
       最高值就永久丢了。rankHighMerge 只增不减，本机记得住曾经达到过多少。 */
    var high = rankHighMerge(v);
    if (!high) return;
    var upCby = Math.max(high.cby, Math.floor(Number(v.cby) || 0));
    var upMerit = Math.max(high.merit, Math.floor(Number(v.merit) || 0));
    if (!manual && upCby <= 0 && upMerit <= 0) { netStat(T.noScore); return; }
    if (!NET.name) { netStat(T.needNameList); return; }
    NET.seg = v.seg || high.seg || NET.seg;
    netReq("/submit", "POST", {
      uid: NET.uid, name: NET.name, sig: NET.sig, cby: upCby, merit: upMerit, fp: NET.fp, seg: NET.seg,
      /* v4.0.6 起带版本：服务端只记录不设门槛（老服务端忽略未知字段，不会 400） */
      ver: NET.ver
    }, function (ok, r) {
      if (!CSHPage.requireSave()) return;
      if (!ok) {
        /* 服务端 400 且带原因时，只处理"名字已被占用"这一种；其余照旧给中性文案 */
        if (r && r.error === "name-taken") { netStat(T.nameTaken, true); return; }
        if (r && r.error === "name-blocked") { netStat(T.nameBlocked || "换个名字试试", true); return; }
        if (r && r.error === "rename-limited") { netStat(T.renameLimited || "今日已更名，明日再来", true); return; }
        /* ★ 网络失败（r 为空）：把「有一笔最高值还没送达」记在本机，
           下次进页 netPush 会自动再传一次；服务端取 max，重复提交不会刷高。 */
        pendSet(upCby, upMerit);
        netStat(manual ? T.failManual : T.offline, true);
        return;
      }
      if (r && r.ignored) {
        /* 静默拦截（刚提交过 / 已被服务端跳过）：自动上传什么都不说，手动点给一句交代 */
        if (manual) netStat(T.debounceManual);
        return;
      }
      /* ★ 服务端可能把这次提交"认领"到已有记录上（同一台机器 / 同一个网络），
         并把最终归属的 uid 回给我们 —— 存下来，之后"我的那条"高亮才对得上。 */
      if (r && r.uid) { if (!ls("csh_net_uid", r.uid)) return; NET.uid = r.uid; }
      if (!pendClear()) return;
      NET.last = { cby: upCby, merit: upMerit };
      var line = fmt(upCby) + " " + T.cbyUnit + " · " + upMerit + " " + T.meritUnit + (NET.seg ? " · " + NET.seg : "");
      /* 留名成功后把这一句题壁也回显出来 —— 让"题壁确实落榜了"当场可见。 */
      if (NET.sig) line += tt("savedSig", { sig: NET.sig });
      if (r && r.adopted === "fp") netStat(tt("adoptedFp", { line: line }));
      else if (r && r.adopted === "ip") netStat(tt("adoptedIp", { name: String((r && r.name) || NET.name), line: line }));
      else netStat(tt("savedOk", { line: line }));
      netLoad();
    });
  });
}

function netLoad() {
  if (NET.busing) return;
  NET.busing = true;
  /* ① 先上缓存：有同类型快照就立刻画出来，不把整页卡在"正在联网…" */
  var cached = cacheRead();
  var hasCache = !!(cached && cached.kind === NET.kind && cached.rows && cached.rows.length);
  if (hasCache) {
    NET.rows = CSHNet.board({list:cached.rows}).list;
    NET.me = cached.me?CSHNet.board({me:cached.me}).me:null;
    NET.total = cached.n || 0;
    netStat(tt("cacheStat", { cached: cacheAgo(cached.ts) }));
    netRender();
  }
  /* ② 浏览器已明确离线：不要再等 4.5s 超时，直接吃缓存（没缓存才报未连接） */
  var offline = false;
  try { offline = (typeof navigator !== "undefined" && navigator.onLine === false); } catch (eOff) {}
  if (offline) {
    NET.busing = false;
    if (hasCache) netStat(tt("cacheOffline", { cached: cacheAgo(cached.ts) }), true);
    else { NET.rows = []; NET.me = null; NET.total = 0; netStat(T.offline, true); netRender(); }
    return;
  }
  /* ③ 后台刷新：网络结果覆盖缓存；失败则保留缓存，只改状态行 */
  netReq("/board?type=" + NET.kind + "&limit=50&uid=" + encodeURIComponent(NET.uid), "GET", null, function (ok, r) {
    NET.busing = false;
    if (!ok || !r || !r.ok) {
      if (hasCache) {
        netStat(tt("cacheOffline", { cached: cacheAgo(cached.ts) }), true);
        return;
      }
      NET.rows = []; NET.me = null; NET.total = 0;
      netStat(T.offline, true);
      netRender();
      return;
    }
    var safe=CSHNet.board(r);
    NET.rows = safe.list;
    NET.me = safe.me;
    NET.total = safe.n;
    cacheWrite();
    netStat(NET.rows.length
      ? tt("boardStat", { n: r.n, m: NET.rows.length })
      : T.boardEmpty);
    netRender();
  });
}

function fmt(n) {
  n = Math.floor(Number(n) || 0);
  if (n >= 100000000) return (n / 100000000).toFixed(2) + " " + T.unitYi;
  if (n >= 10000) return (n / 10000).toFixed(2) + " " + T.unitWan;
  return String(n);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
/* ---------- P6 行头像工具 ----------
   妖灵 id → 素材主名：名单真源是宿主（shell-cheer-list 给 csh_boss_minion_<ascii>），
   素材是 image/csh_face_<ascii>.webp ⇒ 去前缀即得（与花魁三席用的是同一套规则，不再写第二份）。 */
function asciiOf(id) { return String(id == null ? "" : id).replace("csh_boss_minion_", ""); }
/* 姓氏印章圆标：无图玩家的降级头像。
   首字 + 由名字哈希定出的**稳定**金色深浅 —— 同一名字任何设备任何时候都同色；
   色相锁在 30~52 的金色邻域内，整榜统一不花（五颜六色最容易显土）。 */
function sealOf(name) {
  var s = String(name == null ? "" : name).trim() || "?";
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 131 + s.charCodeAt(i)) >>> 0;
  var hue = 30 + (h % 22), sat = 32 + ((h >>> 3) % 20), lit = 37 + ((h >>> 7) % 13);
  return { ch: s.slice(0, 1), bg: "hsl(" + hue + "," + sat + "%," + lit + "%)" };
}
/* ---------- 懒加载（P6 性能）----------
   进视口才把 data-bg 落成真背景图（安卓端一次性解码几十张 webp 就是"图片加载半天"的真因）。
   root 用 #rows（真正的滚动容器），rootMargin 预取 180px，滚动时不闪白。
   不支持 IntersectionObserver 的极老环境直接全量落位 —— 功能不残，只是不省流量。 */
var LAZY_IO = null;
function lazyBg(scope) {
  if (!scope || !scope.querySelectorAll) return;
  var nodes = scope.querySelectorAll("[data-bg]");
  if (!nodes.length) return;
  var apply = function (n) {
    var src = n.getAttribute("data-bg");
    if (src) { n.style.backgroundImage = src; n.removeAttribute("data-bg"); }
  };
  if (typeof IntersectionObserver === "undefined") {
    for (var i = 0; i < nodes.length; i++) apply(nodes[i]);
    return;
  }
  if (!LAZY_IO) LAZY_IO = new IntersectionObserver(function (ents) {
    for (var j = 0; j < ents.length; j++) {
      if (!ents[j].isIntersecting) continue;
      apply(ents[j].target);
      LAZY_IO.unobserve(ents[j].target);
    }
  }, { root: el("rows") || null, rootMargin: "180px 0px", threshold: 0.01 });
  for (var k = 0; k < nodes.length; k++) LAZY_IO.observe(nodes[k]);
}
/* ---------- 我自己的那条（不在前 N 也常驻可见） ---------- */
function renderMeBar() {
  var box = el("mebar");
  if (!box) return;
  var m = NET.me;
  if (!m) { box.innerHTML = ""; return; }
  var val = (NET.kind === "merit") ? (fmt(m.merit) + " " + T.meritUnit) : (fmt(m.cby) + " " + T.cbyUnit);
  box.innerHTML = '<div>' + tt("meRank", { n: esc(m.rank) }) + '</div>'
    + '<div>' + esc(m.name) + (m.seg ? ' · <span class="seg">' + esc(m.seg) + '</span>' : '') + '</div>'
    + (m.sig ? '<div>壁上：' + esc(m.sig) + '</div>' : '')
    + '<div><span class="myv">' + val + '</span></div>'
    + '<div>' + esc(m.ago || "") + '</div>';
}
function netRender() {
  renderMeBar();
  var box = el("rows");
  if (!box) return;
  if (!NET.rows.length) { box.innerHTML = '<div class="empty">' + T.rowsEmpty + '</div>'; return; }
  var h = "";
  for (var i = 0; i < NET.rows.length; i++) {
    var row = NET.rows[i];
    /* v3：数字与单位拆开渲染 —— 主值加粗等宽、单位压小压淡（层级分明，不是满屏同权重） */
    var valNum = (NET.kind === "merit") ? row.merit : row.cby;
    var valUnit = (NET.kind === "merit") ? T.meritUnit : T.cbyUnit;
    /* P6 行头像：玩家不上传头像 ⇒ 姓氏印章圆标（首字 + 稳定金色深浅） */
    var sl = sealOf(row.name || T.noName);
    h += '<div class="row' + (row.uid === NET.uid ? " me" : "") + '">'
      + '<span class="rk' + (row.rank <= 3 ? " top" : "") + '">' + esc(row.rank) + '</span>'
      + '<span class="av seal" style="background:' + sl.bg + '">' + esc(sl.ch) + '</span>'
      + '<span class="nm">' + esc(row.name || T.noName)
      + (row.sig ? '<i class="sgr">壁上：' + esc(row.sig) + '</i>' : '') + '</span>'
      + (row.seg ? '<span class="seg">' + esc(row.seg) + '</span>' : '')
      + '<span class="tm">' + esc(row.ago || "") + '</span>'
      + '<span class="vl">' + fmt(valNum) + '<span class="u">' + esc(valUnit) + '</span></span></div>';
  }
  box.innerHTML = h;
}

/* ---------- 花榜（v2.1 立 · v3 换世界观口径）：花 CBY 给唱曲的姑娘缠头 ——
   扣费走宿主单一账本（shell-cheer），服务端只做聚合与展示；
   两边各管各的真源（名单问宿主，缠头数问服务端）。 ---------- */
var CHEER = { list: [], girls: {} };
/* 花榜版式状态（2026-10-16 三版式）：
     "chief" = 花魁三席（**默认** · 作者定案：只列前三名的详细情况）
     "wall"  = 照片墙（全 50 位）· "list" = 名录（全 50 位）
   WALL.shown 是**已渲染格数**（分批渲染的游标），WALL.batch 为每批格数。 */
var WALL = { rows: [], shown: 0, batch: 12, io: null, mode: "chief" };
function setView(m) {
  WALL.mode = (m === "wall" || m === "list") ? m : "chief";
  var vc = el("v-chief"), vw = el("v-wall"), vl = el("v-list");
  if (vc) vc.className = (WALL.mode === "chief") ? "on" : "";
  if (vw) vw.className = (WALL.mode === "wall") ? "on" : "";
  if (vl) vl.className = (WALL.mode === "list") ? "on" : "";
}
function showViewbar(on) { var vb = el("viewbar"); if (vb) vb.hidden = !on; }
/* 默认版式：**花魁三席**。
   （P6 时这里按视口高度在"照片墙/名录"之间自适应；2026-10-16 起三席是默认与主体，
     矮窗也一样能看 —— 三席一排在 915 宽只占一行，不再有"一格就 138px"的问题。） */
function preferView() { return "chief"; }

function netGirls() {
  flushCheer();   /* 进花榜先补欠账（钱已扣、榜未记的队列；幂等 cid 安全重发） */
  var ask = function (cb) {
    if (Bridge && Bridge.call) Bridge.call("shell-cheer-list", null, cb);
    else cb(false, null);
  };
  ask(function (okL, l) {
    /* ★ 名册真源是宿主（50 只恒定的花名册），**空的应答不覆盖已有的那份**：
       宿主应答超时/失败会回空，若照着清，刚拿到的族名会被自己人清掉
       （P6 实测：boot 期那次问名册的超时回调在 2.5s 后把名册清空，
        主推位当场从族名变回「佚名」）。 */
    var arr = (okL && l && l.list) ? l.list : [];
    if (arr.length) CHEER.list = arr;
    /* 带 uid：服务端据此回「我在这只投了多少」（me_amt）与贡献称号档位（tier） */
    netReq("/girls?uid=" + encodeURIComponent(NET.uid), "GET", null, function (ok, r) {
      CHEER.girls = {};
      if (ok && r && r.ok) for (var i = 0, girls = CSHNet.girls(r.girls); i < girls.length; i++) CHEER.girls[girls[i].girl] = girls[i];
      netRenderGirls();
    });
  });
}
/* 花榜行数据：名单来自宿主（唯一真源），缠头数来自服务端（唯一真源），这里只做装配与排序 */
function girlsRows() {
  var rows = [];
  for (var i = 0; i < CHEER.list.length; i++) {
    var c = CHEER.girls[CHEER.list[i].id];
    rows.push({ id: CHEER.list[i].id, name: CHEER.list[i].name,
                total: c ? c.total : 0,
                n: c ? c.n : 0,
                tops: (c && c.tops) ? c.tops : [],
                chief: c ? c.chief_name : "", chiefSig: c ? c.chief_sig : "", chiefAmt: c ? c.chief_amt : 0,
                top: c ? c.top_name : "", topAmt: c ? c.top_amt : 0,
                meAmt: c ? c.me_amt : 0, tier: c ? c.tier : "" });
  }
  rows.sort(function (a, b) { return b.total - a.total; });
  return rows;
}
/* 魁首题壁档案（v2.2）：一行金线签名条。返回值**已是可插入 HTML**（内部已 esc）。 */
function chiefLineHtml(r2) {
  if (r2.chief && r2.chiefSig) return tt("cheerChief", { name: esc(r2.chief), sig: esc(r2.chiefSig) });
  if (r2.chief) return tt("cheerEcho", { name: esc(r2.chief), amt: fmt(r2.chiefAmt) });
  if (r2.top) return tt("cheerEcho", { name: esc(r2.top), amt: fmt(r2.topAmt) });
  return "";
}
/* 贡献称号胶囊（v2.2）：我在这一只投过（me_amt>0）才显示，免得整榜都挂「初来」 */
function tierChipHtml(r2) {
  var tw = tierWord(r2.tier);
  if (!(r2.meAmt > 0 && tw)) return "";
  return '<span class="seg tier" title="' + esc(tt("tierTitle", { g: r2.name, amt: fmt(r2.meAmt) })) + '">'
    + esc(tt("tierMine", { t: tw })) + '</span>';
}
function netRenderGirls() {
  renderMeBar();
  var box = el("rows");
  if (!box) return;
  WALL.rows = girlsRows();
  if (!WALL.rows.length) { box.innerHTML = '<div class="empty">' + T.girlsEmpty + '</div>'; return; }
  if (WALL.mode === "chief") renderChiefs();
  else if (WALL.mode === "list") renderCheerList();
  else renderWall(0);
}
/* ---------- 版式零：花魁三席（默认 · 2026-10-16）----------
   作者："花魁不用把 50 个美女全列出来，只需要列前三名的详细情况，
   比如打赏最高的几个人就行了。"
   ⇒ 三席 = 榜单前三位（**可能还没人缠头**，那时给一句"虚位以待"，
     否则新服上花榜全空、连第一个人都没法起头）。
   每席的"详细情况" = 打赏最高的几位（服务端 tops，含题壁与 uid 用于标出"我"）。
   某席的打赏榜里如果有我，那一行加红并挂「你」签 —— 炫耀机制要让人一眼找到自己。 */
function patronRowsHtml(r2, seat) {
  var tops = r2.tops || [];
  if (!r2.total || !tops.length) {
    /* 老服务端没有 tops、或这一席还没人缠头：给一句中性提示，不摆空行 */
    if (!r2.total) return '<div class="chpr more chempty">' + esc(T.chiefNone) + '</div>';
  }
  var h = "";
  for (var i = 0; i < tops.length; i++) {
    var p = tops[i];
    var isMe = NET.uid && p.uid === NET.uid;
    h += '<div class="chpr' + (i === 0 ? " p1" : "") + (isMe ? " me" : "") + '">'
      + '<span class="prk">' + (i + 1) + '</span>'
      + '<b>' + esc(p.name || T.noName) + '</b>'
      + '<i>' + esc(p.sig || "") + '</i>'
      + '<em>' + fmt(p.amt) + '</em></div>';
  }
  /* 只列前几位；还有更多就说一句"另有 N 位"，不把整张榜塞进一张卡 */
  var more = (r2.n || 0) - tops.length;
  if (more > 0) h += '<div class="chpr more">' + esc(tt("chiefMore", { n: more })) + '</div>';
  return h || '<div class="chpr more chempty">' + esc(T.chiefNone) + '</div>';
}
function seatCardHtml(r2, idx) {
  var key = asciiOf(r2.id);
  var tw = (r2.meAmt > 0) ? tierWord(r2.tier) : "";
  var sub = (r2.total ? tt("chiefPeople", { n: r2.n || 0 }) : "")
    + (tw ? (r2.total ? " · " : "") + '<span class="tier">' + esc(tt("tierMine", { t: tw })) + '</span>' : "");
  return '<div class="chief' + (idx === 0 ? " c1" : "") + '">'
    + '<div class="chd">'
    +   '<span class="chpic" data-bg="url(../image/csh_face_' + esc(key) + '.webp)"></span>'
    +   '<span class="chmeta">'
    +     '<span class="chrk">' + esc(T.seat[idx] || "") + '</span>'
    +     '<span class="chnm">' + esc(r2.name) + '</span>'
    +     '<span class="chtot">' + fmt(r2.total) + '<span class="u">' + esc(T.cheerUnit) + '</span></span>'
    +     (sub ? '<span class="chsub">' + sub + '</span>' : '')
    +   '</span>'
    + '</div>'
    + '<div class="chpat"><span class="chph">' + esc(T.chiefPatrons) + '</span>'
    +   patronRowsHtml(r2, idx) + '</div>'
    + '<button class="chbtn" type="button" data-g="' + esc(r2.id) + '" data-n="' + esc(r2.name) + '">'
    +   esc(T.cheerBtn) + '</button>'
    + '</div>';
}
function renderChiefs() {
  var box = el("rows");
  if (!box) return;
  var top3 = WALL.rows.slice(0, 3);
  var h = '<div class="chiefs">';
  for (var i = 0; i < top3.length; i++) h += seatCardHtml(top3[i], i);
  h += '</div><div class="chieftip">' + esc(T.chiefTip) + '</div>';
  box.innerHTML = h;
  lazyBg(box);
  bindCheer(box);
}
/* ---------- 版式一：名录（原列表；P6 补行头像） ---------- */
function renderCheerList() {
  var box = el("rows");
  if (!box) return;
  var h = "";
  for (var j = 0; j < WALL.rows.length; j++) {
    var r2 = WALL.rows[j];
    var line = chiefLineHtml(r2);
    /* P6 行头像：花榜行**直接用该妖灵头像**（名单 id 去前缀 = 素材主名） */
    var key = asciiOf(r2.id);
    h += '<div class="row"><span class="rk' + (j < 3 ? " top" : "") + '">' + (j + 1) + '</span>'
      + '<span class="av" data-bg="url(../image/csh_face_' + esc(key) + '.webp)"></span>'
      + '<span class="nm">' + esc(r2.name)
      + (line ? '<i class="sgr ct">' + line + '</i>' : '') + '</span>'
      + tierChipHtml(r2)
      + '<span class="ctotal">' + fmt(r2.total) + '<span class="u">' + esc(T.cheerUnit || T.cheerBtn) + '</span></span>'
      + '<button class="cheerbtn" type="button" data-g="' + esc(r2.id) + '" data-n="' + esc(r2.name) + '">' + T.cheerBtn + '</button></div>';
  }
  box.innerHTML = h;
  lazyBg(box);
  bindCheer(box);
}
/* ---------- 版式二：照片墙（P6 新）----------
   立绘铺满 + 底部渐隐压「族名 / 缠头数 / 魁首」，右上角一枚「+」直接缠头（不加别的交互）。
   **分批渲染**：首批 12 格，把最后一格当哨兵，进视口再放下一批 —— 一次不铺 50 张图。 */
function wallCellHtml(r2, idx) {
  var key = asciiOf(r2.id);
  var tw = (r2.meAmt > 0) ? tierWord(r2.tier) : "";
  var line = chiefLineHtml(r2);
  return '<div class="wall-cell' + (idx < 3 ? " k" + (idx + 1) : "") + '">'
    + '<span class="wk">' + (idx + 1) + '</span>'
    + '<span class="pic" data-bg="url(../image/csh_face_' + esc(key) + '.webp)"></span>'
    + '<span class="info">'
    +   '<span class="wn">' + esc(r2.name) + '</span>'
    +   '<span class="wt">' + fmt(r2.total) + '<span class="u">' + esc(T.cheerUnit) + '</span>'
    +     (tw ? '<em class="wm">' + esc(tw) + '</em>' : '') + '</span>'
    +   (line ? '<i class="wc">' + line + '</i>' : '')
    + '</span>'
    + '<button class="wb" type="button" data-g="' + esc(r2.id) + '" data-n="' + esc(r2.name)
    + '" title="' + esc(T.cheerBtn) + '" aria-label="' + esc(T.cheerBtn) + '">' + esc(T.cheerBtn) + '</button>'
    + '</div>';
}
function renderWall(from) {
  var box = el("rows");
  if (!box) return;
  if (!from) {
    box.innerHTML = '<div class="wall" id="wall"></div>';
    WALL.shown = 0;
    if (WALL.io) { try { WALL.io.disconnect(); } catch (e) {} WALL.io = null; }
  }
  var wall = el("wall");
  if (!wall) return;
  var end = Math.min(WALL.rows.length, WALL.shown + WALL.batch);
  var h = "";
  for (var i = WALL.shown; i < end; i++) h += wallCellHtml(WALL.rows[i], i);
  wall.insertAdjacentHTML("beforeend", h);
  WALL.shown = end;
  lazyBg(wall);
  bindCheer(wall);
  if (WALL.shown < WALL.rows.length) {
    var cells = wall.children, last = cells[cells.length - 1];
    if (!last) return;
    if (typeof IntersectionObserver === "undefined") { renderWall(WALL.shown); return; }
    if (!WALL.io) WALL.io = new IntersectionObserver(function (ents) {
      for (var j = 0; j < ents.length; j++) {
        if (!ents[j].isIntersecting) continue;
        try { WALL.io.unobserve(ents[j].target); } catch (e) {}
        renderWall(WALL.shown);
        return;
      }
    }, { root: el("rows") || null, rootMargin: "240px 0px" });
    WALL.io.observe(last);
  }
}
/* 缠头按钮绑定（三席的 .chbtn / 列表的 .cheerbtn / 照片墙的 .wb 同一处理；
   data-bound 防止分批追加时重复绑定） */
function bindCheer(scope) {
  var root = scope || el("rows");
  if (!root || !root.querySelectorAll) return;
  var btns = root.querySelectorAll(".cheerbtn,.wb,.chbtn");
  for (var k = 0; k < btns.length; k++) {
    if (btns[k].getAttribute("data-bound")) continue;
    btns[k].setAttribute("data-bound", "1");
    (function (b) {
      b.addEventListener("click", function (ev) {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        doCheer(b.getAttribute("data-g"), b.getAttribute("data-n"), readCheerAmt());
      }, false);
    })(btns[k]);
  }
}
/* 缠头数额（2026-10-16 晚 · 作者："打赏改为具体数额"）：页面级单点。
   区间 = 宿主 shell-cheer 的校验区间（100 ~ 1,000,000）；存 localStorage 进页回填。
   三席 / 照片墙 / 名录三种入口的缠头按钮共用这一个数额（点按钮时现读现钳）。 */
var CH = { amt: 1000 };
function clampAmt(v) {
  v = Math.floor(Number(v) || 0);
  if (!(v >= 100)) v = 100;
  if (v > 1000000) v = 1000000;
  return v;
}
function readCheerAmt() {
  if (!CSHPage.requireSave()) return CH.amt;
  var inp = el("chAmt");
  var next = clampAmt((inp && inp.value) || CH.amt);
  if (!ls("csh_rank_cheer_amt", String(next))) return CH.amt;
  CH.amt = next;
  if (inp) inp.value = String(CH.amt);
  return CH.amt;
}
/* 缠头待上报队列（2026-10-16 晚 · 作者："缠头没有生效"的治本件之一）：
   宿主扣费成功后，若 /cheer 被限流（ignored）或请求失败 —— **钱已扣、榜未记**。
   把这一笔入队（本地存），凭**幂等 cid** 事后补报：服务端按 cid 去重，
   重发绝不会重复计数（配合服务端 v2.4 的频率闸拆分，被吞的概率已大幅下降）。 */
var CHEERPEND = [];
try { CHEERPEND = JSON.parse(ls("csh_rank_pending") || "[]") || []; } catch (eP0) { CHEERPEND = []; }
if (!Array.isArray(CHEERPEND)) CHEERPEND = [];
function pendPush(entry) {
  if (!CSHPage.requireSave()) return false;
  var next = CHEERPEND.concat([entry]).slice(-20);
  if (!ls("csh_rank_pending", JSON.stringify(next))) return false;
  CHEERPEND = next;
  return true;
}
function pendShift() {
  if (!CSHPage.requireSave()) return false;
  var next = CHEERPEND.slice(1);
  if (!ls("csh_rank_pending", JSON.stringify(next))) return false;
  CHEERPEND = next;
  return true;
}
function flushCheer() {
  if (!CSHPage.requireSave()) return;
  if (!NET.uid || !CHEERPEND.length) return;
  var one = CHEERPEND[0];
  netReq("/cheer", "POST", { uid: NET.uid, name: NET.name, sig: NET.sig, girl: one.girl, amt: one.amt, cid: one.cid }, function (ok, r) {
    if (ok && r && r.ok) {
      if (!pendShift()) return;
      if (CHEERPEND.length) flushCheer();
    }
    /* 失败/被限：留在队列，下次进页继续补（幂等 cid 保证安全） */
  });
}
function doCheer(gid, gname, amt) {
  if (!CSHPage.requireSave()) return;
  if (!NET.name) { netStat(T.needNameCheer, true); return; }
  if (!(Bridge && Bridge.call)) { netStat(T.offline, true); return; }
  var cid = "c-" + String(NET.uid || "x").slice(-8) + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
  Bridge.call("shell-cheer", { girl: gid, gname: gname, amt: amt }, function (ok, s) {
    if (!CSHPage.requireSave()) return;
    if (!ok) { netStat(s && s.reason === "poor" ? T.cheerPoor : T.cheerFail, true); return; }
    /* 每日首次免缠头（v2.2）：宿主判定并回传 free + 实际计入的缠头量（免费 = +1）。
       页面**不自己扣**，只如实把宿主给的量上报服务端做聚合。 */
    var gotFree = !!(s && s.free);
    var credited = (s && s.amt != null) ? Math.max(1, Math.floor(Number(s.amt) || 1)) : amt;
    netReq("/cheer", "POST", { uid: NET.uid, name: NET.name, sig: NET.sig, girl: gid, amt: credited, cid: cid }, function (ok2, r2) {
      if (!CSHPage.requireSave()) return;
      if (ok2 && r2 && r2.ok && !r2.ignored) {
        netStat(gotFree ? tt("cheerFree", { g: gname }) : tt("cheerOk", { g: gname, amt: fmt(credited) }));
        flushCheer();   /* 顺带把之前的欠账一起补 */
      } else {
        /* 被限流（ignored）或请求失败：钱已扣、榜未记 —— 入队补报 + 一句中性提示 */
        pendPush({ cid: cid, girl: gid, amt: credited, t: Date.now() });
        netStat(T.cheerFail, true);
      }
      netGirls();
    });
  });
}

(function boot() {
  /* ★ 只在**真实页面**里启动：离线冒烟测试 / 无 location 的沙箱环境里
     window.location.protocol 不存在 ⇒ 直接 return，不发任何网络请求。
     （否则 CI 沙箱会真的往外发请求，属于无意义的噪音。） */
  var real = false;
  try {
    real = (typeof window !== "undefined") && (typeof document !== "undefined")
      && !!(window.location && window.location.protocol)
      && /^(https?|file):$/.test(window.location.protocol);
  } catch (e0) { real = false; }
  if (!real) return;
  netInit();
  applyStaticCopy();   /* 名字读出来后，按钮文案再定一次（题名 / 更名） */
  var inp = el("nm");
  var sgIn = el("sg");
  var sv = el("save");
  function takeSig() {
    if (!sgIn || !CSHPage.requireSave()) return false;
    var next = String(sgIn.value || "").trim().slice(0, 10);
    if (!ls("csh_net_sig", next)) return false;
    NET.sig = next;
    return true;
  }
  if (sgIn) {
    sgIn.addEventListener("input", takeSig, false);
    sgIn.addEventListener("change", takeSig, false);
  }
  if (sv) sv.addEventListener("click", function () {
    if (!CSHPage.requireSave()) return;
    var nn = String((inp && inp.value) || "").trim().slice(0, 5);
    if (!nn) { netStat(T.needNameList, true); return; }
    if (!ls("csh_net_name", nn)) return;
    NET.name = nn;
    if (!takeSig()) return;
    if (sv) sv.textContent = T.submitEdit;
    netPush(true);
  }, false);
  if (inp) {
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter" && sv) sv.click(); }, false);
    inp.addEventListener("input", function () {
      if (!sv) return;
      sv.textContent = NET.name ? T.submitEdit : T.submitNew;
    }, false);
  }
  /* 缠头数额输入（2026-10-16 晚）：change / 回车即钳制并落盘 */
  var ca = el("chAmt");
  if (ca) {
    ca.addEventListener("change", function () { readCheerAmt(); }, false);
    ca.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { readCheerAmt(); try { ca.blur(); } catch (e2) {} }
    }, false);
  }
  var tc = el("t-cby"), tm = el("t-merit"), tch = el("t-cheer");
  function tab(x) {
    if (tc) tc.className = x === "cby" ? "on" : "";
    if (tm) tm.className = x === "merit" ? "on" : "";
    if (tch) tch.className = x === "cheer" ? "on" : "";
  }
  if (tc) tc.addEventListener("click", function () { NET.kind = "cby"; tab("cby"); showViewbar(false); netLoad(); }, false);
  if (tm) tm.addEventListener("click", function () { NET.kind = "merit"; tab("merit"); showViewbar(false); netLoad(); }, false);
  if (tch) tch.addEventListener("click", function () { NET.kind = "cheer"; tab("cheer"); showViewbar(true); netGirls(); }, false);
  /* 花榜版式：默认「花魁三席」（作者 2026-10-16 定案）；照片墙/名录 = 全 50 位，供打赏 */
  setView(preferView());
  var vc = el("v-chief"), vw = el("v-wall"), vl = el("v-list");
  if (vc) vc.addEventListener("click", function () { setView("chief"); netRenderGirls(); }, false);
  if (vw) vw.addEventListener("click", function () { setView("wall"); netRenderGirls(); }, false);
  if (vl) vl.addEventListener("click", function () { setView("list"); netRenderGirls(); }, false);
  if (vl) vl.addEventListener("click", function () { setView("list"); netRenderGirls(); }, false);
  /* 进页先读名册；**已有名字就自动上传一次**（作者要的"有网就自动传，不用点"）。
     上传前先看有没有「上次没送出去的最高值」—— 有就先说一声，玩家知道这一笔在补。 */
  if (NET.name) {
    var pdPn = pendRead();
    if (pdPn) netStat(tt("pendingUp", { n: fmt(pdPn.cby) }));
    netPush(false);
  } else netStat(T.needNameAuto);
  netLoad();
})();
</script>
