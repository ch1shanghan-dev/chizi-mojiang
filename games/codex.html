<!DOCTYPE html>
<!-- ============================================================
     妖灵图鉴（讨伐录平级的档案页 · 2026-10-14 批次 C · galgame 风）
     ------------------------------------------------------------
     · 五十位妖灵的大图档案：左栏竖排名录（人像缩略 + 名字 + 讨伐次数），
       右栏 = 主立绘 + 名字/定位 + 简介 + 台词全集（初见/持有/上涨/下跌）+ 数据格
     · 数据双通道：父窗直读优先（CSH.market.GIRLS / lib.cshBossRecord.summary），
       兜底走桥 shell-stats 的 snap.boss（仅在父窗缺失时）
     · 视觉：暗金 × 深底 —— 与 games/goldfish.html 同一套 CSS 变量与卡片语言
     · 纯展示：本页无任何写操作
     ============================================================ -->
<html lang="zh-CN" data-csh-palette="portrait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>妖灵图鉴</title>
<script src="../core/csh_selftest.js" data-csh-selftest="auto"></script>
<script src="../core/csh_page.js"></script>
<script src="../core/csh_online.js"></script>
<script src="../core/csh_net.js"></script>
<script src="../core/csh_bond.js"></script>
<style>
/* 书法体注册：ZMX3 = **全覆盖子集**（4058 字 · 由开源 Zhi Mang Xing 完整版子集化，
   2026-10-15）。此前本页误把 csh_fx_font_1/2（78/84 字的**游戏内技能横幅**专用子集）
   放进 --ff-title 首位 → 任何不在子集内的字逐字回退系统宋体 → 同一个人名里混排两种
   字体（作者实机截图确认）。现按 docs/art-direction.md §4.1 回归三档规范，
   书法体降为独立的点缀档 --ff-callig。 */
@font-face{font-family:'ZMX3';src:url("../font/csh_fx_font_3.woff2") format("woff2");font-display:swap}

:root{
  --bg:#191512; --bg2:#221c17; --panel:#2a231c; --panel2:#332b21;
  --ink:#efe6cf; --ink-dim:rgba(239,230,207,.62); --ink-faint:rgba(239,230,207,.36);
  --gold:#d8bd7a; --gold-2:#b08d3e; --line:rgba(216,189,122,.28); --line-2:rgba(216,189,122,.14);
  /* 字体四档（全项目一致）：① 标题宋 ② 正文黑 ③ 数字牌 ④ 书法点缀 */
  --ff-title:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --ff-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --ff-num:"Times New Roman",Times,"Nimbus Roman","Songti SC",serif;
  --ff-callig:"ZMX3","Zhi Mang Xing","Kaiti SC","STKaiti",KaiTi,var(--ff-title);

  /* 字号收编档（2026-10-20）：同值 token 替换裸字号，渲染不变；同档多值待实机测量后并档 */
  --pfs-cap: 12px;
  --pfs-cap2: 12px;
  --pfs-sm: 12px;
  --pfs-sm2: 12.5px;
  --pfs-md: 13px;
  --pfs-md2: 13.5px;
  --pfs-lg: 14px;
  --pfs-lg2: 15px;
  --pfs-lg3: 15.5px;
  --pfs-xl: 17px;
  --pfs-xl2: 18px;
  --pfs-xl3: 19px;
  --pfs-2xl: 21px;
  --pfs-2xl2: 24px;
  --pfs-3xl: 28px;
  --pfs-3xl2: 30px;
  --pfs-4xl: 44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:
  radial-gradient(120% 80% at 50% 0%,rgba(216,189,122,.06),transparent 55%),
  linear-gradient(170deg,var(--bg2),var(--bg));
  color:var(--ink);font-family:var(--ff-body);font-size:var(--pfs-lg)}
#app{display:flex;flex-direction:column;height:100%;padding:8px 12px 6px 30px}

/* ---------- 顶部条 ----------
   ★ padding-right = 给宿主右上角的「CBY 胶囊 + 关闭按钮」留的避让带。
   2026-10-15 作者截图：'图鉴/已讨/总讨伐' 三个胶囊贴得太右，被金钱胶囊压住 ——
   避让带由 150 → 268px（三枚胶囊整体左移约 118px），仍留足余量不贴边。 */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:42px;padding-right:268px}
.brand{font-family:var(--ff-callig);font-size:var(--pfs-2xl2);letter-spacing:.2em;color:var(--gold)}
.brand small{font-size:var(--pfs-sm);letter-spacing:.1em;color:var(--ink-faint);margin-left:8px;font-family:var(--ff-body)}
.stats{margin-left:auto;display:flex;gap:8px;font-family:var(--ff-num);font-size:var(--pfs-lg);font-variant-numeric:tabular-nums}
.stat{background:rgba(216,189,122,.10);border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;white-space:nowrap}
.stat b{color:var(--gold);font-weight:600}

/* ---------- 主体：左名录 + 右档案 ---------- */
.main{flex:1 1 auto;min-height:0;display:flex;gap:12px;padding:8px 0 6px}
.rolodexwrap{flex:0 0 196px;min-height:0}
.rolodex{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:6px;padding-right:4px}
.gitem{display:flex;align-items:center;gap:8px;padding:5px 7px;cursor:pointer;
  border:1px solid var(--line-2);border-radius:10px;background:rgba(255,255,255,.02);
  transition:transform .14s ease,border-color .14s ease,background .14s ease}
.gitem:hover{border-color:var(--line)}
.gitem:active{transform:scale(.98)}
.gitem.on{border-color:var(--gold);background:rgba(216,189,122,.10);
  box-shadow:inset 0 0 0 1px rgba(216,189,122,.18)}
.gface{position:relative;flex:0 0 44px;width:44px;height:55px;border-radius:7px;overflow:hidden;background:#141110}
.gface img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.gph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-family:var(--ff-title);font-size:var(--pfs-xl3);color:var(--ink-faint)}
.gface.noimg img{display:none}
.gface.noimg .gph{display:flex}
.gmeta{flex:1 1 auto;min-width:0}
.gname{font-family:var(--ff-title);font-size:var(--pfs-lg3);letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem.on .gname{color:var(--gold)}
.gsub{display:flex;align-items:center;gap:6px;font-size:var(--pfs-sm);color:var(--ink-dim);margin-top:3px}
.gsub .gk{font-family:var(--ff-num)}
.gsub .gh{font-family:var(--ff-num);font-size:var(--pfs-sm);color:#f0709c;background:rgba(240,112,156,.14);
  border:1px solid rgba(240,112,156,.30);border-radius:999px;padding:0 6px;line-height:16px}
.gsub.aff-s .gh{color:#fff;background:rgba(240,112,156,.34)}

/* ---------- 右：档案主体（galgame 面板） ---------- */
.dossier{flex:1 1 auto;min-width:0;display:flex;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;background:linear-gradient(150deg,var(--panel2),var(--bg2));
  box-shadow:0 14px 40px rgba(0,0,0,.42);animation:cf-in .4s ease}
@keyframes cf-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dstage{position:relative;flex:0 0 40%;background:#141110;overflow:hidden}
.dstage img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block;animation:cf-in .5s ease}
.dstage.noimg img{display:none}
.dph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-family:var(--ff-title);font-size:var(--pfs-4xl);letter-spacing:.2em;color:var(--ink-faint);
  background:linear-gradient(180deg,var(--panel2),var(--panel))}
.dstage.noimg .dph{display:flex}
.dstage::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset -40px 0 60px -30px rgba(25,21,18,.95)}
.dinfo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px;
  padding:14px 16px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dname{font-family:var(--ff-title);font-size:var(--pfs-3xl2);letter-spacing:.12em;color:var(--ink)}
.dtag{font-size:var(--pfs-md2);color:var(--gold);letter-spacing:.14em;margin-top:3px}
.dbio{font-size:var(--pfs-lg);line-height:1.85;color:var(--ink-dim);
  border-left:2px solid var(--line);padding-left:10px}

/* 台词全集 */
.dlines{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;margin-top:2px}
.lgroup{background:rgba(216,189,122,.06);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px}
.lglabel{font-size:var(--pfs-sm);color:var(--gold);letter-spacing:.18em;margin-bottom:5px}
.lline{font-size:var(--pfs-lg);line-height:1.8;color:var(--ink);opacity:.92;
  padding-left:12px;position:relative}
.lline::before{content:"”";position:absolute;left:0;top:0;color:var(--gold-2);font-family:var(--ff-title)}

/* 数据格 */
.dfacts{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:4px}
.fact{background:rgba(255,255,255,.03);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px}
.fact .k{font-size:var(--pfs-sm);color:var(--ink-faint);letter-spacing:.06em}
.fact .v{font-size:var(--pfs-xl);color:var(--ink);margin-top:3px}
.fact .v.num{font-family:var(--ff-num)}

/* ---------- 底部 ---------- */
.foot{flex:0 0 auto;font-size:var(--pfs-sm2);color:var(--ink-faint);letter-spacing:.06em;padding:5px 2px 2px;display:flex;gap:10px}
.foot .dot{color:var(--gold-2)}

/* ---------- 空态 ---------- */
#empty{display:none;flex:1 1 auto;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px 16px}
body.empty #empty{display:flex}
body.empty .main{display:none}
body.empty .foot{display:none}
#empty .e1{font-family:var(--ff-title);font-size:var(--pfs-3xl);letter-spacing:.34em;color:var(--gold)}
#empty .e2{font-size:var(--pfs-md2);letter-spacing:.08em;color:var(--ink-dim);line-height:1.9;max-width:560px}
#empty .eline{width:150px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}

/* ---------- 窄屏：上下堆叠 ---------- */
@media (max-width:720px){
  #app{padding:8px 10px 6px 16px}
  .topbar{padding-right:190px}
  .brand{font-size:var(--pfs-xl)}
  .main{flex-direction:column;gap:8px}
  .rolodexwrap{flex:0 0 auto}
  .rolodex{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:8px;padding:0 0 6px}
  .gitem{flex:0 0 auto;min-width:136px}
  .dossier{flex-direction:column}
  .dstage{flex:0 0 40%}
  .dstage::after{box-shadow:inset 0 -40px 60px -30px rgba(25,21,18,.95)}
  .dname{font-size:var(--pfs-2xl)}
  .dinfo{padding:11px 12px 10px}
  .dfacts{padding-top:0}
}
@media (max-height:430px){
  .foot{display:none}
}

/* ============================================================
   好感度（v6.2）—— 爱心不用文字，用会呼吸的形状
   ------------------------------------------------------------
   设计语言：暗底 + 品红金渐变 + 呼吸光晕。
   · 空心心 = 未达档位（描边，低不透明度）
   · 实心心 = 已达档位（渐变填充 + 外发光 + 呼吸脉动，逐颗错峰）
   · S 档：整排加一层缓慢旋转的锥形光晕 + 星点
   ============================================================ */
.affbox{position:relative;flex:0 0 auto;            /* ★v6.3 修：有 overflow:hidden 的 flex 项
  min-height:auto 失效，会被同栏内容挤成一条 ⇒ 必须固定不收缩 */
  background:linear-gradient(135deg,rgba(240,112,156,.10),rgba(216,189,122,.05) 60%,transparent);
  border:1px solid rgba(240,112,156,.22);border-radius:12px;padding:10px 12px 11px;overflow:hidden;
  --affc:#f0709c}
.affbox::before{content:"";position:absolute;inset:-40% -60% auto auto;width:220px;height:220px;
  background:radial-gradient(circle,rgba(240,112,156,.22),transparent 62%);
  animation:affHalo 7s ease-in-out infinite;pointer-events:none}
@keyframes affHalo{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.12);opacity:.95}}
.affbox.sTier::after{content:"";position:absolute;inset:-70%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(240,112,156,.20),transparent 22%,rgba(216,189,122,.18) 44%,transparent 66%,rgba(240,112,156,.20));
  animation:affSpin 9s linear infinite;filter:blur(2px)}
@keyframes affSpin{to{transform:rotate(360deg)}}
.affhead{position:relative;display:flex;align-items:center;gap:8px;z-index:2}
/* v6.3 修：原来 filter:drop-shadow + background-clip:text 在 Chromium 下会让文字
   **只渲染出一部分**（作者实机：「亲密有一部分文字不可见」）。改为
   ① 兜底色（不支持 clip 时也是亮粉色，永远看得见）
   ② 只在支持 background-clip:text 时才切渐变（并且不再用 filter，改 glow 光晕） */
.afftitle{font-family:var(--ff-callig);font-size:var(--pfs-xl2);letter-spacing:.16em;line-height:1.55;
  color:#ff9dbe;text-shadow:0 0 10px rgba(240,112,156,.55),0 1px 2px rgba(0,0,0,.55);
  padding:1px 0}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .afftitle{background:linear-gradient(92deg,#f0709c,#ffd9e6 46%,#e6cf9a);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;text-shadow:none;
    padding:1px 0 2px}
}
.afflv{margin-left:auto;font-family:var(--ff-title);font-size:var(--pfs-md2);letter-spacing:.1em;color:var(--affc)}
.affval{font-family:var(--ff-num);font-size:var(--pfs-md);color:var(--ink-dim);font-variant-numeric:tabular-nums}
.affhearts{position:relative;display:flex;align-items:center;gap:5px;margin:8px 0 7px;z-index:2}
.affheart{width:30px;height:28px;display:block;flex:0 0 auto;overflow:visible}
.affheart path{transition:fill .35s ease,stroke .35s ease}
.affheart.on .b{filter:drop-shadow(0 0 3px rgba(240,112,156,.95)) drop-shadow(0 0 7px rgba(240,112,156,.45))}
.affheart.on{animation:affBeat 2.6s ease-in-out infinite}
.affheart.on:nth-child(2){animation-delay:.18s}
.affheart.on:nth-child(3){animation-delay:.36s}
.affheart.on:nth-child(4){animation-delay:.54s}
.affheart.on:nth-child(5){animation-delay:.72s}
@keyframes affBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(1)}36%{transform:scale(1.08)}50%{transform:scale(1)}}
.affbar{position:relative;height:9px;border-radius:999px;background:rgba(255,255,255,.07);
  overflow:hidden;z-index:2;border:1px solid rgba(255,255,255,.06)}
.affbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#b8456e,#f0709c 46%,#f7cfae 82%,#e6cf9a);
  box-shadow:0 0 12px rgba(240,112,156,.6);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.affbar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.42) 50%,transparent 80%);
  transform:translateX(-120%);animation:affSheen 2.8s ease-in-out infinite}
@keyframes affSheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.affmeta{position:relative;display:flex;align-items:center;gap:8px;margin-top:6px;z-index:2;
  font-size:var(--pfs-sm2);color:var(--ink-dim)}
.affmeta .grow{margin-left:auto;font-family:var(--ff-num)}
.affops{position:relative;display:flex;gap:6px;margin-top:9px;z-index:2;flex-wrap:wrap}
/* v6.5：整体字号上调（作者："这些字太小了，很啰嗦"） */
.affbtn{border:1px solid rgba(240,112,156,.36);background:linear-gradient(180deg,rgba(240,112,156,.18),rgba(240,112,156,.06));
  color:#ffd9e6;border-radius:9px;font-size:var(--pfs-md2);padding:7px 13px;cursor:pointer;font-family:var(--ff-body);
  display:inline-flex;align-items:baseline;gap:5px;
  transition:transform .14s ease,box-shadow .2s ease,opacity .2s ease}
.affbtn .gain{font-family:var(--ff-num);font-style:normal;font-size:var(--pfs-cap2);color:#ffd0e2;opacity:.9}
.affbtn .lk{font-style:normal;font-size:var(--pfs-cap);color:var(--ink-faint);letter-spacing:.02em}
.affbtn[disabled]{opacity:.5}
.affbtn.close{border-color:rgba(255,190,120,.42);background:linear-gradient(180deg,rgba(255,190,120,.16),rgba(255,190,120,.05));color:#ffe2bd}
.affbtn:hover{box-shadow:0 0 14px rgba(240,112,156,.5);transform:translateY(-1px)}
.affbtn[disabled]{opacity:.34;cursor:not-allowed;box-shadow:none;transform:none}
.affbtn.gold{border-color:var(--gold-line);background:linear-gradient(180deg,rgba(216,189,122,.18),rgba(216,189,122,.05));color:var(--gold-hi)}
.affhint{position:relative;z-index:2;margin-top:7px;font-size:var(--pfs-cap2);color:#f7c9d9;min-height:16px}
.affhint.good{color:var(--ok)}
.affhint.bad{color:var(--warn)}
.affsay{position:relative;z-index:2;margin:10px 0 2px;background:rgba(255,255,255,.035);
  border:1px solid rgba(240,112,156,.20);border-radius:10px;padding:8px 10px;min-height:44px;
  font-size:var(--pfs-lg);line-height:1.75;color:var(--ink);animation:sayIn .3s ease}
.affsay.idle{color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
.affsay .up{color:#ffd98a;font-family:var(--ff-title);font-size:var(--pfs-md2);margin-bottom:4px}
.affsay.good{border-color:rgba(240,112,156,.42);box-shadow:0 0 14px rgba(240,112,156,.16)}
.affsay.levelup{border-color:var(--gold-line);box-shadow:0 0 20px rgba(216,189,122,.30);
  background:linear-gradient(180deg,rgba(216,189,122,.10),rgba(240,112,156,.08))}
.affsay.bad{border-color:rgba(200,120,120,.35);color:#f0c9c9}
.affnote{position:relative;z-index:2;margin-top:6px;font-size:var(--pfs-sm);color:var(--ink-faint);letter-spacing:.03em}
/* v6.7：未讨伐锁定横幅（解锁条件明示 · 成熟收集类做法） */
.afflock{position:relative;z-index:2;margin-top:9px;padding:7px 10px;border-radius:9px;
  font-size:var(--pfs-sm);color:#f0d79a;background:rgba(240,215,154,.10);border:1px dashed rgba(240,215,154,.45);letter-spacing:.02em}
/* v6.8：置顶按钮（好感排序 · 手动置顶）与偏爱角标（雀魂 ×1.5 口径） */
.pinbtn{margin-left:auto;border:1px solid rgba(216,189,122,.42);background:rgba(216,189,122,.08);
  color:var(--gold-hi);border-radius:999px;font-size:var(--pfs-cap2);padding:3px 10px;cursor:pointer;font-family:var(--ff-body)}
.pinbtn.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.affbtn .favmk{font-style:normal;font-size:var(--pfs-cap2);color:#ffd98a;letter-spacing:.02em}
/* 2026-10-17 · 指定讨伐令按钮：内嵌在「未讨伐」锁定行里（复用 .affbtn 语言 · 零新增行） */
.afflock .affbtn{margin-top:7px;display:inline-flex;font-size:var(--pfs-sm2);padding:5px 12px}
/* ★ v6.9 契约/誓约：铭牌 / 结契按钮 / 横幅 / 立绘金框 / 列表金环 */
.oathbar{position:relative;z-index:2;margin-top:10px;padding:7px 10px;border-radius:9px;font-size:var(--pfs-sm2);
  color:#ffe9b0;background:linear-gradient(90deg,rgba(216,189,122,.20),rgba(240,112,156,.10));
  border:1px solid rgba(216,189,122,.55);letter-spacing:.03em}
.oathbox{position:relative;z-index:2;margin-top:10px;padding:9px 10px;border-radius:10px;text-align:center;
  background:linear-gradient(180deg,rgba(216,189,122,.16),rgba(216,189,122,.04));border:1px dashed rgba(216,189,122,.5)}
.oathnote{font-size:var(--pfs-sm);color:#f0d79a;margin-bottom:7px}
.oathbtn{border:1px solid var(--gold);background:linear-gradient(180deg,#d8bd7a,#b08d3e);color:#221708;
  font-family:var(--ff-title);font-weight:700;font-size:var(--pfs-lg2);letter-spacing:.3em;padding:8px 20px 8px 24px;
  border-radius:999px;cursor:pointer;box-shadow:0 2px 14px rgba(216,189,122,.45)}
.oathbtn:hover{box-shadow:0 3px 20px rgba(216,189,122,.7)}
.dstage.oath{position:relative}
.dstage.oath::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;

<script>
(function () {
"use strict";

/* ============================================================
   桥（照 bossbook / goldfish 双通道：桥优先 · 父窗兜底）
   ============================================================ */
var Bridge = (function () {
  try {
    var T = CSHPage.transport({ closeName: "codex-close", timeout: 2500 });
    return { active: !!T.active, call: T.call };
  } catch (e) { return { active: false, call: function (_, __, cb) { cb && cb(false, null); } }; }
})();

function $(s) { return document.querySelector(s); }
function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
/* Optional public title wall: same policy and durable flower snapshot as the rank page. */
var SHARE = {}, SHARE_TS = 0, shareSeq = 0, shareDisposed = false;
function applyShare(list, timestamp) {
  SHARE = {}; SHARE_TS = timestamp;
  CSHNet.girls(list).forEach(function (item) { SHARE[item.girl] = item; });
}
function fetchShare(cb) {
  var seq = ++shareSeq, cached = CSHNet.cache.read('cheer', '');
  if (cached) applyShare(cached.girls, cached.ts);
  if (cb) cb();
  if (shareDisposed || !CSHOnline.enabled()) return;
  var context = CSHOnline.snapshot();
  CSHNet.request('/girls', 'GET', null, function (ok, result) {
    if (shareDisposed || seq !== shareSeq || !CSHPage.requireSave() || !CSHOnline.enabled()) return;
    var current = CSHOnline.snapshot();
    if (current.epoch !== context.epoch || current.service.id !== context.service.id) return;
    if (ok && result && result.ok && Array.isArray(result.girls)) {
      applyShare(result.girls, Date.now());
      CSHNet.cache.write('cheer', '', {girls: result.girls});
    }
    if (cb) cb();
  }, 6000);
}

var Data = { items: [], cur: -1, bridgeMinions: null };

/* 台词四类 → 中文标签（台词内容一律来自 GIRLS，不在此编造） */
var LINEDEF = [
  { key: "first", label: "初见" },
  { key: "hold",  label: "持有" },
  { key: "up",    label: "上涨" },
  { key: "down",  label: "下跌" }
];

/* ============================================================
   数据：父窗直读（同源可用 · 与 goldfish 一致）
   ============================================================ */
function parentData() {
  try {
    var P = window.parent;
    var M = (P && P.CSH && P.CSH.market) ? P.CSH.market
          : (P && P.lib && P.lib.cshMarket ? P.lib.cshMarket : null);
    var R = (P && P.lib && P.lib.cshBossRecord) ? P.lib.cshBossRecord : null;
    return { market: M || null, rec: R || null, lib: (P && P.lib) ? P.lib : null };
  } catch (e) { return {}; }
}

/* 讨伐统计：summary().minions = {id:{n,heat,name}}（仅含已讨伐者 · 未讨即空） */
function minionMap(R) {
  try {
    if (R && typeof R.summary === "function") {
      var s = R.summary();
      if (s && s.minions && typeof s.minions === "object") return s.minions;
    }
  } catch (e) {}
  return null;
}

/* 名字：数据层真源 → 讨伐统计 → translate → character.name → id 原键（保证不空）
   ------------------------------------------------------------------
   ★ v6.7 修复（作者实机：50 位妖灵全部显示成英文原始 id 而非中文名）：
     旧链第一顺位是 summary().minions[id].name（**未讨伐即空**），第二顺位是 lib.translate
     ——那是 boss 角色包被引擎 loadCharacter 之后才落地的，懒人包/旧版客户端拿不到
     ⇒ 兜底 return id。现在把**数据层静态名单**（core/csh_bossdata.js 的 MINION_NAMES，
     由金鳞市转交）提到最前：零加载时序依赖，translate 降级为兜底。
   ★ 末级回退必须留痕：静默回退是本项目反复复发的坑，这里打一条可搜索的 warn。 */
function nameOf(id, names, minions, L) {
  try { if (names && names[id]) return names[id]; } catch (e) {}
  try { if (minions && minions[id] && minions[id].name) return minions[id].name; } catch (e) {}
  try { if (L && L.translate && L.translate[id]) return L.translate[id]; } catch (e) {}
  try {
    if (L && L.character && L.character[id] && L.character[id].name) return L.character[id].name;
  } catch (e) {}
  try { console.warn("[池子魔将][图鉴] 缺名 id: " + id); } catch (e) {}
  return id;
}

/* 立绘路径：优先取 lib.character[id].img/.face 的 basename（扩展角色条目存了完整路径）；
   iframe 拿不到 bossdata，故兜底按 id 拼 —— 立绘文件名 = 妖灵主名（id 去掉前缀）。 */
function pathOf(id, name, L, which) {
  try {
    var ch = L && L.character && L.character[id];
    var full = ch && (which === "face" ? ch.face : ch.img);
    if (full) {
      var base = String(full).split("/").pop();
      if (base) return "../image/" + base;
    }
  } catch (e) {}
  var main = String(id == null ? "" : id).replace(/^csh_boss_minion_/, "");
  return "../image/" + (which === "face" ? "csh_face_" : "csh_minion_") + main + ".webp";
}

/* 采集：market 提供人设（GIRLS）与挂牌顺序（LISTED）；minions 提供次数/热度 */
function collect() {
  var d = parentData();
  var M = d.market, L = d.lib;
  var G = (M && M.GIRLS) ? M.GIRLS : null;
  var LISTED = (M && M.LISTED) ? M.LISTED : null;
  if (!G || !LISTED || !LISTED.length) return null;
  var minions = minionMap(d.rec);
  if (!minions) minions = Data.bridgeMinions || {};
  /* 数据层名字（csh_bossdata.MINION_NAMES 由金鳞市转交）——与 GIRLS/LISTED 同源同时可用 */
  var names = (M && M.MINION_NAMES) ? M.MINION_NAMES : null;
  return { G: G, LISTED: LISTED, minions: minions, names: names, lib: L };
}

/* 按 LISTED 顺序成表（只列 GIRLS 里有的人设 · 无任何硬编码名单） */
function buildItems(c) {
  var out = [];
  for (var i = 0; i < c.LISTED.length; i++) {
    var id = c.LISTED[i];
    var girl = c.G[id];
    if (!girl) continue;
    var rec = c.minions[id] || null;
    var name = nameOf(id, c.names, c.minions, c.lib);
    out.push({
      id: id, name: name,
      tag: girl.tag || "", bio: girl.bio || "",
      lines: girl.lines || null,
      aff: affLines(id),                          /* v6.3 好感台词（950 句库，逐人考据） */
      affState: affOf(id),                        /* v6.2 好感度状态 */
      n: (rec && rec.n > 0) ? rec.n : 0,
      heat: (rec && typeof rec.heat === "number") ? rec.heat : null,
      img: pathOf(id, name, c.lib, "img"),
      face: pathOf(id, name, c.lib, "face")
    });
  }
  return out;
}

/* ============================================================
   好感度（v6.2）· 数据 + 交互
   ------------------------------------------------------------
   数据源：父窗 lib.cshAffection（同源直读）；写操作走桥 shell-aff-do，
   父窗缺失时降级为「只读」——不静默失败，界面会如实标注。
   ============================================================ */
var AFF = {
  /* ★ 2026-10-16 深夜 · 雀魂移植（与宿主 csh_affection 同源同值）：
     五段累计 2000/8000/18000/38000/88000（满羁绊）；礼物 200/1000/5000/12000 · 偏好 ×1.5。 */
  max: CSHBond.MAX,
  levels: CSHBond.LEVELS,
  /* v6.3：礼物四档（涨价）+ 三种互动动作 + 四档经济回报（与宿主 csh_affection 同源同值） */
  gifts: [
    { key: "wine", name: "一杯烈酒", cost: 6000, add: 200 },
    { key: "rose", name: "一束夜蔷薇", cost: 28000, add: 1000 },
    { key: "relic", name: "一枚旧徽章", cost: 120000, add: 5000 },
    { key: "stardust", name: "一捧星砂", cost: 680000, add: 12000 }
  ],
  acts: [
    { key: "greet", name: "打个招呼", gain: 0, hint: "不计好感、不冷却——只是想听她说话" },
    { key: "talk", name: "说说话", gain: 1, hint: "每天一次 +1" },
    { key: "head", name: "摸摸头", gain: 1, hint: "每天一次 +1" }
  ],
  perks: [
    { level: "C", key: "fee1", tag: "相识", name: "挂单折扣", desc: "手续费 −0.3%" },
    { level: "B", key: "tip", tag: "亲近", name: "她的消息", desc: "每交易日一条涨跌倾向" },
    { level: "A", key: "fee2", tag: "信赖", name: "深度挂单", desc: "手续费再 −0.4%" },
    { level: "S", key: "div", tag: "羁绊", name: "共担风险", desc: "日分红 +0.5%" }
  ],
  gain: { hunt: 6, hold: 2, talk: 1, head: 1 },
  say: null,
  cache: null,
  api: null, quantity: 1, giftPending: null, giftBusy: false, giftQuoteSeq: 0
};

function affApi() {
  if (AFF.api) return AFF.api;
  try {
    var P = window.parent;
    AFF.api = (P && P.lib && P.lib.cshAffection) ? P.lib.cshAffection
            : (P && P.CSH && P.CSH.affection) ? P.CSH.affection : null;
  } catch (e) { AFF.api = null; }
  return AFF.api;
}

/* 整份好感台词（逐条列出 + 未解锁占位）；宿主缺失时返回 null */

    if (ok && res.gain) msgs.push("好感 +" + res.gain);
    if (ok && res.cost) msgs.push("花费 " + fmt(res.cost) + " CBY");
    if (res.leveledUp) msgs.push("★ 升入「" + (res.upLevel || res.levelName || "") + "」");
    if (!ok) msgs.push(WHY[res.reason] || (res.reason && !/^[a-z-]+$/.test(res.reason) ? res.reason : "尚未确认，请重试这笔赠礼。"));
    /* 回礼只在这条醒目气泡上说一次，不再在下面小字里重复（作者嫌啰嗦） */
    var top = "";
    if (res.give) top = "✦ 她塞给你 " + fmt(res.give) + " CBY" + (res.upLine ? "（" + res.upLine + "）" : "");
    else if (res.upLine) top = "✦ " + res.upLine;
    AFF.say = {
      id: id, line: res.giveLine || res.line || "", up: top,
      tone: ok ? (res.leveledUp || res.give ? "levelup" : "good") : "bad",
      msg: msgs.filter(Boolean).join(" · ")
    };
    /* 收到回礼 → 让宿主刷新右上角的 CBY 胶囊 */
    if (res.give) { try { Bridge.call("shell-pc", null, function () {}); } catch (eP) {} }
    refreshAff(id);
    var it = Data.items[Data.cur];
    if (it) { renderAff(it); renderEcho(it); renderList(); }
  };
  /* ① 同源直读：直接调宿主 API（父窗缺失时才是桥） */
  var A = affApi();
  if (A) {
    try {
      if (act === "gift" && typeof A.gift === "function") { done(A.gift(id, giftKey, giftRequest.quantity, giftRequest)); return; }
      if (typeof A.interact === "function") { done(A.interact(id, act)); return; }
    } catch (e) { done({ok:false,reason:"save"}); return; }
  }
  /* ② 桥兜底 */
  Bridge.call("shell-aff-do", { id: id, act: act, gift: giftKey, quantity: giftRequest && giftRequest.quantity, request: giftRequest }, function (ok, res) { done(res || {ok:false,reason:"save"}); });
}

/* ============================================================
   渲染
   ============================================================ */
function renderStats() {
  var box = $("#stats");
  box.innerHTML = "";
  var total = Data.items.length, kills = 0, killed = 0;
  for (var i = 0; i < total; i++) {
    kills += Data.items[i].n;
    if (Data.items[i].n > 0) killed++;
  }
  var s1 = el("span", "stat", "图鉴 "); s1.appendChild(el("b", "", String(total))); box.appendChild(s1);
  var s2 = el("span", "stat", "已讨 "); s2.appendChild(el("b", "", String(killed))); box.appendChild(s2);
  var s3 = el("span", "stat", "总讨伐 "); s3.appendChild(el("b", "", fmt(kills))); box.appendChild(s3);
}

/* ---------- 排序与置顶（2026-10-16 深夜 · 作者："好感度高的优先排列？…可以手动给喜欢的置顶？"） ----------
   排序 = 手动置顶（按置顶先后）→ 好感降序 → 原始次序。PINS 存 localStorage。
   纪律：**就地重排 Data.items**（选中索引 Data.cur 与列表索引同源，不能影子数组）。 */
var PINS = [];
try { PINS = JSON.parse(pinLS("csh_codex_pins") || "[]") || []; } catch (eP2) { PINS = []; }
if (!Array.isArray(PINS)) PINS = [];
function pinLS(k, v) { if (v !== undefined) return CSHPage.lsSet(k, v); return CSHPage.lsGet(k) || ""; }
function pinSave() { return pinLS("csh_codex_pins", JSON.stringify(PINS)); }
function isPinned(id) { return PINS.indexOf(id) >= 0; }
function sortItems() {
  var orig = {};
  Data.items.forEach(function (it, i) { orig[it.id] = i; });
  Data.items.sort(function (a, b) {
    var pa = isPinned(a.id), pb = isPinned(b.id);
    if (pa !== pb) return pa ? -1 : 1;
    if (pa && pb) return PINS.indexOf(a.id) - PINS.indexOf(b.id);
    var va = (a.affState && a.affState.v) || 0, vb = (b.affState && b.affState.v) || 0;
    if (va !== vb) return vb - va;
    return orig[a.id] - orig[b.id];
  });
}
function togglePin(id) {
  if (!CSHPage.requireSave()) return;
  var next = PINS.slice(), i = next.indexOf(id);
  if (i >= 0) next.splice(i, 1); else next.unshift(id);
  if (!pinLS("csh_codex_pins", JSON.stringify(next))) return;
  PINS = next;
  sortItems();
  renderList();
  var it = Data.items[Data.cur];
  if (it && it.id === id) renderAff(it);
}
function renderList() {
  sortItems();   /* 置顶 → 好感降序 → 原始（每次重渲染都随好感实时重排） */
  var box = $("#rolodex");
  box.innerHTML = "";
  Data.items.forEach(function (it, idx) {
    var row = el("button", "gitem" + (idx === Data.cur ? " on" : ""));
    row.type = "button"; row.setAttribute("aria-label", it.name + " · 查看档案"); row.setAttribute("aria-pressed", idx === Data.cur ? "true" : "false");
    if (it.affState && it.affState.oath) row.classList.add("oath");   /* ★ v6.9：契约金环 */
    row.setAttribute("data-idx", String(idx));
    var f = el("div", "gface");
    var img = el("img"); img.alt = it.name;
    /* 图片兜底：失败则隐去影像、露出首字占位，避免裂图 */
    img.onerror = function () { f.classList.add("noimg"); };
    f.appendChild(img);
    f.appendChild(el("span", "gph", String(it.name).slice(0, 1)));
    img.src = it.face;
    row.appendChild(f);
    var meta = el("div", "gmeta");
    meta.appendChild(el("div", "gname", it.name));
    var st = it.affState || affOf(it.id);
    var lv = affLevel(st.v);
    var gs = el("div", "gsub" + (lv.key === "S" ? " aff-s" : ""));
    gs.appendChild(el("span", "gk", it.n > 0 ? ("×" + it.n) : "未讨"));
    if (st.v > 0) {
      var hb = el("span", "gh", "\u2665 " + st.v);
      hb.title = "她对你的好感 " + st.v + " / " + AFF.max + "（" + lv.name + "）";
      gs.appendChild(hb);
    }
    meta.appendChild(gs);
    row.appendChild(meta);
    row.addEventListener("click", function () { select(idx); }, false);
    box.appendChild(row);
  });
}

/* ---------- 回响 · 台词汇编（v6.4）----------
   ★ 作者：台词全列出来"会减少新鲜度"，"有些内容没必要让玩家看到"。
     ⇒ 不再预播全部台词：只显示**她真的说过的那几句**，没说过的是「？？？」。
       台词由 csh_affection 的 heard 记录，选句时**优先挑没听过的**。
   ★ 顺带把金鳞市的"人设台词"也一并收进来，图鉴只当档案与收集册，不再当台词表。 */
var ECHO_SEC = [
  ["greet", "打招呼"],
  ["talk", "闲聊"],
  ["head", "摸头"],
  ["close", "贴近 · 亲近 8000 起"],
  ["give", "她的回礼"],
  ["gift", "礼物 · 四档"],
  ["up", "升档 · 2000 / 8000 / 18000 / 38000"],
  ["top", "羁绊 · 38000 起"],
  ["cool", "疏远"]
];
function echoRows(kind, heard) {
  if (!heard) return [];
  if (kind === "gift" || kind === "up") {
    var o = heard[kind] || {}, out = [];
    for (var k in o) out.push(o[k] ? ("「" + o[k] + "」") : "「？？？」");
    return out;
  }
  if (kind === "top" || kind === "cool") {
    return [heard[kind] ? ("「" + heard[kind] + "」") : "「？？？」"];
  }
  return (heard[kind] || []).map(function (t) { return t ? ("「" + t + "」") : "「？？？」"; });
}
function renderEcho(it) {
  var box = $("#dlines");
  if (!box) return;
  box.innerHTML = "";
  var A = affApi();
  var prog = (A && typeof A.heardOf === "function") ? A.heardOf(it.id) : null;
  var heard = (A && typeof A.heardLines === "function") ? A.heardLines(it.id) : null;

  var head = el("div", "echead");
  head.appendChild(el("div", "ectitle", "回 响"));
  if (prog) head.appendChild(el("div", "ecnum", prog.got + " / " + prog.all));
  box.appendChild(head);
  box.appendChild(el("div", "ecnote", "她说过的话会留在这里。没说过的不剧透。"));
  if (prog) {
    var pb = el("div", "ecbar");
    var pbi = document.createElement("i");
    pbi.style.width = Math.max(2, Math.round(prog.got / Math.max(1, prog.all) * 100)) + "%";
    pb.appendChild(pbi);
    box.appendChild(pb);
  }

  if (!prog || !prog.all) {
    box.appendChild(el("div", "ecnote", A ? "还没有和她说过话。" : "宿主未连接，暂不可用。"));
    return;
  }
  var det = document.createElement("details");
  det.className = "ecbook";
  var sum = document.createElement("summary");
  sum.textContent = "展开台词汇编（" + prog.got + " / " + prog.all + "）";
  det.appendChild(sum);
  ECHO_SEC.forEach(function (def) {
    var row = (prog.list || []).filter(function (x) { return x.kind === def[0]; })[0];
    if (!row) return;
    var rows = echoRows(def[0], heard);
    var sec = el("div", "ecsec" + (row.got >= row.all ? " full" : ""));
    sec.appendChild(el("div", "ecslabel", def[1] + " · " + row.got + " / " + row.all));
    rows.forEach(function (t) {
      sec.appendChild(el("div", "ecline" + (t === "「？？？」" ? " lock" : ""), t));
    });
    det.appendChild(sec);
  });
  box.appendChild(det);
}

function renderDossier(it) {
  var stage = $(".dstage");
  stage.classList.remove("noimg");
  var img = $("#dimg");
  img.alt = it.name;
  img.onerror = function () { stage.classList.add("noimg"); };   /* 大图兜底：占位名 */
  img.src = it.img;
  $("#dph").textContent = it.name;
  $("#dname").textContent = it.name;
  $("#dtag").textContent = it.tag || "金鳞市挂牌";
  /* Public snapshot stays available offline; unavailable data never fabricates a chief. */
  var sh = SHARE[it.id], dc = $("#dchief");
  if (dc) {
    if (sh && sh.chief_name) {
      dc.textContent = "公开快照（" + new Date(SHARE_TS).toLocaleDateString() + "）· 魁首 " + sh.chief_name + " · 壁上：" + (sh.chief_sig || "未题壁");
      dc.hidden = false;
    } else dc.hidden = true;
  }
  $("#dbio").textContent = it.bio || "";
  renderAff(it);
  renderEcho(it);
  $("#fN").textContent = it.n > 0 ? (it.n + " 次") : "—";
  $("#fHeat").textContent = (typeof it.heat === "number" && it.heat > 0) ? ("+" + it.heat + "%") : "—";
  $("#fList").textContent = "已挂牌";
}

function setRosterOpen(open, focusRow) {
  document.body.classList.toggle("codex-roster-open", !!open);
  var toggle = $("#codex-roster-toggle");
  toggle.setAttribute("aria-expanded", open ? "true" : "false");
  toggle.textContent = open ? "收起名录" : "名录";
  if (focusRow) {
    var row = $("#rolodex .gitem.on");
    if (open && row) {
      var list = $("#rolodex"), selected = row.getBoundingClientRect(), visible = list.getBoundingClientRect();
      if (selected.top < visible.top) list.scrollTop += selected.top - visible.top;
      else if (selected.bottom > visible.bottom) list.scrollTop += selected.bottom - visible.bottom;
      row.focus({ preventScroll: true });
    }
    else if (!open) toggle.focus({ preventScroll: true });
  }
}
$("#codex-roster-toggle").addEventListener("click", function () {
  setRosterOpen(!document.body.classList.contains("codex-roster-open"), true);
});

function select(idx) {
  AFF.giftQuoteSeq++;if(!AFF.giftBusy)AFF.giftPending=null;
  var n = Data.items.length;
  if (!n) return;
  if (idx < 0) idx = n - 1;
  if (idx >= n) idx = 0;
  Data.cur = idx;
  var rows = $("#rolodex").children;
  for (var i = 0; i < rows.length; i++) {
    if (i === idx) rows[i].classList.add("on"); else rows[i].classList.remove("on");
    rows[i].setAttribute("aria-pressed", i === idx ? "true" : "false");
  }
  renderDossier(Data.items[idx]);
  $(".dinfo").scrollTop = 0;
  if (window.matchMedia("(max-width:1000px)").matches && document.body.classList.contains("codex-roster-open")) setRosterOpen(false, true);
  /* 淡入：重触发 dossier 入场动画 */
  var d = $("#dossier");
  d.style.animation = "none"; void d.offsetWidth; d.style.animation = "";
  try { if (rows[idx] && rows[idx].scrollIntoView) rows[idx].scrollIntoView({ block: "nearest" }); } catch (e) {}
}

function renderAll() {
  renderStats();
  if (!Data.items.length) { document.body.classList.add("empty"); return; }
  document.body.classList.remove("empty");
  renderList();
  select(0);
}

/* ============================================================
   启动（父窗直读优先 → 桥兜底 → 空态）
   ============================================================ */
/* 指定讨伐令（2026-10-17）：价格单点（与宿主 csh_bossrecord.BOUNTY_COST 一致，此处仅用于文案） */
var BOUNTY_COST = 1000;
/* 下单：**扣费与落标记全在宿主**（shell-bounty）——页面不碰钱包、不写存档；
   宿主先校验（池外/已讨伐直接拒）再扣费，落标记失败原额回滚。 */
function doBounty(id, btn) {
  if (!Bridge.active) { return; }
  btn.disabled = true;
  btn.textContent = "下单中…";
  Bridge.call("shell-bounty", { bid: id }, function (ok, res) {
    if (!ok) {
      var why = (res && res.reason) || "fail";
      try { console.warn("[池子魔将][悬赏] 下单失败：reason=" + why); } catch (eW) {}
      btn.disabled = false;
      btn.textContent = (why === "poor") ? ("CBY 不够（需 " + BOUNTY_COST + "）")
        : ((why === "hunted") ? "她已被讨伐" : "悬赏失败 · 点我再试");
      return;
    }
    Data.bountyTarget = id;
    btn.textContent = "已悬赏 · 待她现身";
    btn.setAttribute("disabled", "1");
    try { Bridge.call("shell-pc", null, function () {}); } catch (eP) {}
  });
}
function boot() {
  var c = collect();
  if (c) { Data.items = buildItems(c); renderAll(); return; }
  if (Bridge.active) {
    Bridge.call("shell-stats", null, function (ok, snap) {
      if (ok && snap && snap.boss && snap.boss.minions && typeof snap.boss.minions === "object") {
        Data.bridgeMinions = snap.boss.minions;
      }
      if (ok && snap) Data.bountyTarget = String(snap.bounty || "");
      var c2 = collect();                 /* 人设仍需父窗 —— 拿不到则仍空态 */
      Data.items = c2 ? buildItems(c2) : [];
      renderAll();
    });
  } else {
    Data.items = [];
    renderAll();
  }
}

/* 键盘翻页 */
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && window.matchMedia("(max-width:1000px)").matches && document.body.classList.contains("codex-roster-open")) {
    e.preventDefault(); e.stopPropagation(); setRosterOpen(false, true); return;
  }
  if (!Data.items.length || (e.target && e.target.closest && e.target.closest("input,select,textarea,[contenteditable=true]"))) return;
  if (e.key === "ArrowLeft") select(Data.cur - 1);
  else if (e.key === "ArrowRight") select(Data.cur + 1);
}, false);

boot();
/* 进页先取一次花榜（只读）；到手后把当前选中那只重绘一次，让魁首题壁出现（失败则沉默） */
function refreshShareView() { try { if (Data.items.length && Data.cur >= 0) renderDossier(Data.items[Data.cur]); } catch (e) {} }
var unsubscribeShare = CSHOnline.subscribe(function () { CSHNet.cancelAll(); fetchShare(refreshShareView); });
window.addEventListener('pagehide', function () { shareDisposed = true; shareSeq++; unsubscribeShare(); CSHNet.cancelAll(); });
fetchShare(refreshShareView);
})();
</script>
