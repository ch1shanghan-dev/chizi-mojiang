<!DOCTYPE html>
<!-- ============================================================
     妖灵图鉴（讨伐录平级的档案页 · 2026-10-14 批次 C · galgame 风）
     ------------------------------------------------------------
     · 五十位妖灵的大图档案：左栏竖排名录（人像缩略 + 名字 + 讨伐次数），
       右栏 = 主立绘 + 名字/定位 + 简介 + 台词全集（初见/持有/上涨/下跌）+ 数据格
     · 数据双通道：父窗直读优先（CSH.market.GIRLS / lib.cshBossRecord.summary），
       兜底走桥 shell-stats 的 snap.boss（仅在父窗缺失时）
     · 视觉：暗金 × 深底 —— 与 games/goldfish.html 同一套 CSS 变量与卡片语言
     · 档案与既有互动；装扮只写外观偏好，不改变战斗状态
     ============================================================ -->
<html lang="zh-CN" data-csh-palette="portrait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>妖灵图鉴</title>
<script src="../core/csh_selftest.js" data-csh-selftest="auto"></script>
<script src="../core/csh_page.js"></script>
<script src="../core/csh_online.js"></script>
<script src="../core/csh_net.js"></script>
<script src="../core/csh_bond.js"></script>
<script src="../core/csh_spirit_skins.js"></script>
<script src="../core/csh_spirit_skins_catalog.js"></script>
<script src="../core/csh_spirit_buffs.js"></script>
<style>
/* 书法体注册：ZMX3 = **全覆盖子集**（4058 字 · 由开源 Zhi Mang Xing 完整版子集化，
   2026-10-15）。此前本页误把 csh_fx_font_1/2（78/84 字的**游戏内技能横幅**专用子集）
   放进 --ff-title 首位 → 任何不在子集内的字逐字回退系统宋体 → 同一个人名里混排两种
   字体（作者实机截图确认）。现按 docs/art-direction.md §4.1 回归三档规范，
   书法体降为独立的点缀档 --ff-callig。 */
@font-face{font-family:'ZMX3';src:url("../font/csh_fx_font_3.woff2") format("woff2");font-display:swap}

:root{
  --bg:#191512; --bg2:#221c17; --panel:#2a231c; --panel2:#332b21;
  --ink:#efe6cf; --ink-dim:rgba(239,230,207,.62); --ink-faint:rgba(239,230,207,.36);
  --gold:#d8bd7a; --gold-2:#b08d3e; --line:rgba(216,189,122,.28); --line-2:rgba(216,189,122,.14);
  /* 字体四档（全项目一致）：① 标题宋 ② 正文黑 ③ 数字牌 ④ 书法点缀 */
  --ff-title:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --ff-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --ff-num:"Times New Roman",Times,"Nimbus Roman","Songti SC",serif;
  --ff-callig:"ZMX3","Zhi Mang Xing","Kaiti SC","STKaiti",KaiTi,var(--ff-title);

  /* 字号收编档（2026-10-20）：同值 token 替换裸字号，渲染不变；同档多值待实机测量后并档 */
  --pfs-cap: 12px;
  --pfs-cap2: 12px;
  --pfs-sm: 12px;
  --pfs-sm2: 12.5px;
  --pfs-md: 13px;
  --pfs-md2: 13.5px;
  --pfs-lg: 14px;
  --pfs-lg2: 15px;
  --pfs-lg3: 15.5px;
  --pfs-xl: 17px;
  --pfs-xl2: 18px;
  --pfs-xl3: 19px;
  --pfs-2xl: 21px;
  --pfs-2xl2: 24px;
  --pfs-3xl: 28px;
  --pfs-3xl2: 30px;
  --pfs-4xl: 44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:
  radial-gradient(120% 80% at 50% 0%,rgba(216,189,122,.06),transparent 55%),
  linear-gradient(170deg,var(--bg2),var(--bg));
  color:var(--ink);font-family:var(--ff-body);font-size:var(--pfs-lg)}
#app{display:flex;flex-direction:column;height:100%;padding:8px 12px 6px 30px}

/* ---------- 顶部条 ----------
   ★ padding-right = 给宿主右上角的「CBY 胶囊 + 关闭按钮」留的避让带。
   2026-10-15 作者截图：'图鉴/已讨/总讨伐' 三个胶囊贴得太右，被金钱胶囊压住 ——
   避让带由 150 → 268px（三枚胶囊整体左移约 118px），仍留足余量不贴边。 */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:42px;padding-right:268px}
.brand{font-family:var(--ff-callig);font-size:var(--pfs-2xl2);letter-spacing:.2em;color:var(--gold)}
.brand small{font-size:var(--pfs-sm);letter-spacing:.1em;color:var(--ink-faint);margin-left:8px;font-family:var(--ff-body)}
.stats{margin-left:auto;display:flex;gap:8px;font-family:var(--ff-num);font-size:var(--pfs-lg);font-variant-numeric:tabular-nums}
.stat{background:rgba(216,189,122,.10);border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;white-space:nowrap}
.stat b{color:var(--gold);font-weight:600}

/* ---------- 主体：左名录 + 右档案 ---------- */
.main{flex:1 1 auto;min-height:0;display:flex;gap:12px;padding:8px 0 6px}
.rolodexwrap{flex:0 0 196px;min-height:0}
.rolodex{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:6px;padding-right:4px}
.gitem{display:flex;align-items:center;gap:8px;padding:5px 7px;cursor:pointer;
  border:1px solid var(--line-2);border-radius:10px;background:rgba(255,255,255,.02);
  transition:transform .14s ease,border-color .14s ease,background .14s ease}
.gitem:hover{border-color:var(--line)}
.gitem:active{transform:scale(.98)}
.gitem.on{border-color:var(--gold);background:rgba(216,189,122,.10);
  box-shadow:inset 0 0 0 1px rgba(216,189,122,.18)}
.gface{position:relative;flex:0 0 44px;width:44px;height:55px;border-radius:7px;overflow:hidden;background:#141110}
.gface img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.gph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-family:var(--ff-title);font-size:var(--pfs-xl3);color:var(--ink-faint)}
.gface.noimg img{display:none}
.gface.noimg .gph{display:flex}
.gmeta{flex:1 1 auto;min-width:0}
.gname{font-family:var(--ff-title);font-size:var(--pfs-lg3);letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem.on .gname{color:var(--gold)}
.gsub{display:flex;align-items:center;gap:6px;font-size:var(--pfs-sm);color:var(--ink-dim);margin-top:3px}
.gsub .gk{font-family:var(--ff-num)}
.gsub .gh{font-family:var(--ff-num);font-size:var(--pfs-sm);color:#f0709c;background:rgba(240,112,156,.14);
  border:1px solid rgba(240,112,156,.30);border-radius:999px;padding:0 6px;line-height:16px}
.gsub.aff-s .gh{color:#fff;background:rgba(240,112,156,.34)}

/* ---------- 右：档案主体（galgame 面板） ---------- */
.dossier{flex:1 1 auto;min-width:0;display:flex;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;background:linear-gradient(150deg,var(--panel2),var(--bg2));
  box-shadow:0 14px 40px rgba(0,0,0,.42);animation:cf-in .4s ease}
@keyframes cf-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dstage{position:relative;flex:0 0 40%;background:#141110;overflow:hidden}
.dstage img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block;animation:cf-in .5s ease}
.dstage.noimg img{display:none}
.dph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-family:var(--ff-title);font-size:var(--pfs-4xl);letter-spacing:.2em;color:var(--ink-faint);
  background:linear-gradient(180deg,var(--panel2),var(--panel))}
.dstage.noimg .dph{display:flex}
.dstage::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset -40px 0 60px -30px rgba(25,21,18,.95)}
.dinfo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px;
  padding:14px 16px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dname{font-family:var(--ff-title);font-size:var(--pfs-3xl2);letter-spacing:.12em;color:var(--ink)}
.dtag{font-size:var(--pfs-md2);color:var(--gold);letter-spacing:.14em;margin-top:3px}
.dbio{font-size:var(--pfs-lg);line-height:1.85;color:var(--ink-dim);
  border-left:2px solid var(--line);padding-left:10px}

/* 台词全集 */
.dlines{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;margin-top:2px}
.lgroup{background:rgba(216,189,122,.06);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px}
.lglabel{font-size:var(--pfs-sm);color:var(--gold);letter-spacing:.18em;margin-bottom:5px}
.lline{font-size:var(--pfs-lg);line-height:1.8;color:var(--ink);opacity:.92;
  padding-left:12px;position:relative}
.lline::before{content:"”";position:absolute;left:0;top:0;color:var(--gold-2);font-family:var(--ff-title)}

/* 数据格 */
.dfacts{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:4px}
.fact{background:rgba(255,255,255,.03);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px}
.fact .k{font-size:var(--pfs-sm);color:var(--ink-faint);letter-spacing:.06em}
.fact .v{font-size:var(--pfs-xl);color:var(--ink);margin-top:3px}
.fact .v.num{font-family:var(--ff-num)}

/* ---------- 底部 ---------- */
.foot{flex:0 0 auto;font-size:var(--pfs-sm2);color:var(--ink-faint);letter-spacing:.06em;padding:5px 2px 2px;display:flex;gap:10px}
.foot .dot{color:var(--gold-2)}

/* ---------- 空态 ---------- */
#empty{display:none;flex:1 1 auto;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px 16px}
body.empty #empty{display:flex}
body.empty .main{display:none}
body.empty .foot{display:none}
#empty .e1{font-family:var(--ff-title);font-size:var(--pfs-xl);letter-spacing:.08em;color:var(--gold)}
#empty .e2{font-size:var(--pfs-md2);letter-spacing:.08em;color:var(--ink-dim);line-height:1.9;max-width:560px}
#empty .eline{width:150px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}

@media (max-height:500px){
  .foot{display:none}
}

/* ============================================================
   好感度（v6.2）—— 爱心不用文字，用会呼吸的形状
   ------------------------------------------------------------
   设计语言：暗底 + 品红金渐变 + 呼吸光晕。
   · 空心心 = 未达档位（描边，低不透明度）
   · 实心心 = 已达档位（渐变填充 + 外发光 + 呼吸脉动，逐颗错峰）
   · S 档：整排加一层缓慢旋转的锥形光晕 + 星点
   ============================================================ */
.affbox{position:relative;flex:0 0 auto;            /* ★v6.3 修：有 overflow:hidden 的 flex 项
  min-height:auto 失效，会被同栏内容挤成一条 ⇒ 必须固定不收缩 */
  background:linear-gradient(135deg,rgba(240,112,156,.10),rgba(216,189,122,.05) 60%,transparent);
  border:1px solid rgba(240,112,156,.22);border-radius:12px;padding:10px 12px 11px;overflow:hidden;
  --affc:#f0709c}
.affbox::before{content:"";position:absolute;inset:-40% -60% auto auto;width:220px;height:220px;
  background:radial-gradient(circle,rgba(240,112,156,.22),transparent 62%);
  animation:affHalo 7s ease-in-out infinite;pointer-events:none}
@keyframes affHalo{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.12);opacity:.95}}
.affbox.sTier::after{content:"";position:absolute;inset:-70%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(240,112,156,.20),transparent 22%,rgba(216,189,122,.18) 44%,transparent 66%,rgba(240,112,156,.20));
  animation:affSpin 9s linear infinite;filter:blur(2px)}
@keyframes affSpin{to{transform:rotate(360deg)}}
.affhead{position:relative;display:flex;align-items:center;gap:8px;z-index:2}
/* v6.3 修：原来 filter:drop-shadow + background-clip:text 在 Chromium 下会让文字
   **只渲染出一部分**（作者实机：「亲密有一部分文字不可见」）。改为
   ① 兜底色（不支持 clip 时也是亮粉色，永远看得见）
   ② 只在支持 background-clip:text 时才切渐变（并且不再用 filter，改 glow 光晕） */
.afftitle{font-family:var(--ff-callig);font-size:var(--pfs-xl2);letter-spacing:.16em;line-height:1.55;
  color:#ff9dbe;text-shadow:0 0 10px rgba(240,112,156,.55),0 1px 2px rgba(0,0,0,.55);
  padding:1px 0}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .afftitle{background:linear-gradient(92deg,#f0709c,#ffd9e6 46%,#e6cf9a);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;text-shadow:none;
    padding:1px 0 2px}
}
.afflv{margin-left:auto;font-family:var(--ff-title);font-size:var(--pfs-md2);letter-spacing:.1em;color:var(--affc)}
.affval{font-family:var(--ff-num);font-size:var(--pfs-md);color:var(--ink-dim);font-variant-numeric:tabular-nums}
.affhearts{position:relative;display:flex;align-items:center;gap:5px;margin:8px 0 7px;z-index:2}
.affheart{width:30px;height:28px;display:block;flex:0 0 auto;overflow:visible}
.affheart path{transition:fill .35s ease,stroke .35s ease}
.affheart.on .b{filter:drop-shadow(0 0 3px rgba(240,112,156,.95)) drop-shadow(0 0 7px rgba(240,112,156,.45))}
.affheart.on{animation:affBeat 2.6s ease-in-out infinite}
.affheart.on:nth-child(2){animation-delay:.18s}
.affheart.on:nth-child(3){animation-delay:.36s}
.affheart.on:nth-child(4){animation-delay:.54s}
.affheart.on:nth-child(5){animation-delay:.72s}
@keyframes affBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(1)}36%{transform:scale(1.08)}50%{transform:scale(1)}}
.affbar{position:relative;height:9px;border-radius:999px;background:rgba(255,255,255,.07);
  overflow:hidden;z-index:2;border:1px solid rgba(255,255,255,.06)}
.affbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#b8456e,#f0709c 46%,#f7cfae 82%,#e6cf9a);
  box-shadow:0 0 12px rgba(240,112,156,.6);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.affbar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.42) 50%,transparent 80%);
  transform:translateX(-120%);animation:affSheen 2.8s ease-in-out infinite}
@keyframes affSheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.affmeta{position:relative;display:flex;align-items:center;gap:8px;margin-top:6px;z-index:2;
  font-size:var(--pfs-sm2);color:var(--ink-dim)}
.affmeta .grow{margin-left:auto;font-family:var(--ff-num)}
.affops{position:relative;display:flex;gap:6px;margin-top:9px;z-index:2;flex-wrap:wrap}
/* v6.5：整体字号上调（作者："这些字太小了，很啰嗦"） */
.affbtn{border:1px solid rgba(240,112,156,.36);background:linear-gradient(180deg,rgba(240,112,156,.18),rgba(240,112,156,.06));
  color:#ffd9e6;border-radius:9px;font-size:var(--pfs-md2);padding:7px 13px;cursor:pointer;font-family:var(--ff-body);
  display:inline-flex;align-items:baseline;gap:5px;
  transition:transform .14s ease,box-shadow .2s ease,opacity .2s ease}
.affbtn .gain{font-family:var(--ff-num);font-style:normal;font-size:var(--pfs-cap2);color:#ffd0e2;opacity:.9}
.affbtn .lk{font-style:normal;font-size:var(--pfs-cap);color:var(--ink-faint);letter-spacing:.02em}
.affbtn[disabled]{opacity:.5}
.affbtn.close{border-color:rgba(255,190,120,.42);background:linear-gradient(180deg,rgba(255,190,120,.16),rgba(255,190,120,.05));color:#ffe2bd}
.affbtn:hover{box-shadow:0 0 14px rgba(240,112,156,.5);transform:translateY(-1px)}
.affbtn[disabled]{opacity:.34;cursor:not-allowed;box-shadow:none;transform:none}
.affbtn.gold{border-color:var(--gold-line);background:linear-gradient(180deg,rgba(216,189,122,.18),rgba(216,189,122,.05));color:var(--gold-hi)}
.affhint{position:relative;z-index:2;margin-top:7px;font-size:var(--pfs-cap2);color:#f7c9d9;min-height:16px}
.affhint.good{color:var(--ok)}
.affhint.bad{color:var(--warn)}
.affsay{position:relative;z-index:2;margin:10px 0 2px;background:rgba(255,255,255,.035);
  border:1px solid rgba(240,112,156,.20);border-radius:10px;padding:8px 10px;min-height:44px;
  font-size:var(--pfs-lg);line-height:1.75;color:var(--ink);animation:sayIn .3s ease}
.affsay.idle{color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
.affsay .up{color:#ffd98a;font-family:var(--ff-title);font-size:var(--pfs-md2);margin-bottom:4px}
.affsay.good{border-color:rgba(240,112,156,.42);box-shadow:0 0 14px rgba(240,112,156,.16)}
.affsay.levelup{border-color:var(--gold-line);box-shadow:0 0 20px rgba(216,189,122,.30);
  background:linear-gradient(180deg,rgba(216,189,122,.10),rgba(240,112,156,.08))}
.affsay.bad{border-color:rgba(200,120,120,.35);color:#f0c9c9}
.affnote{position:relative;z-index:2;margin-top:6px;font-size:var(--pfs-sm);color:var(--ink-faint);letter-spacing:.03em}
/* v6.7：未讨伐锁定横幅（解锁条件明示 · 成熟收集类做法） */
.afflock{position:relative;z-index:2;margin-top:9px;padding:7px 10px;border-radius:9px;
  font-size:var(--pfs-sm);color:#f0d79a;background:rgba(240,215,154,.10);border:1px dashed rgba(240,215,154,.45);letter-spacing:.02em}
/* v6.8：置顶按钮（好感排序 · 手动置顶）与偏爱角标（雀魂 ×1.5 口径） */
.pinbtn{margin-left:auto;border:1px solid rgba(216,189,122,.42);background:rgba(216,189,122,.08);
  color:var(--gold-hi);border-radius:999px;font-size:var(--pfs-cap2);padding:3px 10px;cursor:pointer;font-family:var(--ff-body)}
.pinbtn.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.affbtn .favmk{font-style:normal;font-size:var(--pfs-cap2);color:#ffd98a;letter-spacing:.02em}
/* 2026-10-17 · 指定讨伐令按钮：内嵌在「未讨伐」锁定行里（复用 .affbtn 语言 · 零新增行） */
.afflock .affbtn{margin-top:7px;display:inline-flex;font-size:var(--pfs-sm2);padding:5px 12px}
/* ★ v6.9 契约/誓约：铭牌 / 结契按钮 / 横幅 / 立绘金框 / 列表金环 */
.oathbar{position:relative;z-index:2;margin-top:10px;padding:7px 10px;border-radius:9px;font-size:var(--pfs-sm2);
  color:#ffe9b0;background:linear-gradient(90deg,rgba(216,189,122,.20),rgba(240,112,156,.10));
  border:1px solid rgba(216,189,122,.55);letter-spacing:.03em}
.oathbox{position:relative;z-index:2;margin-top:10px;padding:9px 10px;border-radius:10px;text-align:center;
  background:linear-gradient(180deg,rgba(216,189,122,.16),rgba(216,189,122,.04));border:1px dashed rgba(216,189,122,.5)}
.oathnote{font-size:var(--pfs-sm);color:#f0d79a;margin-bottom:7px}
.oathbtn{border:1px solid var(--gold);background:linear-gradient(180deg,#d8bd7a,#b08d3e);color:#221708;
  font-family:var(--ff-title);font-weight:700;font-size:var(--pfs-lg2);letter-spacing:.3em;padding:8px 20px 8px 24px;
  border-radius:999px;cursor:pointer;box-shadow:0 2px 14px rgba(216,189,122,.45)}
.oathbtn:hover{box-shadow:0 3px 20px rgba(216,189,122,.7)}
.dstage.oath{position:relative}
.dstage.oath::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;
  border:2px solid rgba(216,189,122,.75);box-shadow:inset 0 0 26px rgba(216,189,122,.35),inset 0 0 4px rgba(255,236,180,.8)}
.gitem.oath .gface{box-shadow:0 0 0 2px rgba(216,189,122,.85),0 0 10px rgba(216,189,122,.45)}
.oathov{pointer-events:none;position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(216,189,122,.22),rgba(18,12,8,.90));animation:oathIn .5s ease}

   纪律：**就地重排 Data.items**（选中索引 Data.cur 与列表索引同源，不能影子数组）。 */

  Data.items.sort(function (a, b) {
    var pa = isPinned(a.id), pb = isPinned(b.id);

    if (pa && pb) return PINS.indexOf(a.id) - PINS.indexOf(b.id);
    var va = (a.affState && a.affState.v) || 0, vb = (b.affState && b.affState.v) || 0;
    if (va !== vb) return vb - va;
    return (Number.isInteger(a.order) ? a.order : orig[a.id]) - (Number.isInteger(b.order) ? b.order : orig[b.id]);
  });
  if (selectedId) Data.cur = Data.items.findIndex(function (it) { return it.id === selectedId; });

  }
  if (!Data.items.length || (e.target && e.target.closest && e.target.closest("input,select,textarea,[contenteditable=true]"))) return;
  if (e.key === "ArrowLeft") select(Data.cur - 1);
  else if (e.key === "ArrowRight") select(Data.cur + 1);
}, false);

boot();
/* 进页先取一次花榜（只读）；到手后把当前选中那只重绘一次，让魁首题壁出现（失败则沉默） */
function refreshShareView() { try { if (Data.items.length && Data.cur >= 0) renderDossier(Data.items[Data.cur]); } catch (e) {} }
var unsubscribeShare = CSHOnline.subscribe(function () { CSHNet.cancelAll(); fetchShare(refreshShareView); });
window.addEventListener('pagehide', function () { closeSkinDialog(false);clearOathBanner(); Data.disposed = true; Data.readEpoch++; Data.viewEpoch++; AFF.giftQuoteSeq++; shareDisposed = true; shareSeq++; unsubscribeShare(); CSHNet.cancelAll(); });
fetchShare(refreshShareView);
})();
</script>
