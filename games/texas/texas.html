/* 世界性格（csh_world）→ 本页牌风 的映射（2026-09-29 世界接入）。
   world: aggro 激进 / tight 保守 / bluff 诈唬 / math 数学家 / wild 莽夫
   here : tag 紧凶 / loose 松被动 / bluff 诈唬 */
var PERSONA_MAP = { aggro: 'tag', tight: 'tag', math: 'tag', bluff: 'bluff', wild: 'loose' };
function mapPersona(wp) { return PERSONA_MAP[wp] || pickPersona(); }

/* ============================================================
   对局状态
   ============================================================ */
var PACING = {
  long:  { key: 'long',  label: '常驻赛', sb: 10, bb: 20, every: 20, hint: '盲注每 20 手翻倍' },
  flash: { key: 'flash', label: '闪电赛', sb: 10, bb: 20, every: 6,  hint: '盲注每 6 手翻倍' },
};

var G = null;          /* 当前对局 */
var lastEquity = 0.5;  /* 玩家最近一次胜率（复盘用） */
var eqDirty = true;

function makeSession() {
  var n = Math.max(2, Math.min(6, (career.set.aiCount || 3) + 1));
  /* §4.1.1：在 shell 内带入已由宿主收费屏扣除，取 Bridge.buyIn()；
     独立调试时退回本地设定，并受本地本金约束。 */
  var want = Bridge.active && Bridge.buyIn() > 0 ? Bridge.buyIn() : (career.set.buyIn || DEFAULT_BUYIN);
  var buyIn = Bridge.active ? want : Math.max(0, Math.min(want, career.bank.bank));
  var players = [{
    id: 0, isHuman: true, name: '池子', surname: '池',
    chips: buyIn, bet: 0, contrib: 0, hole: [], folded: false, allin: false, acted: false,
    out: false, persona: null, tag: '', reveal: true, skill: 1,
  }];
  var pool = AI_NAMES.slice();
  var seats = [];
  for (var i = 1; i < n; i++) {
    /* ★ 2026-09-29 世界接入：优先用 csh_world 的真实角色
       （有名字、有身家、有牌技；豪赌桌上他们带的是玩家的 2~5 倍）。 */
    var ws = (worldSeats && worldSeats[i - 1]) ? worldSeats[i - 1] : null;
    var nm, pk, chips, skill, wid, mult;
    if (ws) {
      nm = [ws.surname, ws.name];
      pk = mapPersona(ws.persona);
      chips = Math.max(1, Math.floor(ws.stake || buyIn));
      skill = (typeof ws.skill === 'number') ? ws.skill : 0.75;
      wid = ws.id; mult = ws.mult || 1;
    } else {
      /* 无桥（独立调试）兜底：同带入的一次性对手 */
      nm = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      pk = pickPersona();
      chips = buyIn; skill = 0.75; wid = 0; mult = 1;
    }
    var p = {
      id: i, isHuman: false, name: nm[1], surname: nm[0],
      chips: chips, bet: 0, contrib: 0, hole: [], folded: false, allin: false, acted: false,
      out: false, persona: pk, tag: displayTag(pk), reveal: false,
      skill: skill, worldId: wid, mult: mult,       /* ★ 牌技 + 世界身份 */
    };
    players.push(p);
    seats.push({ id: wid, name: nm[1], stake: chips, skill: skill, mult: mult });
  }
  var isGamble = buyIn >= Bridge.gambleAt();   /* 门槛唯一真值在宿主钱包 */
  return {
    n: n, aiCount: n - 1, buyIn: buyIn,
    pacing: PACING[career.set.pacing] || PACING.long,
    players: players,
    seats: seats,             /* ★ 供结算时回写 AI 世界 */
    gamble: isGamble,
    handNo: 0, dealer: Math.floor(Math.random() * n),
    sb: 0, bb: 0, level: 0,
    community: [], pot: 0, currentBet: 0, minRaise: 0,
    toAct: -1, street: 'pre', deck: [],
    revealAll: false, winners: [], over: false, sessionOver: false,
    review: [], winStreak: 0, lastResults: null,
    tally: null,              /* 摊牌对比表（buildTally 结果；非摊牌局为 null） */
    /* §4.1.5 新增成就用统计 */
    minChips: buyIn,          /* 本场最低筹码（绝地翻盘判定） */
    noFoldStreak: 0,          /* 连续未弃牌手数（寸土不让判定） */
    handCount: 0,             /* 本场已打手数 */
    /* 台下可赢总额 = 同桌 AI 实际带入合计（自然封顶，§H.1） */
    aiStakeTotal: seats.reduce(function (s, x) { return s + (x.stake || 0); }, 0),
  };
}

function livePlayers() {
  var out = [];
  for (var i = 0; i < G.n; i++) { var p = G.players[i]; if (!p.out && !p.folded) out.push(p); }
  return out;
}
function actablePlayers() {
  var out = [];
  for (var i = 0; i < G.n; i++) { var p = G.players[i]; if (!p.out && !p.folded && !p.allin && p.chips > 0) out.push(p); }
  return out;
}

/* 盲注档位：按已完成的手数翻倍（§4.1.1 基础 bb = max(20, round(带入/50))） */
function applyBlinds() {
  var lv = Math.floor(G.handNo / G.pacing.every);
  G.level = lv;
  var mult = Math.pow(2, lv);
  var baseBB = Math.max(20, Math.round((G.buyIn || 0) / 50));
  G.bb = Math.round(baseBB * mult);
  G.sb = Math.max(1, Math.round(G.bb / 2));
}
function sbSeat() { return G.n === 2 ? G.dealer : (G.dealer + 1) % G.n; }
function bbSeat() { return G.n === 2 ? (G.dealer + 1) % G.n : (G.dealer + 2) % G.n; }
function firstToActPostflop() {
  for (var k = 1; k <= G.n; k++) {
    var i = (G.dealer + k) % G.n, p = G.players[i];
    if (!p.out && !p.folded && !p.allin && p.chips > 0) return i;
  }
  return -1;
}
function payChips(p, amt) {
  amt = Math.max(0, Math.min(Math.round(amt), p.chips));
  p.chips -= amt;
  p.bet += amt;
  p.contrib += amt;
  G.pot += amt;
  if (p.chips <= 0) {
    /* 【2026-09-30 音效增强】全下 riser：只在本手首次进入全下时响（盲注全入也算，够戏剧） */
    if (!p.allin) sfxPlay("allin");
    p.allin = true;
  }
  return amt;
}
function postBlind(idx, amount) {
  var p = G.players[idx];
  if (!p || p.out) return;
  payChips(p, Math.min(amount, p.chips));
  p.acted = false;   /* 盲注位仍可加注 */
}

/* ---------- 开手 ---------- */
function startHand() {
  if (!G || G.sessionOver) return;
  /* 只剩一人有筹码（对手全被打光）→ 本场通吃收工，否则会出现无人可行动的死锁 */
  var aliveCnt = 0;
  for (var z = 0; z < G.n; z++) if (G.players[z].chips > 0) aliveCnt++;
  if (aliveCnt <= 1) { endSession('sweep'); return; }
  G.handNo++;
  applyBlinds();
  /* 【2026-10-03 牌桌拟人】开场第一手，让一位同桌说句话（整场只说一次） */
  if (!quippedGreet && worldSeats && worldSeats.length) {
    quippedGreet = true;
    speakOf(worldSeats[Math.floor(Math.random() * worldSeats.length)], 'greet');
  }
  G.community = [];
  G.pot = 0;
  G.currentBet = 0;
  G.minRaise = G.bb;
  G.street = 'pre';
  G.over = false;
  G.revealAll = false;
  G.winners = [];
  G.review = [];
  G.lastResults = null;
  eqDirty = true;

  var i, p;
  for (i = 0; i < G.n; i++) {
    p = G.players[i];
    p.bet = 0; p.contrib = 0; p.hole = [];
    p.folded = false; p.allin = false; p.acted = false;
    p.reveal = p.isHuman;
    if (p.chips <= 0) { p.out = true; p.folded = true; }
  }

  G.deck = shuffle(newDeck());

  var start = sbSeat();
  for (var round = 0; round < 2; round++) {
    for (i = 0; i < G.n; i++) {
      var idx = (start + i) % G.n;
      p = G.players[idx];
      if (p.out) continue;
      p.hole.push(G.deck.pop());
    }
  }

  postBlind(sbSeat(), G.sb);
  postBlind(bbSeat(), G.bb);
  G.currentBet = G.bb;
  G.minRaise = G.bb;

  G.toAct = nextActor(bbSeat());
  if (G.toAct < 0) G.toAct = firstToActPostflop();

  sfx.deal();
  render();
  scheduleAI();
}

/* 下一个需要行动的人（未弃牌 / 未全下 / 本街未跟平或未行动） */
function nextActor(from) {
  for (var k = 1; k <= G.n; k++) {
    var i = (from + k) % G.n, p = G.players[i];
    if (p.out || p.folded || p.allin) continue;
    if (p.chips <= 0) continue;
    if (!p.acted || p.bet < G.currentBet) return i;
  }
  return -1;
}
function roundDone() {
  if (livePlayers().length <= 1) return true;
  var act = actablePlayers();
  for (var i = 0; i < act.length; i++) {
    if (!act[i].acted) return false;
    if (act[i].bet < G.currentBet) return false;
  }
  return true;
}

/* ============================================================
   行动与推进（四轮下注）
   ============================================================ */
function applyAction(idx, act, amount) {
  if (!G || G.over || G.sessionOver) return;
  var p = G.players[idx];
  if (!p || p.out || p.folded || p.allin) return;
  if (G.toAct !== idx) return;

  var toCall = Math.max(0, G.currentBet - p.bet);
  var actual = act;
  if (act === 'check' && toCall > 0) actual = 'call';   /* 有人下注时"过牌"即跟注 */

  if (actual === 'fold') {
    p.folded = true; p.acted = true; sfx.fold();
  } else if (actual === 'check') {
    p.acted = true; sfx.check();
  } else if (actual === 'call') {
    payChips(p, toCall); p.acted = true; sfx.chip();
  } else {
    var maxTo = p.bet + p.chips;
    var to = (actual === 'allin') ? maxTo : Math.max(Math.round(amount || 0), G.currentBet + G.minRaise);
    to = Math.min(to, maxTo);
    payChips(p, to - p.bet);
    var inc = to - G.currentBet;
    if (inc >= G.minRaise) G.minRaise = inc;
    if (to > G.currentBet) G.currentBet = to;
    for (var i = 0; i < G.n; i++) {
      var q = G.players[i];
      if (i !== idx && !q.out && !q.folded && !q.allin && q.chips > 0) q.acted = false;
    }
    p.acted = true;
    sfx.raise();
  }

  if (idx === 0) recordHuman(actual, toCall);
  /* ★ 2026-09-29：AI 行动气泡 —— 让玩家看清每个对手做了什么（跟注/加注/弃牌/全下） */
  if (idx !== 0) {
    var say = '';
    if (actual === 'fold') say = '弃牌';
    else if (actual === 'check') say = '过牌';
    else if (actual === 'call') say = toCall > 0 ? '跟注 ' + fmt(toCall) : '过牌';
    else if (actual === 'allin') say = '全下 ' + fmt(p.bet);
    else say = '加注到 ' + fmt(G.currentBet);
    announceAction(idx, say);
  }
  advance();
}

function advance() {
  if (!G || G.over || G.sessionOver) return;
  var live = livePlayers();
  if (live.length <= 1) { endHandByFold(live[0]); return; }
  if (roundDone()) { nextStreet(); return; }
  var nx = nextActor(G.toAct);
  if (nx < 0) { nextStreet(); return; }
  G.toAct = nx;
  render();
  scheduleAI();
}

function nextStreet() {
  if (!G || G.over || G.sessionOver) return;
  if (G.street === 'river') { showdown(); return; }
  G.street = G.street === 'pre' ? 'flop' : (G.street === 'flop' ? 'turn' : 'river');
  G.currentBet = 0;
  G.minRaise = G.bb;
  for (var i = 0; i < G.n; i++) { G.players[i].bet = 0; G.players[i].acted = false; }
  var need = G.street === 'flop' ? 3 : 1;
  for (var k = 0; k < need; k++) G.community.push(G.deck.pop());
  eqDirty = true;
  sfx.flip();
  render();
  if (actablePlayers().length <= 1) { later(runOut, 640); return; }
  G.toAct = firstToActPostflop();
  if (G.toAct < 0) { later(runOut, 640); return; }
  render();
  scheduleAI();
}

/* 全下后一路发完公共牌 */
function runOut() {
  if (!G || G.over || G.sessionOver) return;
  if (G.community.length >= 5) { showdown(); return; }
  var need = G.community.length === 0 ? 3 : 1;
  for (var k = 0; k < need; k++) G.community.push(G.deck.pop());
  eqDirty = true;
  sfx.flip();
  render();
  later(runOut, 640);
}

function endHandByFold(winner) {
  if (!G || G.over) return;
  G.over = true;
  if (winner) winner.chips += G.pot;
  G.winners = winner ? [winner] : [];
  G.lastResults = [{ winners: winner ? [winner] : [], amount: G.pot, byFold: true }];
  G.tally = null;                       /* 无人摊牌：不给对比表（没摊牌就没有可比的东西） */
  if (winner && winner.isHuman) onHumanWin(G.pot, false);
  quipAfterHand(winner ? [winner] : []);   /* 【2026-10-03 牌桌拟人】赢家说一句 */
  sfx.show();
  render();
  /* §4.7.2 ② 收池脉冲：必须放在 render() **之后** —— render 会重写 #pot 的 className，
     写在前面会被当场冲掉，动画根本播不出来。 */
  if (CRD) CRD.potCollect($('#pot'));
  later(showHandBanner, 620);
}

/* 摊牌停顿时长（2026-10-03）：原 780ms —— 牌刚亮出来就被结算横幅盖住，
   玩家根本没时间看清任何一家的牌（用户实机反馈的"像黑幕"有一部分就来自这里）。
   现在亮牌后停 2200ms 再弹结算，且结算横幅里同样带完整对比表，错过也不丢信息。 */
var SHOWDOWN_HOLD = 2200;

function showdown() {
  if (!G || G.over) return;
  G.street = 'showdown';
  G.revealAll = true;
  var results = awardPots();
  G.over = true;
  G.winners = [];
  var i, j;
  for (i = 0; i < results.length; i++) {
    for (j = 0; j < results[i].winners.length; j++) {
      if (G.winners.indexOf(results[i].winners[j]) < 0) G.winners.push(results[i].winners[j]);
    }
  }
  G.lastResults = results;
  G.tally = buildTally();        /* 摊牌对比数据（横幅 + 座位角标共用） */
  quipAfterHand(G.winners);   /* 【2026-10-03 牌桌拟人】摊牌后赢家说一句 */

  var human = G.players[0];
  if (human.contrib > 0) {
    var rk = heRankOf(heBest7(human.hole.concat(G.community)));
    if (rk === 9) grantAch('royal');
    else if (rk === 7) grantAch('quads');
  }
  if (G.winners.indexOf(human) >= 0) onHumanWin(humanShare(results), true);
  sfx.show();
  render();
  if (CRD) CRD.potCollect($('#pot'));     // §4.7.2 ② 收池脉冲（同 endHandByFold：必须在 render 之后）
  later(showHandBanner, SHOWDOWN_HOLD);
}

/* 单边池（多层通吃算法，正确性优先）：按投入档位逐层切池 */
/* ============================================================
   结算（2026-10-03 重构 ·《德州结算逻辑与 UI 重构方案 v1.0》§3）
   ------------------------------------------------------------
   本函数**不再自己算钱**。它只做两件事：
     ① 把引擎状态翻译成账本输入（各家本手投入 / 是否弃牌 / 底牌 / 公共牌 / 庄家位）
     ② 把账本输出应用到筹码上
   金额、底池分层、资格、平分余数、玩家账本、守恒校验全部在 core/csh_pots.js，
   界面只读 G.ledger —— 这就是方案要的「唯一结算入口」，从此不存在
   "界面按 A 算法显示、钱包按 B 算法入账"的可能。
   旧实现在这里另写了一份等价的分池逻辑：算法虽然正确，但两份实现并存的代价是
   任何一处改动都要同步两遍，而漂移一旦发生就是最难查的错账。
   ============================================================ */
function awardPots() {
  var i, P = window.CSHPots;
  /* 本手开始时的筹码 = 现筹码 + 本手已投入（payChips 只在这两者之间搬运） */
  var stacks = {};
  for (i = 0; i < G.n; i++) stacks[G.players[i].id] = G.players[i].chips + G.players[i].contrib;

  var res = P.settle({
    players: G.players.map(function (p) {
      return {
        id: p.id, name: p.isHuman ? '你' : p.name, isHuman: !!p.isHuman,
        contrib: p.contrib, folded: !!p.folded, out: !!p.out,
        hole: (p.hole && p.hole.length === 2) ? p.hole.slice() : [],
      };
    }),
    community: G.community.slice(),
    stacks: stacks,
    dealerId: G.dealer,
  });

  /* 应用账本 → 筹码（唯一一次筹码变动，之后 G.pot 归零由 startHand 负责） */
  for (i = 0; i < G.n; i++) {
    var p2 = G.players[i];
    p2.chips += (res.payouts[p2.id] || 0);
  }
  G.ledger = res;

  /* §16 调试结算日志：每一手结束输出完整账本，出错时可直接贴出来对账 */
  try { console.log('[池子魔将·德州] ' + P.logLedger(res)); } catch (eL) {}

  /* §8 守恒校验：不守恒说明有筹码被凭空造出或吞掉 —— 禁止继续下一手 */
  if (res.conservation !== 'PASS') {
    logErr('⚠ 结算筹码不守恒（potTotal=' + res.potTotal + ' startSum=' + res.startSum +
      ' endSum=' + res.endSum + '），已进入错误保护、禁止进入下一手', null);
    G.conservationFailed = true;
  }

  /* 兼容既有调用点：G.lastResults 仍按「分池」给出 winners/amount/pay 结构 */
  G.lastResults = res.pots.map(function (pt) {
    var pay = [];
    for (var id in pt.payouts) {
      if (!pt.payouts.hasOwnProperty(id)) continue;
      pay.push({ p: G.players[id], amt: pt.payouts[id] });
    }
    return {
      winners: pt.winners.map(function (id) { return G.players[id]; }),
      amount: pt.amount, score: pt.score, byFold: !!pt.byFold,
      refund: !!pt.refund, potId: pt.id, eligible: pt.eligible.slice(), pay: pay,
    };
  });
  return G.lastResults;
}

/* 玩家本手的实际到账：直接读账本，不再遍历分池求和
   （方案 §3：UI 只读账本。旧实现靠"把各分池里属于我的 amt 加起来"，
   一旦分池结构与账本口径不一致，复盘数字就会与筹码对不上。） */
function humanShare() {
  if (!G.ledger) return 0;
  return G.ledger.payouts[0] || 0;
}

/* ============================================================
   摊牌展示（2026-10-03）
   ------------------------------------------------------------
   问题：摊牌后只弹一行「X 赢 N」，玩家看不到任何一家的牌面与牌型，
   也无从判断谁比谁大 —— 实机反馈「不知道他是什么牌，直接弹结果，像黑幕」。
   修法：把「谁有什么牌、什么牌型、赢了多少」变成结算横幅的**主体内容**
   （结算依据本身），并在牌桌上把牌亮开、贴上牌型角标后再进入结算。
   数据只算一次（buildTally），横幅与座位角标共用，避免两处口径对不上。
   ============================================================ */
function handNameOf(p) {
  try {
    if (!p || !p.hole || p.hole.length !== 2 || G.community.length < 5) return '';
    return heNameOf(heBest7(p.hole.concat(G.community)));
  } catch (e) { return ''; }
}
/* 每个进入摊牌的玩家一行：手牌 / 牌型 / 本手赢得（已按赢家合并各层边池） */
function buildTally() {
  var list = [], i, j, id;
  /* 先按赢家合并所有分池层：同一赢家赢主池 + 边池时，只报一个总额。
     此前每个分池单独印一行，同一个人出现两三次「X 赢 600 / X 赢 1,200」，
     看上去像结算出了错（实际是多层边池，但界面上完全没交代）。 */
  var wonById = {}, layersById = {};
  for (i = 0; i < (G.lastResults || []).length; i++) {
    var r = G.lastResults[i], pay = r.pay || [];
    for (j = 0; j < pay.length; j++) {
      var pp = pay[j] && pay[j].p;
      if (!pp) continue;
      id = pp.id;
      wonById[id] = (wonById[id] || 0) + (pay[j].amt || 0);
      layersById[id] = (layersById[id] || 0) + 1;
    }
  }
  for (i = 0; i < G.n; i++) {
    var p = G.players[i];
    if (p.out || p.folded || !p.hole || p.hole.length !== 2) continue;
    list.push({
      p: p,
      me: !!p.isHuman,
      name: p.isHuman ? '你' : p.name,
      cards: p.hole.slice(),
      hand: handNameOf(p),
      sc: G.community.length >= 5 ? heBest7(p.hole.concat(G.community)) : 0,
      gain: wonById[p.id] || 0,
      layers: layersById[p.id] || 0,
    });
  }
  list.sort(function (a, b) { return b.sc - a.sc; });
  return list;
}

/* ---------- 战绩与勋章 ---------- */
function onHumanWin(amount, isShowdown) {
  var h = G.players[0];
  career.best.wins++;
  if (amount > (career.best.biggestPot || 0)) career.best.biggestPot = amount;
  if (isShowdown && h.hole.length === 2 && G.community.length === 5) {
    var score = heBest7(h.hole.concat(G.community));
    var rk = heRankOf(score);
    /* 原有：高牌赢 ≥500 */
    if (rk === 0 && amount >= 500) grantAch('bluff500');
    /* §4.1.5 新增 */
    if (rk === 5) grantAch('draw_flush');                                    /* 同花成局 */
    if (rk === 6) grantAch('full_house');                                    /* 葫芦压顶 */
    if (rk === 7 && amount >= 10 * (G.bb || 20)) grantAch('quad_might');     /* 四条天威 */
    if (rk === 9) grantAch('royal_flush');                                   /* 皇家同花 */
    /* 空手夺白刃：高牌赢多人池（≥3 人参与摊牌） */
    if (rk === 0) {
      var showdownP = 0;
      for (var q = 0; q < G.n; q++) { var pq = G.players[q]; if (!pq.out && !pq.folded) showdownP++; }
      if (showdownP >= 3) grantAch('bare_blade');
    }
  }
  G.winStreak++;
  if (G.winStreak >= 5) grantAch('streak5');
  saveBest();
}

/* §4.1.5 深筹耐力 / 绝地翻盘 / 寸土不让：每手结束统一判定 */
function checkSessionAch() {
  if (!G) return;
  var me = G.players[0];
  /* 记录本场最低筹码 */
  if (me.chips < (G.minChips == null ? Infinity : G.minChips)) G.minChips = me.chips;
  /* 绝地翻盘：曾低于 5×bb，当前已盈利 */
  if (G.minChips < 5 * (G.bb || 20) && me.chips > G.buyIn) grantAch('comeback');
  /* 深筹耐力：单场 50 手 */
  if ((G.handCount || 0) >= 50) grantAch('deep_stamina');
  /* 寸土不让：连续 10 手不弃牌且本场净赢 */
  if ((G.noFoldStreak || 0) >= 10 && me.chips > G.buyIn) grantAch('iron_will');
}

/* 关键手复盘：记录玩家每次决策的胜率 / 池赔 / 最优动作 / 期望差 */
function recordHuman(actual, toCall) {
  if (!G) return;
  var h = G.players[0];
  var eq = 0.5;
  if (G.community.length === 0 && h.hole.length === 2) eq = preflopScore(h.hole[0], h.hole[1]);
  else if (typeof lastEquity === 'number' && !isNaN(lastEquity)) eq = lastEquity;
  var evCall = eq * (G.pot + toCall) - (1 - eq) * toCall;
  var best = eq >= 0.70 ? 'raise' : (evCall > 0 ? 'call' : 'fold');
  var evBest = best === 'raise' ? evCall * 1.35 : (best === 'call' ? evCall : 0);
  var evAct = (actual === 'raise' || actual === 'allin') ? evCall * 1.35 : (actual === 'call' ? evCall : 0);
  G.review.push({
    street: G.street, eq: eq, toCall: toCall, pot: G.pot,
    actual: actual, best: best, gap: Math.max(0, Math.round(evBest - evAct)),
  });
}

/* ============================================================
   AI：起手牌表（翻牌前）+ 蒙特卡洛胜率（翻牌后）+ 三种人格
   性能：150 次模拟 × 4 人 × 21 组合 ≈ 1.2 万次评估，单次 <0.05ms → 总耗时 <30ms
   ============================================================ */
function aiEquityOf(idx) {
  var p = G.players[idx];
  var nOpp = 0;
  for (var i = 0; i < G.n; i++) {
    var q = G.players[i];
    if (i !== idx && !q.out && !q.folded) nOpp++;
  }
  nOpp = Math.max(1, nOpp);
  if (G.community.length === 0) return preflopScore(p.hole[0], p.hole[1]);
  return equity(p.hole[0], p.hole[1], G.community, nOpp, 150);
}

function aiBetSize(p, per) {
  var f = (per.key === 'loose')
    ? [0.40, 0.50][Math.floor(Math.random() * 2)]
    : [0.50, 0.66, 1.00][Math.floor(Math.random() * 3)];
  var toCall = Math.max(0, G.currentBet - p.bet);
  var target = Math.round(((G.pot + toCall) * f) / 10) * 10;
  var minTo = G.currentBet + G.minRaise;
  var maxTo = p.bet + p.chips;
  return Math.min(maxTo, Math.max(minTo, target + G.currentBet));
}

function aiDecide(idx) {
  var p = G.players[idx];
  var per = PERSONAS[p.persona] || PERSONAS.tag;
  var toCall = Math.max(0, G.currentBet - p.bet);
  var eq = aiEquityOf(idx);
  var sk = (typeof p.skill === 'number') ? Math.max(0.5, Math.min(1, p.skill)) : 0.75;
  var r = Math.random();

  /* ★ 2026-09-29 牌技接入（关键纪律：**只影响决策质量，绝不读牌堆**）
     1) 胜率估计误差：低技能高估/低估自己的牌力，高技能几乎无偏
        err 幅度 = (1 − skill) × 0.35，方向随机 —— 不是"变傻"，是"看不准"
     2) 阈值纪律：低技能容易被情绪带偏（阈值抖动大）
     3) 赔率纪律：高技能要求更严格的赔率才跟注（poK 从 1.20 收紧至 0.92）
     4) 诈唬选择：高技能的诈唬更克制也更精准
     发牌函数（shuffle/deal）不读 skill，牌堆不含任何 AI 偏向 —— 有断言守护。*/
  var err = (1 - sk) * 0.35 * (Math.random() * 2 - 1);
  eq = Math.max(0.02, Math.min(0.98, eq + err));
  var noise = (1 - sk) * 0.12 * (Math.random() * 2 - 1);
  var thr = per.thr + noise;
  var poK = 1.20 - 0.28 * sk;                       /* 1.20 → 0.92（越强越苛刻） */
  var bl = per.bluff * (0.6 + 0.8 * sk);            /* 高技能诈唬更克制 */
  var potOdds = toCall > 0 ? toCall / (G.pot + toCall) : 0;
  var canRaise = (p.bet + p.chips) > G.currentBet;

  if (toCall === 0) {
    if (canRaise && (eq > thr + 0.14 || r < bl * 0.5)) return { act: 'raise', amount: aiBetSize(p, per) };
    return { act: 'check' };
  }
  if (canRaise && eq >= thr + 0.18 && r > 0.35) return { act: 'raise', amount: aiBetSize(p, per) };
  if (eq >= thr || eq > potOdds * poK) {
    if (toCall >= p.chips && eq < thr + 0.10) return { act: 'fold' };
    return { act: 'call' };
  }
  if (canRaise && r < bl) return { act: 'raise', amount: aiBetSize(p, per) };
  return { act: 'fold' };
}

function scheduleAI() {
  if (!G || G.over || G.sessionOver) return;
  if (G.toAct < 0) return;
  var p = G.players[G.toAct];
  if (!p || p.isHuman) { render(); return; }
  if (p.folded || p.allin || p.out) return;
  later(function () {
    if (!G || G.over || G.sessionOver) return;
    var q = G.players[G.toAct];
    if (!q || q.isHuman || q.folded || q.allin || q.out) return;
    var d = aiDecide(G.toAct);
    applyAction(G.toAct, d.act, d.amount);
  }, rndMs(900, 1700));   /* ★ 2026-09-29：520~1150 太快，玩家看不清 AI 在干什么 */
}

/* AI 行动气泡（2026-09-29 新增；2026-10-03 重做坐标口径）：
   在对应座位上方弹出「跟注 40 / 加注到 120 / 弃牌」等，1.4s 自动消散。
   挂在**座位层**（.csh-seats）上 —— 座位每次 render 都重建，气泡放进座位会被打断；
   定时器走 later() 统一托管，关闭页面不残留。
   【为什么重做】旧实现读座位的 left/top 百分比再拿 felt.clientHeight 换算：
   座位层与毡是**两个不同的盒子**（毡在主战区里还留了 inset 边距），
   两边基准不同 ⇒ 气泡悬在别的座位上方。现在直接读座位在座位层内的
   offsetLeft/offsetTop（像素，同一坐标系），不再做任何百分比换算。 */
function announceAction(idx, text) {
  if (!G || !text) return;
  var p = G.players[idx];
  if (!p || p.isHuman) return;
  var seats = $('#seats');
  if (!seats) return;
  var el = seats.querySelectorAll('.seat')[idx - 1];   /* 座位层里只有 AI，顺序即 id-1 */
  if (!el) return;
  var halfH = (el.firstChild && el.firstChild.offsetHeight) ? Math.ceil(el.firstChild.offsetHeight / 2) : 22;
  var b = document.createElement('div');
  b.className = 'say';
  b.textContent = p.surname + ' · ' + text;
  b.style.left = (el.offsetLeft) + 'px';
  /* .say 是 translate(-50%,-100%)，所以 top 要给「座位盒上沿」而不是座位中心 */
  b.style.top = Math.max(2, el.offsetTop - halfH - 3) + 'px';
  seats.appendChild(b);
  later(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 1400);
}

/* ============================================================
   本场结束 / 收工（§4.1.1 结算：带入 + 净赢×0.90，且受 §H 封顶）
   ============================================================ */
var DECAY_TEXAS = 0.90;    /* 盈利回收率（§4.1.1） */
var CAP_MULT = 25;         /* §H：单局净收益上限 = 带入 × 25%… 实际按 capOf 由钱包给出 */
function endSession(reason) {
  if (!G || G.sessionOver) return;
  G.sessionOver = true;
  var chips = Math.max(0, G.players[0].chips);
  var buyIn = G.buyIn || 0;
  var profit = chips - buyIn;
  /* 负收益：只带回剩余筹码；正收益：带入 + 净赢×0.90 */
  var payout = profit >= 0 ? buyIn + Math.floor(profit * DECAY_TEXAS) : chips;
  var netRaw = Math.max(0, payout - buyIn);
  var capped = false;

  G.players[0].chips = 0;

  function finish(realPayout, wasCapped, discarded) {
    /* ★ 2026-09-29：本次入场带入已消费（结算成功与否都一样）——
       再想上桌必须回大厅重新入场缴费，堵死「输光免费重买」漏洞。 */
    entryUsed = true;
    if (realPayout > 0) sfx.quota();
    /* ★ 2026-09-29 P0-B：横幅必须在**余额同步完成后**再渲染 ——
       此前 showSessionBanner 同步执行，读到的 career.bank.bank 还是结算前的旧镜像
       （用户实测：顶栏 1,500、横幅却写 500）。现在桥内先拉真值再画横幅。 */
    var paint = function () { showSessionBanner(reason, realPayout, wasCapped, buyIn, chips, discarded || 0); };
    if (Bridge.active) { syncBankFromWallet(function () { paint(); }); }
    else { career.bank.bank = Math.min(CAP, career.bank.bank + realPayout); saveBank(); renderHud(); paint(); }
  }

  if (Bridge.active) {
    /* ★ 2026-09-29：一次调用完成「玩家入账」+「AI 世界双向记账」——
       玩家赢走的钱按带入比例从各 AI 真实扣除，玩家输的钱按比例真实记入各 AI。
       两侧严格零和，世界不再只减不增（此前 settleWin 零调用导致长期枯竭）。 */
    Bridge.settleSession({
      key: 'texas', buyIn: buyIn, chips: chips,
      seats: (G && G.seats) || [],
      gamble: !!(G && G.gamble),
    }, function (ok, data) {
      /* ★ 2026-09-29 P0-A：壳应答此前没有 ok 字段 ⇒ data.ok 恒 undefined ⇒
         每次成功结算都被当失败（横幅谎报「实得 0」、toast 谎报「未入账」，
         而钱包其实已正确入账）。现在壳补发 ok:true，这里改为 data.ok !== false 双保险。 */
      if (ok && data && data.ok !== false) {
        finish(data.gained != null ? data.gained : data.payout, !!data.capped, data.discarded || 0);
      } else {
        /* ★ 失败路径不落账（§0-9）：此前超时也按满额 payout 弹"结算 +X"，
           属于幻觉结算（玩家看到 +8,200 但钱包没动）。现在如实告知。 */
        toast('结算未成功，本局未入账（可退出后重查余额）', 'bad');
        finish(0, false, 0);
      }
    });
  } else {
    var before = career.bank.bank;
    capped = before + payout > CAP;
    saveBank();
    finish(payout, capped);
  }
}

/* ============================================================
   渲染
   ============================================================ */
/* 【2026-09-30 修复 · 座位横向压公共牌】
   中央公共牌区（.center，top:40%）的纵向带约 34%~48.4%，而座位半高约 4% ——
   原先侧座位用的 y = 40% / 46% / 52% **全都落在牌区的纵向区间内**，
   座位横版化变宽后便横向压住最外侧的牌 38~65px（用户实机截图「挡住公共 5 张牌」）。
   现在把侧座位移出该带：上半部取 26%、下半部取 62%（安全区为 ≤30% 或 ≥52.4%）。
   注：.center 已设 z-index:8 高于座位，即使几何重叠牌面也不会被遮 ——
   改位表是为了让几何上也不重叠，属治本。 */
/* ============================================================
   座位位表（2026-10-03 重构）
   ------------------------------------------------------------
   坐标是 **主战区（.csh-seats，即 .csh-board 的座位层）** 的百分比，
   不是整个视口的百分比 —— 这是本次重构最关键的一处：
   旧布局把座位和中心区都放在同一块毡上，各自 top:% 凭经验调，
   毡一矮（手机横屏）就必然会「中心区和自己的座位卡撞在一起」，
   于是只能靠事后钳制 + z-index 打补丁（文档里反复记录的那类事故）。
   现在座位层与中心安全区各占主战区的不同区域：
     · 中心安全区 = 主战区居中盒子（公共牌/底池/街道标签）
     · 座位只贴左右边缘与上缘 —— 与中心盒子的横向距离恒大于各自半宽
   所以**几何上不会重叠**，不再需要 AI_POS_C 紧凑位表，也不再需要
   「按列下推」的 JS 钳制（规范 §20 明确禁止 JS 读尺寸后手工改坐标）。 */
var AI_POS = {
  1: [[50, 14]],
  2: [[22, 16], [78, 16]],
  3: [[50, 11], [11, 66], [89, 66]],
  4: [[26, 9], [74, 9], [10, 62], [90, 62]],
  5: [[50, 8], [20, 14], [80, 14], [8, 60], [92, 60]],
};

function render() {
  if (!G) return;
  renderHud();
  renderFelt();
  renderMyArea();
  renderActions();
  syncToastAnchor();
}

/* 把玩家区的实时高度写进 --myarea-h（toast 在矮屏走底部锚定，需要让位高度）。
   玩家区随牌型/状态文字变化，render() 是唯一状态出口，在这里同步不会漏。 */
function syncToastAnchor() {
  try {
    var el = document.querySelector('.csh-player');
    if (!el) return;
    var apply = function () {
      var h = el.getBoundingClientRect().height;
      if (h > 0) document.documentElement.style.setProperty('--myarea-h', Math.round(h) + 'px');
    };
    if (window.requestAnimationFrame) window.requestAnimationFrame(apply); else apply();
  } catch (e) {}
}

/* 状态刷新（2026-10-03 · 顶部清零后）：只写"还在页面上"的两项 ——
     ① 盲注 → 玩家区左翼（#tb-blind）
     ② 街道 → 台面中央角标（#street-tag，含 × 加倍信息）
   原 topbar 的 tb-street / tb-chips 节点已随该行删除：
     街道的替身是台面角标；筹码的替身是右侧「你 · 筹码 X」（此前就是重复两处）。 */
function renderHud() {
  if (!G) return;
  $('#street-tag').textContent = streetName(G.street) + (G.level > 0 ? ' ×' + Math.pow(2, G.level) : '');
  $('#tb-blind').textContent = G.sb + '/' + G.bb;
}

function renderFelt() {
  var felt = $('#felt');
  var seats = $('#seats');
  var olds = seats.querySelectorAll('.seat');
  for (var i = 0; i < olds.length; i++) seats.removeChild(olds[i]);
  /* 摊牌态：给毡加 reveal-all，覆盖矮屏媒体查询里「隐藏座位手牌」的规则
     （那条规则让手机用户在摊牌时也看不到任何人的牌 —— 见 CSS 注释）。 */
  if (G.revealAll) felt.classList.add('reveal-all'); else felt.classList.remove('reveal-all');

  var pos = AI_POS[G.aiCount] || AI_POS[3];
  for (i = 0; i < G.players.length; i++) {
    var p = G.players[i];
    if (p.isHuman) continue;          /* 自己的信息在玩家区，不再占用牌桌（规范 §8.1） */
    seats.appendChild(buildSeat(p, pos[i - 1] || [50, 14]));
  }

  /* §4.7.2 ③ 底池数值 300ms 滚动（不再是瞬变）；取不到共用层就退回瞬时赋值 */
  if (CRD) CRD.rollNum($('#pot-v'), G.pot, 300, fmt);
  else $('#pot-v').textContent = fmt(G.pot);
  $('#pot').className = 'pot' + (G.pot > 0 ? ' hot' : '');
  $('#street-tag').textContent = streetName(G.street) + (G.level > 0 ? ' ×' + Math.pow(2, G.level) : '');

  var board = $('#board');
  board.innerHTML = '';
  for (i = 0; i < 5; i++) {
    if (i < G.community.length) board.appendChild(cardEl(G.community[i], 'flip'));
    else {
      var s = document.createElement('div');
      s.className = 'slot';
      board.appendChild(s);
    }
  }
}

function buildSeat(p, xy) {
  var el = document.createElement('div');
  el.className = 'seat';
  el.style.left = xy[0] + '%';
  el.style.top = xy[1] + '%';
  if (p.folded && !p.out) el.className += ' folded';
  if (p.allin) el.className += ' allin';
  if (p.out) el.className += ' out';
  if (G.winners.indexOf(p) >= 0) el.className += ' winner';
  if (G.toAct === p.id && !G.over) el.className += ' acting';
  if (G.dealer === p.id) el.className += ' dealer';

  var box = document.createElement('div');
  box.className = 'seat-box';

  var av = document.createElement('div');
  av.className = 'seat-av';
  /* §4.7.2 ⑤ AI 头像：程序化 SVG（§I.4），姓氏决定色、性格决定纹样 —— 同一角色恒定同图
     【2026-10-01】第 4 参 seed（world.seat() 透传，stableHash 同款）：97 人下同姓 6 人，
     不带 seed 时同姓 + 同性格头像完全一样（撞脸），带上后 seed%72 同姓组内零碰撞。 */
  if (CRD) { try { av.innerHTML = CRD.avatar(p.surname, p.persona, 34, p.seed); } catch (e) { av.textContent = p.surname; } }
  else av.textContent = p.surname;
  box.appendChild(av);

  /* 【2026-09-30 横版改造】把「名字 + 标签」并成第一行、「筹码 + 下注」并成第二行，
     再与头像、手牌组成**三列横排**。
     原因：原竖版座位卡是 6 行（头像/名字/标签/筹码/下注/牌背），实测高约 139px，
     上方中部座位的底边正好压在中央公共 5 张牌上（用户实机截图）。
     横版后高度降到约 42px，腾出近 100px 的牌桌空间。 */
  var info = document.createElement('div');
  info.className = 'seat-info';

  var line1 = document.createElement('div');
  line1.className = 'seat-line';
  var nm = document.createElement('div');
  nm.className = 'seat-name';
  nm.textContent = p.isHuman ? '你' : p.name;
  line1.appendChild(nm);
  if (p.tag) {
    var tg = document.createElement('span');
    tg.className = 'seat-tag';
    tg.textContent = p.tag;
    line1.appendChild(tg);
  }
  info.appendChild(line1);

  var line2 = document.createElement('div');
  line2.className = 'seat-line';
  var ch = document.createElement('div');
  ch.className = 'seat-chips num';
  ch.textContent = fmt(p.chips);
  line2.appendChild(ch);
  var st = document.createElement('div');
  st.className = 'seat-bet num';
  if (p.out) st.textContent = '已出局';
  else if (p.bet > 0) st.textContent = '下注 ' + fmt(p.bet);
  else if (p.folded) st.textContent = '已弃牌';
  else if (p.allin) st.textContent = '全下';
  else st.textContent = '—';
  line2.appendChild(st);
  info.appendChild(line2);

  box.appendChild(info);

  /* 【2026-10-03 摊牌可读性】摊牌时把 AI 手牌从 xs 放大到 sm，并在牌下贴牌型角标 ——
     "谁是什么牌"必须一眼可读，否则结算看起来就是凭空弹出来的。
     平时仍用 xs（省宽度、防压公共牌），只有 revealAll 这一帧才放大。 */
  if (!p.isHuman && p.hole.length === 2) {
    var cr = document.createElement('div');
    cr.className = 'seat-cards';
    var show = G.revealAll || p.reveal;
    var sz = (G.revealAll && !p.folded && !p.out) ? 'sm' : 'xs';
    for (var k = 0; k < 2; k++) {
      cr.appendChild(show ? cardEl(p.hole[k], sz + ' flip') : cardBackEl(sz));
    }
    box.appendChild(cr);
    if (G.revealAll && !p.folded && !p.out) {
      var hn = handNameOf(p);
      if (hn) {
        var hb = document.createElement('div');
        hb.className = 'seat-hand';
        hb.textContent = hn;
        box.appendChild(hb);
      }
    }
  }

  el.appendChild(box);
  return el;
}

/* 玩家区（规范 §8.2）：我的手牌 + 两行状态。
   line1 = 你 · 筹码 · 本街下注 · 当前状态（弃牌/全下/出局）+ 庄家位
   line2 = 牌型 · 胜率
   旧的纵向 4 行（筹码/本街下注/牌型/胜率）+ 独立胜率条已被压缩掉：
   那块信息占掉近一半屏高，正是"游戏主内容被各种栏挤压"的主因之一。 */
function renderMyArea() {
  var me = G.players[0];
  var hand = $('#my-hand');
  hand.innerHTML = '';
  for (var i = 0; i < me.hole.length; i++) hand.appendChild(cardEl(me.hole[i], 'deal'));

  var state = '';
  if (me.out) state = '已出局';
  else if (me.folded) state = '已弃牌';
  else if (me.allin) state = '全下';
  var l1 = '<b>你</b>' + (G.dealer === 0 ? ' <i class="dealer-dot">D</i>' : '') +
    '<em>·</em><em>筹码</em><b>' + fmt(me.chips) + '</b>' +
    (me.bet > 0 ? '<em>·</em><em>本街</em><b>' + fmt(me.bet) + '</b>' : '') +
    (state ? '<em>·</em><em class="st">' + state + '</em>' : '');
  $('#my-line1').innerHTML = l1;

  var hn = '—';
  if (me.hole.length === 2) {
    if (G.community.length >= 3) hn = heNameOf(heBest7(me.hole.concat(G.community)));
    else hn = '起手 ' + RANK_LABEL[cardRank(me.hole[0])] + RANK_LABEL[cardRank(me.hole[1])];
  }
  $('#my-handname').textContent = hn;

  var eqTxt = $('#my-eq-txt');
  var showEq = career.set.winrateOn && !G.over && !G.sessionOver && me.hole.length === 2 && !me.folded && !me.out;
  if (!showEq) {
    eqTxt.innerHTML = career.set.winrateOn ? '' : '<em>胜率</em><em>已关</em>';
    $('#eq-fill').style.width = '0%';
    return;
  }
  var nOpp = 0;
  for (var j = 0; j < G.n; j++) { var q = G.players[j]; if (j !== 0 && !q.out && !q.folded) nOpp++; }
  var eq = 0;
  if (G.community.length === 0) { eq = preflopScore(me.hole[0], me.hole[1]); lastEquity = eq; }
  else if (nOpp > 0) {
    if (eqDirty) { eq = equity(me.hole[0], me.hole[1], G.community, nOpp, 200); lastEquity = eq; eqDirty = false; }
    else eq = lastEquity;
  }
  var pct = Math.round(eq * 100);
  eqTxt.innerHTML = '<em>·</em><em>胜率</em><b>' + pct + '%</b>';
  $('#eq-fill').style.width = pct + '%';
  $('#eq-bar').className = 'eq-bar' + (eq < 0.40 ? ' low' : '');
}

function mkBtn(text, cls, fn) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.textContent = text;
  b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); fn(); }, false);
  return b;
}

function clampRaise(to, me) {
  var minTo = Math.min(me.bet + me.chips, G.currentBet + G.minRaise);
  var maxTo = me.bet + me.chips;
  /* 取整单位跟着盲注走（raiseStep）：普通桌 bb=20 ⇒ 10（与原观感一致）；
     豪赌桌 bb=4,000 ⇒ 1,000，加注额才会落在真实的注码刻度上。 */
  var u = raiseStep();
  return Math.min(maxTo, Math.max(minTo, Math.round(to / u) * u));
}
/* 标准「加注到」：底池基数含本街全部下注，故为 pot + 跟注额（跟注 0 时即纯底池） */
function raiseTo(f, p) {
  var toCall = Math.max(0, G.currentBet - p.bet);
  return clampRaise(G.currentBet + Math.round((G.pot + toCall) * f), p);
}

function renderActions() {
  var box = $('#actions');
  box.innerHTML = '';
  $('#raise-panel').classList.add('hidden');

  var me = G.players[0];
  var myTurn = !G.over && !G.sessionOver && G.toAct === 0 && !me.folded && !me.allin && !me.out;
  if (!myTurn) {
    var lab = document.createElement('div');
    lab.className = 'tb-item';
    var txt = '';
    if (G.sessionOver) txt = '本场已结束';
    else if (G.over) txt = '';
    else if (me.out) txt = '你已出局';
    else if (me.folded) txt = '你已弃牌 · 观战中';
    else if (me.allin) txt = '你已全下 · 等待发牌';
    else txt = '等待对手行动…';
    if (txt) { lab.innerHTML = '<span class="tb-k">' + txt + '</span>'; box.appendChild(lab); }
    return;
  }

  var toCall = Math.max(0, G.currentBet - me.bet);
  var maxTo = me.bet + me.chips;

  /* 规范 §21：Dock 只放**当前合法**的操作，按钮顺序固定为
     [辅助] [次要] [主要] [危险/结束]；不再把不合法按钮留在屏幕上占位置。
       · 无下注要跟   → 过牌（主）+ 加注 + 弃牌
       · 有下注要跟   → 跟注（主）+ 加注 + 弃牌
       · 筹码不足跟进 → 只给「跟注 全下」
     加注档位用「½ 池 / ⅔ 池 / 全下 / 微调」，两颗档位算出同一个数时只留一颗。 */
  var raiseBtns = [];
  if (maxTo > G.currentBet) {
    var halfTo = raiseTo(0.5, me);
    var twoTo = raiseTo(0.66, me);
    if (halfTo === twoTo) raiseBtns.push(mkBtn('加注到 ' + fmt(halfTo), 'btn ghost', function () { applyAction(0, 'raise', halfTo); }));
    else {
      raiseBtns.push(mkBtn('½ 池', 'btn ghost', function () { applyAction(0, 'raise', halfTo); }));
      raiseBtns.push(mkBtn('⅔ 池', 'btn ghost', function () { applyAction(0, 'raise', twoTo); }));
    }
    if (maxTo >= G.currentBet + G.minRaise) {
      raiseBtns.push(mkBtn('全下 ' + fmt(me.chips), 'btn ghost', function () { applyAction(0, 'allin'); }));
    }
    if (maxTo > G.currentBet + G.minRaise) {
      raiseBtns.push(mkBtn('微调', 'btn ghost small', function () { openRaisePanel(); }));
    }
  }

  var main;
  if (toCall === 0) main = mkBtn('过牌', 'btn', function () { applyAction(0, 'check'); });
  else if (toCall >= me.chips) main = mkBtn('跟注 全下 ' + fmt(me.chips), 'btn', function () { applyAction(0, 'call'); });
  else main = mkBtn('跟注 ' + fmt(toCall), 'btn', function () { applyAction(0, 'call'); });

  /* 顺序：辅助（加注）→ 主要（过牌/跟注）→ 危险（弃牌），主要操作居中偏左、最显眼 */
  for (var ri = 0; ri < raiseBtns.length; ri++) box.appendChild(raiseBtns[ri]);
  box.appendChild(main);
  box.appendChild(mkBtn('弃牌', 'btn danger', function () { applyAction(0, 'fold'); }));
}

/* 加注滑块的步进：跟盲注走，而不是写死 10
   写死 10 的后果：豪赌桌带入 200,000（bb=4,000）时，滑块行程 0~200,000 却按 10 递增，
   拖一下就是跳几百档 —— 所谓「微调」在高档位等于失灵。
   取 bb/4（普通桌 bb=20 ⇒ 5 ⇒ 下限仍为 10，观感与原来一致；豪赌桌 ⇒ 1,000/档，可用）。 */
function raiseStep() {
  return Math.max(10, Math.round((G.bb || 20) / 4));
}
/* 滑块默认落在 1/2 池（不落在 0）—— 符合"无空白输入"原则 */
function openRaisePanel() {
  var me = G.players[0];
  var maxTo = me.bet + me.chips;
  var minTo = Math.min(maxTo, G.currentBet + G.minRaise);
  var sl = $('#raise-slider');
  /* 按钮文案是「微调」，就不能在不可加注时悄悄改成全下（文案与动作必须一致）。
     renderActions 已在 maxTo ≤ 当前注时藏起这颗按钮，这里只是兜底：如实提示，不越权下注。 */
  if (maxTo <= minTo) { toast('筹码不足以加注（可跟注或全下）', 'bad'); return; }
  var def = raiseTo(0.5, me);
  sl.min = String(minTo);
  sl.max = String(maxTo);
  sl.step = String(raiseStep());
  sl.value = String(def);
  $('#raise-val').textContent = fmt(def);
  $('#raise-panel').classList.remove('hidden');
  sl.oninput = function () { $('#raise-val').textContent = fmt(Number(sl.value)); };
}

function streetName(s) {
  return s === 'pre' ? '翻牌前' : s === 'flop' ? '翻牌' : s === 'turn' ? '转牌' : s === 'river' ? '河牌' : '摊牌';
}
function actName(a) {
  return a === 'fold' ? '弃牌' : a === 'check' ? '过牌' : a === 'call' ? '跟注' : a === 'raise' ? '加注' : a === 'allin' ? '全下' : a;
}

/* ============================================================
   结算横幅 / 签到卡 / 开局页
   ============================================================ */
var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return document.querySelectorAll(s); };

function toast(msg, cls) {
  var box = $('#toasts');
  /* 【2026-09-30 修复】补同屏条数上限 —— 原实现无限追加，连续事件（下注/加注/结算提示）
     会让 toast 从顶部一路堆叠几百像素，把 HUD 与牌桌顶部整片盖住。
     斗地主早已这么修（那边注释写明「顶部起播会压住 #status-line」），德州当时漏了。
     【2026-10-02 续修】顶部锚定的 3 条在矮屏（手机横屏，高 ≤480px）向下生长
     约 120px，正好盖住公共牌与底池（牌桌中心）。矮屏收紧到 2 条，
     且容器改底部锚定（见 #toasts 的媒体查询），让出牌桌中心。 */
  var maxN = (window.innerHeight && window.innerHeight <= 480) ? 2 : 3;
  while (box.children.length >= maxN) box.removeChild(box.firstChild);
  var t = document.createElement('div');
  t.className = 'toast' + (cls ? ' ' + cls : '');
  t.textContent = String(msg == null ? '' : msg);
  box.appendChild(t);
  later(function () {
    t.classList.add('fade');
    later(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 420);
  }, 1900);
}

function hideBanner() { $('#banner').classList.add('hidden'); }

function showHandBanner() {
  if (!G) return;
  var me = G.players[0];
  var won = G.winners.indexOf(me) >= 0;
  if (!won) G.winStreak = 0;
  career.best.hands++;
  /* §4.1.5 统计：本场手数 / 连续未弃牌手数 */
  G.handCount = (G.handCount || 0) + 1;
  if (me.folded) G.noFoldStreak = 0; else G.noFoldStreak = (G.noFoldStreak || 0) + 1;
  checkSessionAch();
  saveBest();
  /* §4.1.4 每日任务：手数进度 +1；若本手赢下则计胜场与大池 */
  Task.ensureDay(todayStr());
  var taskDone = Task.add('hands', 1);
  if (won) {
    taskDone = taskDone.concat(Task.add('wins', 1));
    var myPot = 0;
    if (G.lastResults && G.lastResults.length) {
      for (var ti = 0; ti < G.lastResults.length; ti++) {
        var tr = G.lastResults[ti];
        for (var tj = 0; tj < tr.winners.length; tj++) if (tr.winners[tj].isHuman) myPot += tr.amount;
      }
    }
    if (myPot > 0) taskDone = taskDone.concat(Task.add('bigPot', myPot));
  }
  for (var td = 0; td < taskDone.length; td++) {
    sfx.badge();
    toast('任务完成 · ' + taskDone[td].label + ' +' + fmt(taskDone[td].reward), 'good');
  }

  var t = $('#banner-title'), netEl = $('#banner-net'), s = $('#banner-sub');
  var row = $('#banner-row'), det = $('#banner-detail');
  var boxPlayers = $('#banner-players'), boxSd = $('#banner-sd');
  var boxPots = $('#banner-pots'), boxLed = $('#banner-ledger');
  var led = G.ledger;
  var meLed = null, i, j;
  if (led) { for (i = 0; i < led.ledger.length; i++) if (led.ledger[i].id === 0) meLed = led.ledger[i]; }

  /* ---------- 头部：只有三样东西（方案 §14 标题规范） ----------
     ① 「本局结算」——禁止写「你赢下底池 / 你赢了 / 你输了」：
        一手牌可能赢主池、输边池、平分边池、或弃牌后失去资格，
        任何一句"结论"都会在某种情况下变成假话。
     ② 本手净变化 ±X —— 全屏唯一的大字结论，玩家第一眼要看到的就是它。
     ③ 你的筹码 / 第几手 —— 现状参照。
     另外把「守恒校验」的结果如实带出来：不通过时禁止进入下一手。 */
  t.className = 'rs-title';
  t.textContent = '本局结算';
  var net = meLed ? meLed.net : 0;
  netEl.className = 'rs-net ' + (net > 0 ? 'plus' : (net < 0 ? 'minus' : ''));
  netEl.textContent = '本手净变化 ' + (net > 0 ? '+' : '') + fmt(net);
  s.innerHTML = '你的筹码 <b>' + fmt(me.chips) + '</b> · 池 <b>' + fmt(me.contrib) + '</b>' +
    ' · 带入 <b>' + fmt(G.buyIn) + '</b> · 第 <b>' + G.handNo + '</b> 手';

  /* ---------- 玩家结果（方案 §12 第一层）：按本手净变化排序 ---------- */
  boxPlayers.innerHTML = '';
  if (led) {
    var lrows = led.ledger.slice().sort(function (a, b) { return b.net - a.net; });
    for (i = 0; i < lrows.length; i++) {
      var g = lrows[i];
      if (g.startStack == null) continue;                 /* 无筹码来源的玩家不参与本次账本展示 */
      var rEl = document.createElement('div');
      rEl.className = 'rs-row' + (g.id === 0 ? ' me' : '') + (g.net > 0 ? ' win' : '');
      rEl.innerHTML =
        '<div class="rs-name">' + (g.isHuman ? '你' : g.name) + '</div>' +
        '<div class="rs-hand">投入 ' + fmt(g.committed) + ' · 获得 ' + fmt(g.won) + ' · 剩余 ' + fmt(g.endStack) + '</div>' +
        '<div class="rs-gain' + (g.net === 0 ? ' zero' : '') + '">' + (g.net > 0 ? '+' : '') + fmt(g.net) + '</div>';
      boxPlayers.appendChild(rEl);
    }
  }

  /* ---------- 摊牌比牌（方案 §13）：谁有什么牌、什么牌型、分到多少 ----------
     按牌力从上到下；弃牌/未参与摊牌者不在表内（他们不参与比牌）。
     没能参与某个底池的玩家在「底池明细」里用「无资格争夺」表述，
     而不是写成"输了" —— 那是两回事（方案 §13）。 */
  boxSd.innerHTML = '';
  if (G.tally && G.tally.length) {
    for (i = 0; i < G.tally.length; i++) {
      var tw = G.tally[i];
      var sdEl = document.createElement('div');
      sdEl.className = 'rs-row' + (tw.me ? ' me' : '') + (tw.gain > 0 ? ' win' : '');
      var cards = document.createElement('div');
      cards.className = 'rs-cards';
      for (j = 0; j < tw.cards.length; j++) cards.appendChild(cardEl(tw.cards[j], 'sm'));
      sdEl.innerHTML = '<div class="rs-name">' + tw.name + '</div>';
      sdEl.appendChild(cards);
      var nm = document.createElement('div');
      nm.className = 'rs-hand';
      nm.textContent = tw.hand || '—';
      sdEl.appendChild(nm);
      var gn = document.createElement('div');
      gn.className = 'rs-gain' + (tw.gain > 0 ? '' : ' zero');
      gn.textContent = tw.gain > 0 ? '+' + fmt(tw.gain) : '本手未获';
      sdEl.appendChild(gn);
      boxSd.appendChild(sdEl);
    }
    $('#banner-sd').parentNode.style.display = '';
  } else {
    $('#banner-sd').parentNode.style.display = 'none';     /* 无人摊牌（全靠弃牌收池）：整段收起 */
  }

  /* ---------- 底池明细（方案 §12 第二层）：每个池独立交代金额 / 赢家 / 争夺者 ----------
     旧界面把各分池逐行印成「郭淮 赢 200 / 郭淮 赢 1320 / 郭淮 赢 1440 / 你 赢 1950」，
     玩家只会得到一个问题："我不是赢了吗？为什么别人还能分钱？"
     现在每个池都写明它是主池还是第几层边池、谁有资格争、谁赢了。 */
  boxPots.innerHTML = '';
  if (led && led.pots.length) {
    for (i = 0; i < led.pots.length; i++) {
      var pt = led.pots[i];
      var CIRC = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨'];
      var label = pt.id === 'main' ? '主池'
        : (pt.id.indexOf('side') === 0 ? ('边池' + (CIRC[Number(pt.id.slice(4)) - 1] || pt.id.slice(4))) : '退回层');
      var wnames = pt.winners.map(function (id) { return id === 0 ? '你' : G.players[id].name; }).join('、');
      var enames = pt.eligible.map(function (id) { return id === 0 ? '你' : G.players[id].name; }).join(' / ');
      var wpays = pt.winners.map(function (id) {
        return (id === 0 ? '你' : G.players[id].name) + ' +' + fmt(pt.payouts[id] || 0);
      }).join('、');
      var pr = document.createElement('div');
      pr.className = 'rs-row' + (pt.winners.indexOf(0) >= 0 ? ' win' : '');
      /* 一行说清这个池：池名 | 赢家与到账 | 池总额。
         （旧界面把各层印成"郭淮 赢 200 / 郭淮 赢 1320 …"，
          读者只会得到"我不是赢了吗，为什么别人还能分钱"这个错误印象。） */
      pr.innerHTML = '<div class="rs-name">' + label + '</div>' +
        '<div class="rs-hand">' + wpays + (pt.refund ? '（无人可争，原路退回）' : (pt.byFold ? '（其余全部弃牌）' : '')) + '</div>' +
        '<div class="rs-gain">' + fmt(pt.amount) + '</div>';
      boxPots.appendChild(pr);
      var sub = document.createElement('div');
      sub.className = 'sd-caption';
      sub.textContent = '可争夺：' + enames + (pt.eligible.length !== G.n ? ' · 其余玩家无资格争夺该池' : '');
      boxPots.appendChild(sub);
    }
  }

  /* ---------- 你的账本（方案 §10）：把"底池获得"和"本手净变化"分开摆 ----------
     这是本次修的核心认知问题：玩家可以赢一个边池、整手却仍然亏损。
     只写「你赢 1950」会让人以为赚了；三个数字并排才说得清。 */
  boxLed.innerHTML = '';
  if (meLed) {
    boxLed.innerHTML =
      '<div class="rs-row"><div class="rs-name">本手投入</div><div class="rs-hand">牌局中投入的全部筹码</div><div class="rs-gain">-' + fmt(meLed.committed) + '</div></div>' +
      '<div class="rs-row"><div class="rs-name">底池获得</div><div class="rs-hand">从各底池分到手的合计</div><div class="rs-gain">+' + fmt(meLed.won) + '</div></div>' +
      '<div class="rs-row' + (meLed.net > 0 ? ' win' : '') + '"><div class="rs-name">本手净变化</div><div class="rs-hand">获得 − 投入</div><div class="rs-gain' + (meLed.net === 0 ? ' zero' : '') + '">' + (meLed.net > 0 ? '+' : '') + fmt(meLed.net) + '</div></div>' +
      (meLed.endStack != null ? '<div class="rs-row"><div class="rs-name">结算后筹码</div><div class="rs-hand">本手开始 ' + fmt(meLed.startStack) + '</div><div class="rs-gain">' + fmt(meLed.endStack) + '</div></div>' : '');
  }
  if (won) sfx.win(); else sfx.lose();

  /* 关键手复盘：最多展示 4 个决策点；矮屏（手机横屏）只留 1~2 条，且省掉独立标题行
     （标题并进第一条的抬头），把横幅压在首屏内 —— 摊牌对比表才是主信息，复盘是次要参考。 */
  det.innerHTML = '';
  var ih = window.innerHeight || 800;
  var revMax = ih <= 480 ? 1 : (ih <= 560 ? 2 : 4);
  var revHead = ih > 560;
  if (G.review.length) {
    det.classList.remove('hidden');
    if (revHead) {
      var head = document.createElement('div');
      head.className = 'rev-item';
      head.innerHTML = '<div class="rt">关键手复盘</div>';
      det.appendChild(head);
    }
    for (i = 0; i < G.review.length && i < revMax; i++) {
      var rv = G.review[i];
      var it = document.createElement('div');
      it.className = 'rev-item';
      it.innerHTML = '<div class="rt">' + (revHead || i > 0 ? '' : '关键手复盘 · ') + streetName(rv.street) + ' · 胜率 ' + Math.round(rv.eq * 100) + '% · 池 ' + fmt(rv.pot) + '</div>' +
        '<div class="rb">你选了 <em>' + actName(rv.actual) + '</em>，建议 <i>' + actName(rv.best) + '</i>' +
        (rv.gap > 0 ? '（期望差 ≈ ' + fmt(rv.gap) + '）' : '（与最优一致）') + '</div>';
      det.appendChild(it);
    }
  } else {
    det.classList.add('hidden');
  }

  row.innerHTML = '';
  /* §8 守恒校验失败 = 有筹码被凭空造出或吞掉：不再提供「下一手」，
     只允许收工离开，并在日志里保留现场（logLedger 已打出完整账本）。
     宁可让玩家遇到一次"不能继续"，也不能让错账顺着继续滚下去。 */
  if (G.conservationFailed) {
    var warn = document.createElement('div');
    warn.className = 'rs-sub';
    warn.style.color = 'var(--danger)';
    warn.textContent = '本手结算校验未通过，已暂停继续开局（请把日志反馈给作者）';
    row.appendChild(warn);
  } else if (me.chips > 0) {
    row.appendChild(mkBtn('下一手', 'btn', function () { hideBanner(); startHand(); }));
  } else {
    row.appendChild(mkBtn('本场结算', 'btn', function () { hideBanner(); endSession('bust'); }));
  }
  row.appendChild(mkBtn('收工', 'btn ghost', function () { hideBanner(); endSession('quit'); }));
  $('#banner').classList.remove('hidden');
}

function showSessionBanner(reason, left, capped, buyIn, chips, discarded) {
  var t = $('#banner-title'), s = $('#banner-sub'), row = $('#banner-row'), det = $('#banner-detail');
  det.classList.add('hidden'); det.innerHTML = '';
  /* 本场结算复用同一层骨架：把只有手结算才有的几段清掉，避免残留上一手的账本 */
  var netEl = $('#banner-net');
  if (netEl) { netEl.className = 'rs-net'; netEl.textContent = ''; }
  ['#banner-players', '#banner-sd', '#banner-pots', '#banner-ledger'].forEach(function (sel) {
    var el = $(sel);
    if (el) el.innerHTML = '';
  });
  t.className = 'rs-title';
  t.textContent = reason === 'bust' ? '本场结束 · 筹码输光'    : (reason === 'sweep' ? '本场结束 · 通吃全场'
    : (reason === 'quit' ? '收工结算' : '本场结束'));
  /* §4.1.2 结算明细：带入 / 结束筹码 / 净赢 / 回收 / 实得 */
  var bi = Math.max(0, Math.floor(buyIn || 0));
  var ch = Math.max(0, Math.floor(chips || 0));
  var net = ch - bi;
  var detail = '';
  if (bi > 0) {
    detail = '带入 <b>' + fmt(bi) + '</b> · 结束 <b>' + fmt(ch) + '</b><br>' +
      (net >= 0
        ? '净赢 <b class="win">+' + fmt(net) + '</b> × 回收 ' + Math.round(DECAY_TEXAS * 100) + '% → 实得 <b>' + fmt(left) + '</b>'
        : '净亏 <b class="lose">' + fmt(net) + '</b> → 带回 <b>' + fmt(left) + '</b>');
  }
  s.innerHTML = (detail ? detail + '<br>' : '') +
    '池子币余额 <b>' + fmt(career.bank.bank) + '</b>' +
    (capped ? '<br>已达自然封顶（只可赢走同桌真有的钱），超出 <b class="lose">' +
      fmt(Math.max(0, Math.floor(discarded || 0))) + '</b> 未入账' : '') +
    (career.bank.bank < MIN_BUYIN ? '<br>余额低于最低带入 ' + fmt(MIN_BUYIN) + '，暂无法上桌（可去其他游戏回血或领救济）' : '');
  row.innerHTML = '';
  /* ★ 2026-09-29：shell 内一场入场只对应一场对局（entryUsed 已在结算时置位），
     「再来一场」不再无费重开 —— 回大厅重新选带入入场，堵死免费重买漏洞。 */
  if (!Bridge.active && career.bank.bank >= MIN_BUYIN) {
    row.appendChild(mkBtn('再来一场', 'btn', function () { hideBanner(); showStart(); }));
  }
  row.appendChild(mkBtn('回池子休闲', 'btn ghost', function () { closePage(); }));
  $('#banner').classList.remove('hidden');
}

/* ---------- 签到卡 ---------- */
function showSignCard() {
  var streak = Math.max(1, career.bank.streak);
  var pos = ((streak - 1) % 7) + 1;
  var grant = pos === 7 ? 3000 : (pos === 3 ? 1000 : 0);

  $('#sign-title').textContent = '每日签到 · 连签 ' + streak + ' 天';
  var dots = $('#sign-dots');
  dots.innerHTML = '';
  for (var i = 1; i <= 7; i++) {
    var d = document.createElement('div');
    d.className = 'sdot' + (i < pos ? ' done' : i === pos ? ' today' : '') + (i === 7 || i === 3 ? ' gift' : '');
    d.textContent = i === 7 ? '+3k' : (i === 3 ? '+1k' : String(i));
    dots.appendChild(d);
  }
  $('#sign-line').innerHTML = '连签 <b>' + streak + '</b> 天 · 今日可领补给<br>池子币余额 <b>' + fmt(career.bank.bank) + '</b>';
  $('#sign-gain').textContent = grant > 0 ? ('连签奖励 +' + fmt(grant)) : '第 7 天可领 +3,000';
  $('#sign-mask').classList.remove('hidden');
}
function doSign() {
  /* §4.1.1：shell 内签到统一由 csh_wallet 处理（含断签只降一半、官阶加成） */
  if (Bridge.active) {
    Bridge.signIn(todayStr(), function (ok, data) {
      $('#sign-mask').classList.add('hidden');
      if (ok && data) {
        /* ★ 镜像卫生：签到日写回本地，离线口径与钱包一致 */
        career.bank.lastSignDay = todayStr();
        saveBank();
        syncBankFromWallet(function () {
          if (data.gained > 0 || data.bonus > 0) {
            sfx.sign();
            toast('连签 ' + data.streak + ' 天 · 补给 +' + fmt((data.gained || 0) + (data.bonus || 0)), 'good');
          } else {
            toast('今日已签到', 'bad');
          }
          renderStart();
        });
      } else {
        toast('今日已签到', 'bad');
        renderStart();
      }
    });
    return;
  }
  var r = Sign.claim(todayStr());
  $('#sign-mask').classList.add('hidden');
  if (r && r.grant > 0) { sfx.sign(); toast('连签 ' + r.streak + ' 天 · 奖励 +' + fmt(r.grant), 'good'); }
  renderStart();
  if (r && r.capped) { sfx.cap(); toast('已达本金上限 ' + fmtBig(CAP), 'bad'); }
}

/* ---------- 开局页 ---------- */
/* §4.1.4 每日任务卡渲染（2026-09-29：直接消费钱包真值 defs，不再本地推算） */
function renderTasks() {
  var box = $('#tasks');
  if (!box) return;
  box.innerHTML = '';
  var defs = Task.defs(), i;
  for (i = 0; i < defs.length; i++) {
    var d = defs[i];
    var cur = (typeof d.cur === 'number') ? d.cur : Task.progressOf(d.key);
    var goal = d.goal || 1;
    var pct = Math.max(0, Math.min(100, Math.round(cur / goal * 100)));
    var done = (typeof d.done === 'boolean') ? d.done : (cur >= goal);
    var claimed = !!d.claimed;

    var card = document.createElement('div');
    card.className = 'task' + (done ? ' done' : '');
    var main = document.createElement('div'); main.className = 'tk-main';
    var lab = document.createElement('span'); lab.className = 'tk-lab';
    lab.textContent = d.label;
    var bar = document.createElement('span'); bar.className = 'tk-bar';
    var fill = document.createElement('i'); fill.style.width = pct + '%';
    bar.appendChild(fill);
    var num = document.createElement('span'); num.className = 'tk-num';
    num.textContent = fmt(Math.min(cur, goal)) + ' / ' + fmt(goal) + (claimed ? ' · 已完成' : '');
    main.appendChild(lab); main.appendChild(bar); main.appendChild(num);
    var rw = document.createElement('span'); rw.className = 'tk-rw';
    rw.textContent = '+' + fmt(d.reward) + ' CBY';
    card.appendChild(main); card.appendChild(rw);
    box.appendChild(card);
  }
}

function renderStart() {
  var bank = career.bank.bank;
  var GAMBLE_AT = Bridge.gambleAt();   /* 豪赌桌门槛取自宿主钱包（离线时才用本地兜底） */
  $('#life-bank').textContent = fmt(bank);
  /* ★ 2026-09-29 第四轮修（真机反馈「这个余额进度条是不是不太对」）：
     旧口径 min(100, bank / GAMBLE_AT × 100) —— GAMBLE_AT=200,000，
     余额 99 万时算出 498% ⇒ **恒钳 100%，满格后再无信息**，且标签在隔壁格
     （连签那格）写着「已解锁豪赌桌」，用户根本看不出这条满格金光代表什么。
     现改为**里程碑阶梯**：进度 = 距下一档的区间进度，跨档自动换段；
     阶梯与求值都由宿主钱包唯一实现（csh_wallet.BANK_STEPS / bankLadder），本页只渲染。
     离线（无宿主）时不硬造一套口径 —— 直接收起进度条，只显示余额（峰值已在生涯大厅展示）。 */
  /* ★ B 重排（2026-09-30）：面板不再显示「峰值」——峰值（pcPeak）已统一在生涯大厅
     资产区「生涯峰值」展示（career.html #ov-peak，数据来自钱包快照），此处只保留阶梯说明，
     避免与生涯大厅重复。说明文案紧跟在进度条下方（见 .life-quota）。 */
  var lad = Bridge.ladder();
  var bar = $('#life-quota-bar');
  if (lad && typeof lad.pct === 'number') {
    bar.style.width = lad.pct + '%';
    bar.parentNode.style.opacity = lad.maxed ? '.35' : '1';
    $('#life-quota').textContent = lad.maxed
      ? '已达本金上限 ' + fmtBig(lad.to)
      : '距 ' + fmtBig(lad.next) + ' 还差 ' + fmtBig(lad.remain);
  } else {
    bar.style.width = '0%';
    bar.parentNode.style.opacity = '0';
    $('#life-quota').textContent = bank >= GAMBLE_AT ? '已解锁豪赌桌' : '距豪赌桌 ' + fmt(GAMBLE_AT - bank);
  }
  $('#life-streak').textContent = '第 ' + Math.max(1, career.bank.streak) + ' 天';
  $('#life-record').textContent = fmt(career.best.hands) + ' 手 · ' + fmt(career.best.wins) + ' 胜';
  $('#life-best').textContent = '最大池 ' + fmt(career.best.biggestPot);

  /* §4.1.4 每日任务进度（真值来自宿主钱包，与生涯大厅同源） */
  Task.ensureDay();
  renderTasks();

  /* 带入档位（唯一来源 BUYIN_TIERS）：shell 内带入已在收费屏选定，
     此处只作展示与提示，不允许在本页改（改则与宿主扣款不一致）。 */
  var buySeg = $('#seg-buyin');
  buySeg.innerHTML = '';
  var tiers = Bridge.tiers();       /* 宿主真值优先，离线才用本地兜底 */
  var activeBuyIn = (Bridge.active && Bridge.buyIn() > 0) ? Bridge.buyIn() : (career.set.buyIn || DEFAULT_BUYIN);
  for (var i = 0; i < tiers.length; i++) {
    (function (v) {
      var affordable = bank >= v;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-btn' + (activeBuyIn === v ? ' on' : '') + (affordable ? '' : ' off');
      b.innerHTML = fmt(v) + '<small>' + (v >= GAMBLE_AT ? '豪赌桌' : (affordable ? '可入场' : '未达成')) + '</small>';
      if (Bridge.active) {
        b.disabled = true;      /* 带入在入场收费屏选，避免双源 */
        b.title = '带入已在入场时选定';
      } else if (!affordable) {
        b.disabled = true;
      } else {
        b.addEventListener('click', function () { career.set.buyIn = v; saveSet(); sfx.ui(); renderStart(); }, false);
      }
      buySeg.appendChild(b);
    })(tiers[i]);
  }
  $('#hint-buyin').textContent = Bridge.active
    ? (entryUsed
        ? '本场已结算 · 回大厅重新入场'
        : '带入 ' + fmt(activeBuyIn) + ' CBY（已在入场时扣除）')
    : '当前余额 ' + fmt(bank) + ' CBY';

  var pacSeg = $('#seg-pacing');
  pacSeg.innerHTML = '';
  var pk = ['long', 'flash'];
  for (i = 0; i < pk.length; i++) {
    (function (k) {
      var P = PACING[k];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-btn' + (career.set.pacing === k ? ' on' : '');
      b.innerHTML = P.label + '<small>' + P.hint + '</small>';
      b.addEventListener('click', function () { career.set.pacing = k; saveSet(); sfx.ui(); renderStart(); }, false);
      pacSeg.appendChild(b);
    })(pk[i]);
  }
  /* 【2026-10-03 去冗余】不再往这一格写 PACING.hint —— 它和下方按钮自己的
     小字（「盲注每 20 手翻倍」）逐字相同，属于把按钮复述一遍的噪音。 */
  $('#hint-pacing').textContent = '';

  var aiSeg = $('#seg-ai');
  aiSeg.innerHTML = '';
  for (i = 2; i <= 5; i++) {
    (function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-btn' + (career.set.aiCount === v ? ' on' : '');
      b.innerHTML = v + '<small>人</small>';
      b.addEventListener('click', function () { career.set.aiCount = v; saveSet(); sfx.ui(); renderStart(); }, false);
      aiSeg.appendChild(b);
    })(i);
  }

  var eqSeg = $('#seg-eq');
  eqSeg.innerHTML = '';
  var eqOpts = [{ v: true, t: '开', s: '带教练' }, { v: false, t: '关', s: '纯手感' }];
  for (i = 0; i < eqOpts.length; i++) {
    (function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-btn' + (career.set.winrateOn === o.v ? ' on' : '');
      b.innerHTML = o.t + '<small>' + o.s + '</small>';
      b.addEventListener('click', function () { career.set.winrateOn = o.v; saveSet(); sfx.ui(); renderStart(); }, false);
      eqSeg.appendChild(b);
    })(eqOpts[i]);
  }

  var md = $('#medals');
  md.innerHTML = '';
  for (i = 0; i < ACHS.length; i++) {
    var a = ACHS[i];
    var el = document.createElement('span');
    el.className = 'medal' + (hasAch(a.key) ? '' : ' off');
    el.textContent = a.label;
    el.title = a.desc;
    md.appendChild(el);
  }

  var ok = canStart();
  var btn = $('#btn-start-game');
  btn.disabled = !ok;
  var gambleNow = activeBuyIn >= GAMBLE_AT;
  var entryDone = Bridge.active && (entryUsed || (Bridge.buyIn() | 0) <= 0);
  btn.textContent = ok
    ? (gambleNow ? '入座豪赌桌' : '开始生涯')
    : (entryDone ? '本场带入已结算 · 请回大厅重新入场' : '余额不足 · 需 ' + fmt(MIN_BUYIN) + ' CBY');
  var tip = $('#start-tip');
  /* 【2026-10-03】这一段是**状态提示**，不是规则说明 —— 只在"需要玩家改变行为"时给一句，
     其余情况（一切正常）留空。此前无论什么状态都铺两行解释，等于把说明书写在按钮下面。 */
  if (!ok) {
    tip.innerHTML = entryDone
      ? '本场带入已结算 · 点右上角「关闭」回大厅重新入场'
      : '余额 ' + fmt(bank) + ' 不足最低带入 ' + fmt(MIN_BUYIN) + ' · 去别的游戏赢回来，或领每日签到';
  } else if (gambleNow) {
    tip.innerHTML = '同桌带入是你的 <b>2~5 倍</b>，且牌技顶级 —— <span style="color:#c98a6a">长期打下去，亏的通常是你。</span>';
  } else {
    tip.innerHTML = bank < MIN_BUYIN ? '余额已全部上桌 · 本场结束后按比例回账' : '';
  }
}

function animateBank(from) {
  var to = career.bank.bank;
  if (from === to) return;
  var t0 = Date.now(), dur = 460;
  (function step() {
    if (!alive) return;
    var k = Math.min(1, (Date.now() - t0) / dur);
    var v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    var a = $('#life-bank'); if (a) a.textContent = fmt(v);
    var b = $('#hud-bank'); if (b) b.textContent = fmt(v);
    if (k < 1) requestAnimationFrame(step);
  })();
}

function sweepLife() {
  var el = document.querySelector('.life');
  if (!el) return;
  el.classList.remove('sweep');
  void el.offsetWidth;
  el.classList.add('sweep');
  later(function () { if (el) el.classList.remove('sweep'); }, 1000);
}

function switchView(id) {
  var a = $('#view-start'), b = $('#view-game');
  if (a) a.classList.toggle('hidden', id !== 'view-start');
  if (b) b.classList.toggle('hidden', id !== 'view-game');
}

/* ============================================================
   横屏侧栏（2026-10-02）
   ------------------------------------------------------------
   作者确认手机纯横屏游玩：瓶颈是**高度**（915×412 有 915px 宽却只有 412px 高）。
   开局页原来把「每日任务 + 勋章」堆在主卡下方，纵向占 ~91px，
   把主操作「开始生涯」推到 t=737（完全在屏幕外）。
   这里在横屏档把这两块**搬进右侧独立一列**（宽度有的是），
   主卡高度随之从 504px 降到 ~430px，主操作回到首屏。
   实现要点：
     · 只搬 DOM 节点、不重建内容 —— 任务由 Task.refresh() 按 id 渲染，
       节点被移动到 .start-side 后 id 不变，渲染照旧生效。
     · 桌面/竖屏（max-height>520px）走 CSS 默认分支，两块仍在主卡内，行为零变化。
     · 用 matchMedia 监听切换，旋转屏幕/改窗口大小时自动搬回或搬出。
   ============================================================ */
/* 【2026-10-03】与 CSS 同步：横屏（而不只是矮屏横屏）就把任务/勋章搬到侧栏。
   headless 实测 1280x720 下开始页主操作会被推出首屏，PC 与手机本就不该两套布局。 */
var _landMq = (window.matchMedia ? window.matchMedia('(orientation: landscape)') : null);
function layoutStartRail() {
  var card = document.querySelector('#view-start .start-card');
  if (!card) return;
  var side = document.getElementById('start-side');
  if (!side) {
    side = document.createElement('div');
    side.id = 'start-side';
    side.className = 'start-side';
    card.parentNode.insertBefore(side, card.nextSibling);
  }
  var tf = document.getElementById('task-field');
  var md = document.getElementById('medals');
  var land = !!(window.innerWidth > window.innerHeight);
  try { document.body.classList.toggle('vp-landscape', land); } catch (eCls) {}
  if (land) {
    if (tf && tf.parentNode !== side) side.appendChild(tf);
    if (md && md.parentNode !== side) side.appendChild(md);
  } else {
    if (tf && tf.parentNode === side) card.appendChild(tf);   // 回主卡原位（末尾之前）
    if (md && md.parentNode === side) {
      var tip = document.getElementById('start-tip');
      if (tip && tip.parentNode === card) card.insertBefore(md, tip);
      else card.appendChild(md);
    }
  }
}
if (_landMq) {
  var _onLand = function () { try { layoutStartRail(); } catch (eL) {} };
  if (_landMq.addEventListener) _landMq.addEventListener('change', _onLand);
  else if (_landMq.addListener) _landMq.addListener(_onLand);
  window.addEventListener('resize', function () { try { layoutStartRail(); } catch (eR) {} }, false);
}

/* 进入开局页：唯一的时间入口（真值同步 + 世界同桌预取 + 签到提示） */
function showStart() {
  if (G) G.sessionOver = true;
  clearAllTimers();
  var beforeBank = career.bank.bank;
  var today = todayStr();
  var r = Daily.ensure(today);
  switchView('view-start');
  layoutStartRail();
  renderStart();
  if (r.changed && r.topped && career.bank.bank !== beforeBank) {
    animateBank(beforeBank);
    sweepLife();
    sfx.quota();
  }
  if (r.rollback) toast('检测到日期早于上次进入，已跳过今日补足', 'bad');
  if (Sign.canClaimToday(today)) showSignCard();

  /* ★ 2026-09-29：进页即同步真值 + 预取世界同桌（异步，回来后刷新界面）。
     顺序很重要：先拉钱包（决定余额与带入），再抽同桌（带入影响 AI 倍数）。 */
  syncBankFromWallet(function () {
    prefetchSeats(function () { try { renderStart(); } catch (e) {} });
  });
  Task.refresh();
}

function startGame() {
  if (!canStart()) {
    toast(entryUsed || (Bridge.active && (Bridge.buyIn() | 0) <= 0)
      ? '本次入场的带入已结算 · 请关闭回大厅重新入场'
      : '余额低于最低带入 ' + fmt(MIN_BUYIN) + ' CBY · 去别的游戏或签到回血', 'bad');
    return;
  }
  clearAllTimers();
  G = makeSession();
  /* §4.1.1：shell 内带入已由宿主收费屏**真实扣除**，镜像在入场时已与钱包对齐，
     此处**不得再扣一次**（旧代码在此对镜像二次扣减，导致 HUD 长期比真值少一个带入）。 */
  if (!Bridge.active) { career.bank.bank -= G.buyIn; saveBank(); }
  switchView('view-game');
  renderHud();
  startHand();
}

function closePage() {
  alive = false;
  clearAllTimers();
  var doClose = function () {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ __csh: 'texas-close' }, '*');
    } else if (typeof window.close === 'function') {
      window.close();
    }
    document.body.style.display = 'none';
  };
  try {
    /* ★ 2026-09-29 恶性 BUG 连带修复：关窗前未结算就先结算（幂等，与廿一点同款）。
       没开过局（还停在开局页）→ chips = 带入 = 全额退款；
       牌局中途直接关窗 → 按手上筹码结算，绝不让已扣的带入凭空蒸发。
       结算失败时不再关窗（§审计 B-12）：关了窗提示就没人看见，钱滞留无自救路径。 */
    if (Bridge.active && !entryUsed && (Bridge.buyIn() | 0) > 0) {
      var biRef = Bridge.buyIn() | 0;
      var chipsNow = (G && !G.sessionOver) ? Math.max(0, Math.floor(G.players[0].chips)) : biRef;
      entryUsed = true;
      Bridge.settleSession({
        key: 'texas', buyIn: biRef, chips: chipsNow,
        seats: (G && !G.sessionOver && G.seats) || [],
        gamble: !!(G && !G.sessionOver && G.gamble),
      }, function (ok) {
        if (ok === false) {
          entryUsed = false;
          alive = true;
          document.body.style.display = '';
          toast('结算未成功，带入未入账 · 请勿重复开局，稍后再关闭重试', 'bad');
          return;
        }
        doClose();
      });
      return;
    }
    doClose();
  } catch (e) {
    try { document.body.style.display = 'none'; } catch (e2) {}
  }
}

/* 宿主「去结算」按钮（settle-request）：此前全扩展没人接这条消息，
   按下去毫无反应 —— 现在德州如实响应：
   · 牌局进行中 → 走正常收工结算（弹结算横幅）；
   · 还没开局 → 全额退回带入并回到开局页（按钮文字随之变为"回大厅重新入场"）。 */
window.addEventListener('message', function (ev) {
  var d = ev && ev.data;
  if (!d || d.__csh !== 'settle-request') return;
  try {
    if (G && !G.sessionOver) { endSession('quit'); return; }
    if (Bridge.active && !entryUsed && (Bridge.buyIn() | 0) > 0) {
      var biReq = Bridge.buyIn() | 0;
      entryUsed = true;
      Bridge.settleSession({ key: 'texas', buyIn: biReq, chips: biReq, seats: [], gamble: false }, function (ok) {
        toast(ok ? '未开局离场 · 带入 ' + fmt(biReq) + ' CBY 已全额退回' : '退款未成功，请截图反馈', ok ? 'good' : 'bad');
        syncBankFromWallet(function () { showStart(); });
      });
    }
  } catch (eSR) {}
}, false);

/* ============================================================
   事件绑定
   ============================================================ */
/* ★ btn-close（页面自带关闭）已移除：壳顶带已有关闭，双按钮冗余
   ★ btn-quit（topbar「收工」）已移除（2026-10-03 用户实机反馈）：与壳顶带关闭
      完全同一条结算链路（closePage 幂等结算：未开局全额退款 / 中途按手上筹码结算），
      双按钮纯属冗余。退出 = 壳顶带「关闭」或 Esc。 */
$('#btn-start-game').addEventListener('click', startGame);
$('#btn-sign-go').addEventListener('click', function (e) { e.stopPropagation(); doSign(); });
$('#sign-card').addEventListener('click', function (e) { e.stopPropagation(); });
$('#sign-mask').addEventListener('click', doSign);
$('#btn-raise-go').addEventListener('click', function () {
  applyAction(0, 'raise', Number($('#raise-slider').value));
});
$('#btn-raise-cancel').addEventListener('click', function () {
  $('#raise-panel').classList.add('hidden');
});

/* 按钮点击音：一处委托覆盖全部按钮 */
document.addEventListener('click', function (e) {
  var t = e.target;
  if (t && t.closest && t.closest('button')) sfx.ui();
}, true);

/* Esc：签到卡 → 加注面板 → 页面（三条关闭链路行为一致） */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (!$('#sign-mask').classList.contains('hidden')) { doSign(); return; }
    if (!$('#raise-panel').classList.contains('hidden')) { $('#raise-panel').classList.add('hidden'); return; }
    if (!$('#banner').classList.contains('hidden')) return;   /* 横幅需显式选择 */
    closePage();
    return;
  }
  if (!G || G.over || G.sessionOver || G.toAct !== 0) return;
  var k = String(e.key || '').toLowerCase();
  if (k === 'f') applyAction(0, 'fold');
  else if (k === 'c') applyAction(0, 'check');
  else if (k === 'r') applyAction(0, 'raise', raiseTo(0.5, G.players[0]));
  else if (k === 'a') applyAction(0, 'allin');
});

/* 页面销毁：iframe 被导航到 about:blank / 遮罩移除时，停掉一切定时器 */
function onTeardown() { alive = false; clearAllTimers(); }
window.addEventListener('pagehide', onTeardown);
window.addEventListener('beforeunload', onTeardown);
window.addEventListener('unload', onTeardown);

/* ---------- 启动 ---------- */
if (Bridge.active) {
  /* §4.1.1：先向宿主统一钱包同步本金与带入，再进开局页 */
  Bridge.pull(function () { syncBankFromWallet(function () { showStart(); }); });
} else {
  showStart();
}

})();
</script>
</body>
