<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>池子魔将 · 音频试听台</title>
<!--
  音频试听台（2026-09-30）
  ============================================================================
  用途：离线双击打开，试听全部 BGM 与音效，无需启动无名杀。
  直接引用 ../core/csh_bgm.js 与 ../core/csh_sfx.js 的**同一份源码**
  （两者都是零 import 的经典脚本，可被任意页面 <script> 直接加载）。
  改音频配方后刷新本页即可听新版本，不用进游戏。
  ============================================================================
-->
<style>
  :root{
    --bg:#0B0805; --paper:#14110C; --paper2:#100D08; --light:#282319;
    --gold:#D8B46A; --gold-hi:#F0E0B4; --gold-line:rgba(216,180,106,.28); --gold-fill:rgba(216,180,106,.07);
    --fg:#F0E0B4; --text:#E8D9B8; --dim:#92825E;
    --r:12px; --r-sm:8px; --pill:999px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px 18px 60px;
    background:radial-gradient(120% 80% at 50% 0%,var(--light) 0%,var(--paper) 45%,var(--bg) 100%);
    color:var(--text);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }
  h1{margin:0 0 6px;font-size:20px;color:var(--fg);letter-spacing:2px;font-weight:600}
  .sub{color:var(--dim);font-size:12px;margin-bottom:22px}
  h2{font-size:13px;color:var(--gold);letter-spacing:1px;margin:26px 0 10px;
     padding-bottom:7px;border-bottom:1px solid var(--gold-line);font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  button{
    font:inherit;cursor:pointer;color:var(--text);background:var(--paper2);
    border:1px solid var(--gold-line);border-radius:var(--r-sm);padding:8px 13px;min-height:38px;
    transition:border-color .15s,background .15s,color .15s;
  }
  button:hover{border-color:rgba(216,180,106,.55);background:var(--light)}
  button.on{background:var(--gold-fill);border-color:var(--gold);color:var(--gold-hi)}
  .track{
    display:flex;align-items:flex-start;gap:12px;padding:12px 14px;margin-bottom:9px;
    background:var(--paper2);border:1px solid rgba(216,180,106,.13);border-radius:var(--r);
    transition:border-color .15s;
  }
  .track.on{border-color:var(--gold);background:var(--gold-fill)}
  .track .meta{flex:1;min-width:0}
  .track .t{color:var(--fg);font-weight:600;font-size:14px}
  .track .d{color:var(--dim);font-size:12px;margin-top:2px}
  .track .tag{color:var(--gold);font-size:11px;margin-top:3px}
  .track button{flex:0 0 auto;min-width:76px}
  .grid{display:flex;flex-wrap:wrap;gap:7px}
  .sfx{
    padding:7px 11px;background:var(--paper2);border:1px solid rgba(216,180,106,.13);
    border-radius:var(--pill);font-size:12.5px;color:var(--text);
  }
  .sfx:active{background:var(--gold-fill);border-color:var(--gold)}
  .grp{margin-bottom:14px}
  .grp .gt{color:var(--dim);font-size:11.5px;margin-bottom:6px;letter-spacing:.5px}
  .hint{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.7}
  kbd{background:var(--light);border:1px solid var(--gold-line);border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>

<h1>池 子 魔 将 · 音 频 试 听 台</h1>
<div class="sub">BGM 与音效均为 Web Audio 实时合成，零音频文件 · 直接引用扩展内的同一份源码</div>

<div class="bar">
  <button id="btn-unlock" class="on">点此解锁音频</button>
  <span style="color:var(--dim);font-size:12px">音乐音量</span>
  <button data-bvol="0">0</button>
  <button data-bvol="30">30</button>
  <button data-bvol="60">60</button>
  <button data-bvol="100">100</button>
  <span style="color:var(--dim);font-size:12px">音效音量</span>
  <button data-svol="0">0</button>
  <button data-svol="30">30</button>
  <button data-svol="60">60</button>
  <button data-svol="100">100</button>
</div>

<h2>一、背景音乐（BGM）</h2>
<div id="tracks"></div>
<div class="hint">每首曲子为 4~8 小节循环，第 2 遍会走「变化句」避免听腻。切换曲目会有 1.2s 淡入淡出。</div>

<h2>二、音效（SFX）</h2>
<div id="sfx"></div>
<div class="hint">点击任意音效即播放。带 <kbd>opt</kbd> 的条目（如 hit 分材质）会自动带参数试听。</div>

<h2>三、诊断</h2>
<div class="hint" id="diag">—</div>

<script src="../core/csh_sfx.js"></script>
<script src="../core/csh_bgm.js"></script>
<script>
(function(){
  var S = window.CSH_SFX, B = window.CSH_BGM;
  var TRACK_INFO = {
    lobby:     { t: "大厅 / 调试面板", d: "悠远的中式五声，古筝拨弦 + 长音", tag: "宫调式 · 66 BPM" },
    texas:     { t: "德州扑克",       d: "小调切分，克制的紧张感（牌桌心理战）", tag: "自然小调 · 84 BPM" },
    doudizhu:  { t: "斗地主",         d: "欢快五声，锣鼓点", tag: "五声大调 · 104 BPM" },
    uno:       { t: "UNO",            d: "轻快明亮，四四拍摇摆", tag: "大调 · 112 BPM" },
    blackjack: { t: "廿一点",         d: "沉稳赌场，圆舞曲感", tag: "小调三拍 · 78 BPM" },
  };

  /* ---- BGM 列表 ---- */
  var host = document.getElementById("tracks");
  Object.keys(B.TRACKS).forEach(function(k){
    var info = TRACK_INFO[k] || { t: k, d: "", tag: "" };
    var row = document.createElement("div");
    row.className = "track"; row.dataset.key = k;
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = '<div class="t"></div><div class="d"></div><div class="tag"></div>';
    meta.querySelector(".t").textContent = info.t;
    meta.querySelector(".d").textContent = info.d;
    meta.querySelector(".tag").textContent = info.tag;
    var btn = document.createElement("button");
    btn.textContent = "▶ 播放";
    btn.onclick = function(){
      if (B.current() === k && B.isPlaying()) { B.stop(); }
      else { B.play(k); }
      setTimeout(paint, 60);
    };
    row.appendChild(meta); row.appendChild(btn);
    host.appendChild(row);
  });
  function paint(){
    Array.prototype.forEach.call(host.children, function(row){
      var on = B.current() === row.dataset.key && B.isPlaying();
      row.classList.toggle("on", on);
      row.querySelector("button").textContent = on ? "■ 停止" : "▶ 播放";
    });
  }

  /* ---- SFX 列表（按点号前缀分组） ---- */
  var sHost = document.getElementById("sfx");
  var names = (S && S.list) ? S.list() : [];
  var groups = {};
  names.forEach(function(n){
    var g = n.indexOf(".") > 0 ? n.split(".")[0] : "其他";
    (groups[g] = groups[g] || []).push(n);
  });
  var ORDER = ["bow","arrow","hit","leak","wave","settle","combo","scope","breath","slowmo",
               "friendly","miss","enemy","hurt","card","chip","bomb","uno","win","lose",
               "badge","sign","quota","stone","bust","bj","ins","streak","cap","redeem",
               "rank","allin","lord","spring","jackpot","ui"];
  var keys = Object.keys(groups).sort(function(a,b){
    var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    if (ia < 0) ia = 999; if (ib < 0) ib = 999;
    return ia - ib;
  });
  var SPECIAL = {
    "hit":     [{ label: "hit · 肉体", opt: { mat: "body" } },
                { label: "hit · 甲盾", opt: { mat: "shield" } },
                { label: "hit · 金属", opt: { mat: "metal" } },
                { label: "hit · 沙袋", opt: { mat: "sand" } },
                { label: "hit · 爆头", opt: { mat: "head" } }],
    "streak":  [{ label: "streak · n=3", opt: { n: 3 } },
                { label: "streak · n=8", opt: { n: 8 } }],
    "combo.up":[{ label: "combo.up · n=10", opt: { n: 10 } }]
  };
  keys.forEach(function(g){
    var box = document.createElement("div");
    box.className = "grp";
    var gt = document.createElement("div");
    gt.className = "gt"; gt.textContent = "「" + g + "」";
    var grid = document.createElement("div");
    grid.className = "grid";
    groups[g].forEach(function(n){
      var variants = SPECIAL[n] || [{ label: n, opt: null }];
      variants.forEach(function(v){
        var b = document.createElement("button");
        b.className = "sfx"; b.textContent = v.label;
        b.onclick = function(){ try { S.play(n, v.opt); } catch(e){} };
        grid.appendChild(b);
      });
    });
    box.appendChild(gt); box.appendChild(grid);
    sHost.appendChild(box);
  });

  /* ---- 音量按钮 ---- */
  function paintVol(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-bvol]"), function(b){
      b.classList.toggle("on", parseInt(b.dataset.bvol,10) === B.volume());
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-svol]"), function(b){
      b.classList.toggle("on", parseInt(b.dataset.svol,10) === (S && S.volume ? S.volume() : -1));
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-bvol]"), function(b){
    b.onclick = function(){ B.setVolume(parseInt(b.dataset.bvol,10)); paintVol(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-svol]"), function(b){
    b.onclick = function(){ if (S && S.setVolume) S.setVolume(parseInt(b.dataset.svol,10)); paintVol(); };
  });

  document.getElementById("btn-unlock").onclick = function(){
    try { if (S && S.unlock) S.unlock(); } catch(e){}
    paintVol();
    this.textContent = "音频已解锁";
  };

  /* ---- 诊断 ---- */
  function diag(){
    var ac = B._context ? B._context() : null;
    document.getElementById("diag").textContent =
      "BGM 引擎：" + (B ? "OK" : "缺失") +
      " · 曲目 " + (B && B.TRACKS ? Object.keys(B.TRACKS).length : 0) + " 首" +
      " · 音效 " + names.length + " 个" +
      " · AudioContext：" + (ac ? ac.state : "未创建") +
      " · BGM.lastError：" + (B && B.lastError ? (B.lastError() || "无") : "-") +
      " · SFX.lastError：" + (S && S.lastError ? (S.lastError() || "无") : "-");
  }
  diag();
  setInterval(function(){ paint(); diag(); }, 700);
  paintVol();
})();
</script>
</body>
</html>
