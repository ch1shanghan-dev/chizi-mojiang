function payloadFor(cmd){

    case "shell-wallet": return { data: { pc: 2845600, pcPeak: 3120000, streak: 7, signedToday: false, signNext: 800,

        world: { chars: 98, hands: 100000, retired: 7, richestFund: 12400000, tier3: 6, skillTop: 0.94 },

    case "shell-rank-all": return { data: { ranks: RANKS.map(function(r){ return { lv:r[0], merit:r[1], name:r[2] }; }),

        news: NEWS, stats: { chars:98, hands:100000, retired:7 },

window.addEventListener("message", function(ev){
  var d = ev.data; if (!d || typeof d !== "object" || typeof d.__csh !== "string") return;
  if (/-ack$/.test(d.__csh) || d.__csh === "csh-skin-change") return;
  var p = payloadFor(d.__csh);
  if (!p) return;
  var ack = { __csh: d.__csh + "-ack", req: d.req, ok: true, data: p.data };
  ev.source.postMessage(ack, "*");
}, false);
